l of 2.1 mEq/L with coarse tremor and ataxia indicates lithium toxicity, so the dose is held and the provider notified.", "Restricting sodium increases renal reabsorption of lithium and would push an already toxic level higher, making this advice dangerous.", "Administering another dose during toxicity compounds the problem, and food will not lower a serum level of 2.1 mEq/L.", "Waiting four hours lets toxicity progress toward seizures, dysrhythmias, and renal failure while the drug continues to accumulate."]}, {"q": "A client admitted 12 hours after his last alcoholic drink has a blood pressure of 168/98 mm Hg, heart rate 112/min, diaphoresis, generalized tremors, and a CIWA-Ar score of 18. Which intervention is the priority?", "opts": ["Provide a quiet, dimly lit room and reorient the client frequently", "Encourage oral fluids and a high-calorie diet", "Apply soft wrist restraints to prevent injury", "Administer the prescribed PRN lorazepam"], "a": 3, "r": "A CIWA-Ar score above 8 to 10 with autonomic hyperactivity calls for benzodiazepine treatment, which prevents progression to withdrawal seizures and delirium tremens, a physiologic emergency. Environmental measures are supportive and appropriate but will not stop escalating withdrawal, and restraints are a last resort that would increase agitation and injury risk.", "why": ["A quiet room and reorientation are appropriate supportive measures but will not halt autonomic hyperactivity or prevent withdrawal seizures.", "Fluids and calories are needed in alcohol withdrawal, yet they address neither the CIWA-Ar score of 18 nor the seizure risk.", "Restraints are a last resort that increase agitation and injury risk and do nothing to treat the underlying withdrawal physiology.", "Correct. A CIWA-Ar of 18 with tachycardia, hypertension, and tremor requires benzodiazepine therapy to prevent seizures and delirium tremens."]}, {"q": "A client receiving haloperidol develops a temperature of 39.8 C (103.6 F), lead-pipe muscle rigidity, blood pressure 158/94 mm Hg, confusion, and an elevated creatine kinase level. Which action should the nurse take?", "opts": ["Administer the prescribed benztropine for extrapyramidal symptoms", "Withhold the haloperidol and notify the provider immediately", "Encourage ambulation in the hallway to reduce muscle stiffness", "Recheck the temperature in 1 hour and reassess"], "a": 1, "r": "Hyperthermia, rigidity, autonomic instability, altered mental status, and elevated CK indicate neuroleptic malignant syndrome, a life-threatening reaction requiring immediate discontinuation of the antipsychotic and urgent medical management. Benztropine treats acute dystonia and pseudoparkinsonism but does nothing for NMS and would delay definitive treatment.", "why": ["Benztropine treats acute dystonia and pseudoparkinsonism; it has no effect on neuroleptic malignant syndrome and would delay definitive treatment.", "Correct. Fever, lead-pipe rigidity, autonomic instability, confusion, and elevated CK indicate neuroleptic malignant syndrome, so the antipsychotic is stopped immediately.", "Ambulating a client with hyperthermia and rigidity increases muscle breakdown and risks collapse; this rigidity does not respond to activity.", "Rechecking in an hour delays treatment of a condition with substantial mortality that deteriorates rapidly."]}, {"q": "A client with anorexia nervosa (BMI 15) is on day 3 of nutritional rehabilitation. Which laboratory value should the nurse report to the provider first?", "opts": ["Serum phosphorus 1.4 mg/dL", "Serum sodium 137 mEq/L", "Hemoglobin 11.4 g/dL", "Weight gain of 0.4 kg (0.9 lb) since yesterday"], "a": 0, "r": "Hypophosphatemia is the hallmark of refeeding syndrome and can precipitate cardiac failure, respiratory failure, and dysrhythmias, making it the priority report. The sodium level is normal, mild anemia is expected in malnutrition, and modest weight gain is a desired treatment outcome rather than a complication.", "why": ["Correct. Hypophosphatemia of 1.4 mg/dL on day three of refeeding signals refeeding syndrome, which can cause cardiac and respiratory failure.", "A sodium of 137 mEq/L falls within the normal range of 135 to 145 and is not a refeeding concern.", "A hemoglobin of 11.4 g/dL reflects the mild anemia commonly seen in malnutrition and does not require urgent reporting.", "Gaining 0.4 kg in one day is a desired outcome of nutritional rehabilitation rather than a complication to report."]}, {"q": "A client with schizophrenia refuses his dinner tray and tells the nurse, \"The voices are telling me the food has been poisoned.\" Which response by the nurse is most therapeutic?", "opts": ["There is nothing wrong with your food; I ate the same meal myself.", "Why would anyone on this unit want to poison your food?", "I don't hear the voices, but I can see this is frightening for you. What are the voices telling you?", "If you don't eat, we will have to consider tube feeding."], "a": 2, "r": "Presenting reality without arguing, acknowledging the client's feelings, and assessing the content of command hallucinations builds trust and identifies safety risks. Directly denying the belief or demanding an explanation with \"why\" challenges the delusion, increases defensiveness, and shuts down communication.", "why": ["Denying the client's experience and offering personal proof argues against the delusion, increasing defensiveness instead of building trust.", "A why question demands that the client justify a delusional belief he cannot explain, which shuts down communication.", "Correct. Presenting reality gently, validating the fear, and exploring hallucination content builds trust and screens for dangerous command hallucinations.", "Threatening tube feeding is coercive, reinforces the client's paranoia about the staff, and damages the therapeutic relationship."]}, {"q": "A client who started sertraline 5 days ago also takes tramadol and an herbal St. John's wort supplement. The nurse notes agitation, diaphoresis, hyperreflexia, ankle clonus, and a temperature of 38.6 C (101.5 F). Which action should the nurse take first?", "opts": ["Encourage rest and decrease environmental stimulation", "Administer the PRN acetaminophen for the fever", "Obtain a urine drug screen", "Withhold the next dose of sertraline and notify the provider immediately"], "a": 3, "r": "Agitation, hyperreflexia, clonus, and hyperthermia in a client on multiple serotonergic agents indicate serotonin syndrome, which requires immediate discontinuation of the offending drugs and medical management. Giving acetaminophen treats a symptom while the underlying serotonergic excess continues to progress toward seizures and cardiovascular collapse.", "why": ["Rest and reduced stimulation are comfort measures that do nothing about the serotonergic excess causing clonus and hyperthermia.", "Acetaminophen treats one symptom while serotonin syndrome continues to progress toward seizures and cardiovascular collapse.", "A urine drug screen delays treatment when the cause is already evident from the sertraline, tramadol, and St. John's wort combination.", "Correct. Clonus, hyperreflexia, diaphoresis, and fever on three serotonergic agents indicate serotonin syndrome, requiring immediate drug discontinuation and medical management."]}, {"q": "A client in an acute manic episode paces the hallway continuously, has not completed a meal in 2 days, and has lost 3 kg (6.6 lb). Which intervention is most appropriate?", "opts": ["Serve all meals in the dining room with the other clients", "Offer high-calorie finger foods and fluids the client can carry while walking", "Insist that the client remain seated for 30 minutes at each meal", "Restrict unit privileges until the client finishes a full meal"], "a": 1, "r": "Portable, high-calorie finger foods meet the physiologic need for nutrition without requiring the hyperactive client to sit still, which he cannot yet do. Insisting the client sit through a meal or using privileges as leverage sets up a power struggle and does not correct the immediate nutritional deficit.", "why": ["The dining room is highly stimulating and requires sitting still, which this manic client cannot do, so intake stays poor.", "Correct. Portable high-calorie finger foods and fluids meet the urgent nutritional need without requiring the hyperactive client to sit still.", "Insisting on 30 seated minutes is unrealistic during acute mania and produces a power struggle instead of calories.", "Withholding privileges as leverage is punitive, damages the therapeutic relationship, and leaves the 3 kg weight loss uncorrected."]}, {"q": "A veteran with PTSD suddenly begins shouting and crouching behind a chair in the day room after a fire alarm test, appearing unaware of his surroundings. Which action should the nurse take first?", "opts": ["Speak calmly, orient the client to the present time and place, and guide him to a quieter area", "Ask the client to describe the traumatic combat event in detail", "Place the client in seclusion until he becomes calm", "Administer the PRN antipsychotic immediately"], "a": 0, "r": "During a flashback the client needs grounding: a calm voice, reorientation to the present, and reduced stimuli restore safety by the least restrictive means. Exploring trauma details during the dissociative episode intensifies the flashback, and seclusion is reserved for imminent danger after less restrictive measures fail.", "why": ["Correct. Grounding with a calm voice, reorientation to the present, and reduced stimuli ends the flashback by the least restrictive means.", "Asking for combat details during a dissociative flashback intensifies re-experiencing; trauma processing belongs in planned therapy sessions.", "Seclusion is reserved for imminent danger after less restrictive measures fail, and confinement would deepen this veteran's terror.", "Medication may be considered later, but chemical restraint before attempting grounding is not the least restrictive intervention."]}, {"q": "A client in the clinic waiting room becomes acutely short of breath with a heart rate of 124/min, chest tightness, and trembling, saying, \"I'm going to die.\" Which action should the nurse take first?", "opts": ["Provide detailed instruction on diaphragmatic breathing technique", "Leave the client alone in a room to reduce stimulation", "Stay with the client and give brief, calm, simple directions to breathe slowly with the nurse", "Explore childhood experiences that may have triggered the attack"], "a": 2, "r": "During a panic attack perceptual field is severely narrowed, so remaining present and giving short, simple, repetitive directions is the intervention the client can actually follow. Leaving the client alone increases terror and injury risk, and detailed teaching or insight-oriented exploration cannot be processed until anxiety decreases to a moderate level.", "why": ["Detailed breathing instruction cannot be absorbed during panic, when the perceptual field is severely narrowed.", "Leaving a panicking client alone increases terror and injury risk; the nurse's calm presence is itself the intervention.", "Correct. Staying present with brief, calm, repeated directions matches the narrowed perceptual field of panic and helps slow the breathing.", "Insight-oriented exploration of childhood requires no more than moderate anxiety and is useless while the client believes death is imminent."]}], "fundamentals": [{"q": "The nurse observes a nursing student preparing a sterile dressing change. Which action by the student requires the nurse to intervene?", "opts": ["The student opens the outermost flap of the sterile package away from the body first", "The student turns away from the sterile field to answer a coworker's question and then resumes the procedure", "The student holds sterile supplies above waist level and in front of the body", "The student pours sterile solution into a basin without touching the container to the basin rim"], "a": 1, "r": "A sterile field is considered contaminated whenever it is out of the practitioner's direct line of vision, so turning away requires setting up a new field. The other three actions are correct technique: the far flap is opened first, sterility is maintained above waist level and within view, and the solution container must not contact the receptacle.", "why": ["Opening the outermost flap away from the body first is correct technique and avoids reaching across the sterile field.", "Correct. A sterile field is considered contaminated whenever it leaves the practitioner's direct line of vision, so a new field is required.", "Holding sterile supplies above waist level and in front of the body maintains sterility and requires no intervention.", "Pouring solution without touching the container to the basin rim prevents contamination of the container edge and is proper technique."]}, {"q": "The nurse assesses a sacral wound with full-thickness skin loss in which subcutaneous fat is visible. There is no slough or eschar obscuring the wound base, and no muscle, tendon, or bone is exposed. How should the nurse stage this pressure injury?", "opts": ["Stage 1", "Stage 2", "Deep tissue pressure injury", "Stage 3"], "a": 3, "r": "Full-thickness loss with visible adipose tissue but no exposed muscle, tendon, or bone defines a stage 3 pressure injury. Stage 2 is partial thickness with a shiny or moist red-pink wound bed and no visible fat, so it would understage this wound and lead to an inadequate plan of care.", "why": ["Stage 1 describes intact skin with nonblanchable erythema, which badly understages a wound with full-thickness tissue loss.", "Stage 2 is partial thickness with a shiny, moist red-pink bed and no visible fat, so it does not fit exposed adipose tissue.", "Deep tissue pressure injury presents as intact or blistered skin with persistent deep purple discoloration, not an open wound with visible fat.", "Correct. Full-thickness loss with visible subcutaneous fat and no exposed muscle, tendon, or bone defines a stage 3 pressure injury."]}, {"q": "A client has a nasogastric tube whose placement was confirmed by x-ray on insertion yesterday. Before administering an intermittent tube feeding, which method should the nurse use to verify tube placement?", "opts": ["Aspirate gastric contents and test the pH of the aspirate", "Inject 30 mL of air into the tube while auscultating over the epigastrium", "Place the end of the tube in a cup of water and observe for bubbling", "Ask the client to speak and listen for hoarseness"], "a": 0, "r": "Aspirating fluid and checking for an acidic pH (about 5.5 or less) is the recommended bedside verification method between x-ray confirmations. The air-bolus auscultation method is unreliable because the whooshing sound transmits even when the tube is in the lung or esophagus, creating a serious aspiration risk.", "why": ["Correct. Aspirating gastric contents and finding an acidic pH of about 5.5 or less is the recommended bedside check between x-rays.", "The air-bolus auscultation method is unreliable because the whooshing sound transmits even when the tube sits in the lung or esophagus.", "The water bubbling test is outdated and unsafe, risks aspiration of water, and does not confirm gastric placement.", "Many clients speak normally with a misplaced feeding tube, so voice quality cannot rule out tracheal or esophageal placement."]}, {"q": "The nurse is reviewing indwelling urinary catheter care performed by a new staff member. Which observation requires the nurse to intervene?", "opts": ["The drainage bag is emptied every 8 hours using a separate graduated container for each client", "The catheter tubing is secured to the client's thigh", "The drainage bag is hung on the movable side rail of the bed", "Perineal care is performed with soap and water once daily and after bowel movements"], "a": 2, "r": "Hanging the bag on a movable side rail can raise it above bladder level and cause reflux of contaminated urine, and the bag may be dislodged when the rail moves; it must hang below the bladder on a fixed part of the frame and off the floor. The other actions correctly prevent catheter-associated urinary tract infection and traction on the urethra.", "why": ["Emptying every 8 hours using a separate graduated container for each client prevents cross-contamination and is correct practice.", "Securing the catheter tubing to the thigh prevents traction on the urethra and is a recommended catheter-care measure.", "Correct. A bag on a movable rail can rise above bladder level and cause reflux of contaminated urine or be dislodged when the rail moves.", "Daily perineal care with soap and water plus cleansing after bowel movements is the correct hygiene standard for indwelling catheters."]}, {"q": "The nurse obtains a blood pressure of 168/94 mm Hg in an obese client using a standard adult cuff that appears tight around the upper arm. Which action should the nurse take next?", "opts": ["Report the elevated reading to the provider immediately", "Reassess the blood pressure with a large adult cuff, because a cuff that is too small produces a falsely high reading", "Document the reading and recheck it in 4 hours", "Repeat the measurement in the thigh using the same cuff"], "a": 1, "r": "An undersized cuff requires more pressure to occlude the artery and falsely elevates the reading, so the nurse must obtain accurate data with a correctly sized cuff before acting. Reporting or documenting an invalid measurement violates the assessment step of the nursing process and could lead to unnecessary treatment.", "why": ["Reporting a reading taken with an undersized cuff means acting on invalid data and could prompt unnecessary antihypertensive treatment.", "Correct. A cuff that is too small requires more pressure to occlude the artery and falsely elevates readings, so accurate data must come first.", "Documenting an invalid measurement and waiting four hours records inaccurate data and delays discovery of the true blood pressure.", "Reusing the same too-small cuff on the thigh repeats the sizing error, and thigh readings normally differ from arm readings anyway."]}, {"q": "A client with right-sided pneumonia has an oxygen saturation of 90% on 2 L/min by nasal cannula. Which position should the nurse use to best improve oxygenation?", "opts": ["Left lateral position, with the unaffected lung dependent", "Right lateral position, with the affected lung dependent", "Prone with the head of the bed flat", "Trendelenburg position"], "a": 0, "r": "In unilateral lung disease, placing the good lung down directs gravity-dependent blood flow to well-ventilated alveoli and improves ventilation-perfusion matching. Lying on the affected side perfuses consolidated lung that cannot participate in gas exchange and worsens shunting and hypoxemia.", "why": ["Correct. Placing the unaffected left lung dependent directs gravity-dependent blood flow to well-ventilated alveoli and improves ventilation-perfusion matching.", "Lying on the affected right side perfuses consolidated lung that cannot exchange gas, worsening shunting and hypoxemia.", "Prone with the bed flat is a severe ARDS strategy, not routine unilateral pneumonia, and flat positioning limits diaphragmatic excursion.", "Trendelenburg pushes abdominal contents against the diaphragm, reducing lung expansion and lowering oxygenation further."]}, {"q": "A client refuses a scheduled dose of metoprolol, stating it makes him feel tired. Which action best reflects appropriate documentation and follow-up?", "opts": ["Chart that the client was uncooperative and refused his medications", "Have a family member sign a refusal form before charting the event", "Hold the medication and document the omission at the end of the shift", "Document the refusal in the client's own words with the reason given, the teaching provided, and notification of the provider"], "a": 3, "r": "Documentation must be objective, timely, and factual, and the provider must be notified so the regimen can be reevaluated; quoting the client preserves accuracy. Labeling the client \"uncooperative\" is a subjective judgment, and delaying charting until the end of the shift breaks the requirement for contemporaneous documentation.", "why": ["Charting that the client was uncooperative is a subjective judgment rather than objective fact and is inappropriate documentation.", "A competent adult may refuse medication without a family signature, so this delays charting and disregards the client's autonomy.", "Holding the drug is correct, but charting at shift end violates contemporaneous documentation requirements and omits provider notification entirely.", "Correct. Quoting the client, recording the reason and teaching, and notifying the provider is objective, timely, and allows the regimen to be reevaluated."]}, {"q": "The nurse teaches a client how to collect a midstream clean-catch urine specimen for culture. Which statement indicates that the client understands the instructions?", "opts": ["I will catch the very first part of my urine stream in the cup.", "I will cleanse myself by wiping from back to front before I start.", "I will begin urinating into the toilet, then move the cup into the stream to catch the middle portion.", "I can leave the covered cup on the bathroom counter until the nurse picks it up at the end of the shift."], "a": 2, "r": "Discarding the initial stream flushes urethral flora so the midstream portion reflects bladder urine, which is essential for an accurate culture. Collecting the first portion or wiping back to front introduces contaminating organisms, and specimens left at room temperature allow bacterial overgrowth and false results.", "why": ["The first portion of the stream carries urethral flora and would contaminate the culture with organisms not from the bladder.", "Wiping from back to front drags perineal and rectal bacteria toward the urethra and contaminates the specimen.", "Correct. Voiding first into the toilet flushes urethral flora so the midstream portion reflects true bladder urine for an accurate culture.", "Urine left at room temperature for hours allows bacterial overgrowth and falsely elevated colony counts, so it must be delivered or refrigerated promptly."]}, {"q": "A client is admitted with a 4-week history of cough, night sweats, and weight loss, and pulmonary tuberculosis is suspected. Which action should the nurse take before entering the client's room?", "opts": ["Place the client in a negative-pressure airborne infection isolation room and don a fit-tested N95 respirator", "Apply a surgical mask and gown before entering the room", "Place the client in a private room and initiate contact precautions", "Wear gloves and a face shield only"], "a": 0, "r": "Tuberculosis is transmitted by droplet nuclei that remain suspended in air, so airborne precautions with a negative-pressure room and an N95 respirator are required. A surgical mask does not filter droplet nuclei and contact precautions address a different transmission route, leaving the nurse and other clients unprotected.", "why": ["Correct. Tuberculosis spreads by droplet nuclei that stay suspended in air, requiring a negative-pressure room and a fit-tested N95 respirator.", "A surgical mask does not filter droplet nuclei and a gown targets contact spread, leaving the nurse unprotected from airborne transmission.", "A plain private room lacks negative pressure, and contact precautions address a transmission route different from that of tuberculosis.", "Gloves and a face shield guard against splash and contact exposure but provide no respiratory filtration against airborne bacilli."]}, {"q": "The nurse must reposition a 90 kg (198 lb) client up in bed. Which action demonstrates correct body mechanics and safe client handling?", "opts": ["Bending forward at the waist and pulling the client toward the head of the bed", "Keeping the feet close together to maintain a narrow base of support", "Raising the bed to waist level, widening the stance, and using a friction-reducing draw sheet with a second staff member", "Twisting at the waist while moving the client toward the bedside chair"], "a": 2, "r": "Working at waist height with a wide base of support, using leg muscles, and getting assistance with a friction-reducing device protects both the nurse and the client's skin. Bending at the waist or twisting the spine places shearing stress on the lumbar discs and is a leading cause of back injury in nursing.", "why": ["Bending forward at the waist and pulling loads the lumbar spine and is a leading cause of back injury among nurses.", "Keeping the feet close together narrows the base of support and reduces stability when moving a 90 kg client.", "Correct. Waist-height bed, a wide stance, and a friction-reducing draw sheet with a second staff member protect the nurse's back and the client's skin.", "Twisting at the waist while bearing weight places shearing stress on lumbar discs; the nurse should pivot the feet instead."]}], "prioritization-delegation": [{"q": "After receiving change-of-shift report on a medical unit, which client should the nurse assess first?", "opts": ["A client 2 days postoperative with a temperature of 38.1 C (100.6 F)", "A client with a fractured hip who rates pain 7 on a 0 to 10 scale", "A client with COPD whose respiratory rate is 30/min, who is using accessory muscles and speaking in two-word sentences", "A client scheduled for discharge who needs teaching about warfarin"], "a": 2, "r": "Accessory muscle use with two-word dyspnea signals impending respiratory failure, which takes priority under the ABCs. Pain and a low-grade postoperative fever are important but neither is immediately life threatening, and discharge teaching can be scheduled after unstable clients are stabilized.", "why": ["A temperature of 38.1 C on postoperative day two is common, warrants assessment, but is not an immediate threat to life.", "Pain rated 7 deserves prompt treatment, yet pain is not immediately life threatening and can be addressed after the airway problem.", "Correct. Accessory muscle use with two-word dyspnea and a rate of 30/min signals impending respiratory failure, the priority under the ABCs.", "Warfarin discharge teaching matters but can be scheduled once unstable clients have been assessed and stabilized."]}, {"q": "The charge nurse is assigning tasks on a busy surgical unit. Which task is appropriate to delegate to unlicensed assistive personnel (UAP)?", "opts": ["Assisting a stable postoperative client to ambulate in the hallway with a walker", "Reinforcing discharge teaching about a low-sodium diet", "Assessing a client's surgical incision for drainage and approximation", "Administering an oral pain medication to a client who is due"], "a": 0, "r": "Ambulating a stable client with an established plan is a standardized, predictable task within the UAP scope. Assessment, teaching, and medication administration require nursing judgment or licensure and cannot be delegated to UAP under the five rights of delegation.", "why": ["Correct. Ambulating a stable postoperative client with an established walker plan is a standardized, predictable task within the UAP scope.", "Reinforcing dietary teaching still requires nursing judgment about the client's understanding and cannot be delegated to unlicensed personnel.", "Assessing an incision for drainage and approximation is an assessment step reserved for the licensed nurse.", "Administering oral pain medication requires licensure, so UAP may not give it regardless of how stable the client is."]}, {"q": "A charge nurse is making assignments for a licensed practical nurse (LPN/LVN) on a medical-surgical unit. Which assignment is within the LPN's scope of practice?", "opts": ["Developing the individualized plan of care for a newly admitted client", "Administering oral and subcutaneous medications and monitoring a stable client who has a nasogastric tube to suction", "Performing the initial admission assessment on a client arriving from the emergency department", "Titrating an intravenous heparin infusion based on aPTT results"], "a": 1, "r": "LPNs may administer most routine medications and monitor stable clients with established plans of care. Initial assessment, care planning, and titration of high-alert IV infusions require the RN's independent judgment and cannot be delegated.", "why": ["Developing the individualized plan of care requires the RN's independent judgment and synthesis of admission assessment data.", "Correct. LPNs may give oral and subcutaneous medications and monitor stable clients with established plans, including one with nasogastric suction.", "The initial admission assessment must be performed by the RN, who establishes the baseline and builds the plan of care.", "Titrating a high-alert heparin infusion against aPTT results requires RN judgment and cannot be assigned to an LPN."]}, {"q": "The unlicensed assistive personnel reports the following to the nurse. Which report requires the nurse's immediate attention?", "opts": ["A client whose blood pressure is 148/86 mm Hg", "A client who has not voided in the 4 hours since returning from surgery", "A client who is requesting a snack before an early-morning laboratory draw", "A client who is restless and whose oxygen saturation dropped from 95% to 88% on 2 L/min nasal cannula"], "a": 3, "r": "A falling saturation with new restlessness is an early sign of hypoxia and is the highest priority by the ABCs. Postoperative urinary retention at 4 hours needs assessment soon, and the elevated blood pressure and the snack request are important but not immediately life threatening.", "why": ["A blood pressure of 148/86 mm Hg is mildly elevated and needs follow-up, but poses no immediate threat next to falling oxygenation.", "Not voiding four hours after surgery requires bladder assessment soon, yet retention is less urgent than developing hypoxia.", "A snack request before fasting laboratory work is a scheduling matter easily handled after urgent clinical problems.", "Correct. A saturation drop to 88% with new restlessness is early hypoxia, the highest priority under the ABCs, and demands immediate assessment."]}, {"q": "During triage after a multivehicle crash, which client should the nurse treat first?", "opts": ["An adult with an open chest wound that bubbles with respiration and asymmetric chest rise", "An adult with an open femur fracture and a palpable pedal pulse", "An adult with a 4-cm forehead laceration and a Glasgow Coma Scale score of 15", "An adult with full-thickness burns over 60% of the body surface and no spontaneous respirations"], "a": 0, "r": "An open pneumothorax with asymmetric chest rise is an immediately correctable airway and breathing threat, making this client the highest-priority emergent case. The apneic client with 60% full-thickness burns is triaged as expectant in a mass casualty event, and the fracture and laceration are delayed or minor categories.", "why": ["Correct. An open pneumothorax with asymmetric chest rise is an immediately correctable breathing threat, making this the highest-priority emergent client.", "An open femur fracture with a palpable pedal pulse is urgent but delayed category, since distal circulation remains intact.", "A forehead laceration with a Glasgow Coma Scale of 15 is a minor injury that can safely wait for treatment.", "Full-thickness burns over 60% with no spontaneous respirations is triaged expectant in mass casualty events, where resources go to salvageable clients."]}, {"q": "The RN is working with an experienced LPN/LVN. Which task must the RN perform rather than delegate?", "opts": ["Suctioning an established tracheostomy", "Inserting an indwelling urinary catheter", "Evaluating a client's response to the newly implemented plan of care", "Changing a sterile dressing on a chronic wound"], "a": 2, "r": "Evaluation, like assessment and care planning, is a nursing process step reserved for the RN and cannot be delegated. Tracheostomy suctioning, catheter insertion, and sterile dressing changes are technical skills within the LPN's scope when the client is stable.", "why": ["Suctioning an established tracheostomy is a technical skill within the LPN's scope when the client is stable.", "Inserting an indwelling urinary catheter is a sterile technical procedure LPNs are trained and licensed to perform.", "Correct. Evaluating the client's response to a newly implemented plan of care is a nursing process step reserved for the RN.", "Changing a sterile dressing on a chronic wound falls within LPN scope when the client is stable and the plan is established."]}, {"q": "A nurse from the postpartum unit is floated to a medical-surgical unit. Which client should the charge nurse assign to this nurse?", "opts": ["A client receiving a packed red blood cell transfusion for an upper gastrointestinal bleed", "A client 1 hour after cardiac catheterization with a femoral sheath site", "A client on a continuous insulin infusion for diabetic ketoacidosis", "A client with stable cellulitis of the lower leg receiving intravenous antibiotics"], "a": 3, "r": "Floated nurses should receive the most stable clients with predictable outcomes and skills common to all practice settings, such as routine IV antibiotics. Transfusion reactions, post-catheterization bleeding, and insulin titration in DKA all demand specialty knowledge that a postpartum nurse may not have, creating a safety risk.", "why": ["Monitoring a transfusion during an upper GI bleed requires recognition of reaction and hemorrhage patterns outside routine postpartum practice.", "A femoral sheath one hour after cardiac catheterization demands specialized site, bleeding, and pulse assessment this nurse may lack.", "Titrating a continuous insulin infusion for diabetic ketoacidosis requires critical care knowledge unfamiliar to a postpartum nurse.", "Correct. Stable cellulitis treated with routine IV antibiotics is a predictable assignment using skills common to all practice settings."]}, {"q": "The nurse has just received report on four clients. Which client should the nurse assess first?", "opts": ["A client with type 2 diabetes whose morning glucose is 210 mg/dL", "A client with a new tracheostomy who has thick secretions and audible gurgling with each breath", "A client with cirrhosis who has 2+ pitting edema of the lower extremities", "A client 1 day postoperative who reports nausea after breakfast"], "a": 1, "r": "Audible gurgling with thick secretions indicates a partially obstructed artificial airway, the highest priority under the ABCs, and requires immediate suctioning. Hyperglycemia, chronic edema, and postoperative nausea all need attention but none threatens airway patency.", "why": ["A morning glucose of 210 mg/dL needs treatment but is not an emergency compared with a threatened artificial airway.", "Correct. Audible gurgling with thick secretions through a new tracheostomy indicates partial airway obstruction requiring immediate suctioning.", "Two-plus pitting edema in cirrhosis is a chronic expected finding that does not threaten airway, breathing, or circulation right now.", "Postoperative nausea is uncomfortable and warrants an antiemetic, but it ranks well below an obstructed artificial airway."]}, {"q": "The nurse is supervising unlicensed assistive personnel on a medical unit. Which observed action requires the nurse to intervene?", "opts": ["The UAP places a blood pressure cuff on the arm containing an arteriovenous fistula", "The UAP raises the bed to waist height before giving a bed bath", "The UAP records the client's intake and output at the end of the shift", "The UAP assists a client with denture care before a meal"], "a": 0, "r": "Blood pressure measurement, venipuncture, and IV access are prohibited in an extremity with an AV fistula because pressure can thrombose the access the client depends on for dialysis. The other three actions are safe, appropriate UAP tasks that support body mechanics, monitoring, and hygiene.", "why": ["Correct. Cuff pressure on the fistula extremity can thrombose the access the client depends on for dialysis, so the nurse must intervene.", "Raising the bed to waist height before a bed bath is correct body mechanics and needs no correction.", "Recording intake and output at shift end is a routine measurement task appropriately within the UAP scope.", "Assisting a client with denture care before a meal is basic hygiene support entirely appropriate for the UAP."]}, {"q": "A clinic nurse is returning telephone messages. Which client should the nurse call back first?", "opts": ["A client taking levothyroxine who reports mild constipation", "A client 3 days postoperative who reports itching around the incision", "A client who started lisinopril yesterday and reports swelling of the lips and tongue since this morning", "A client with osteoarthritis asking when to take ibuprofen in relation to meals"], "a": 2, "r": "Lip and tongue swelling after starting an ACE inhibitor suggests angioedema, a potentially fatal airway emergency requiring immediate action. Incisional itching is a normal sign of healing, and the constipation and medication timing questions are non-urgent and can be addressed later.", "why": ["Mild constipation on levothyroxine may suggest underreplacement and merits a callback, but it carries no immediate danger.", "Itching around a three-day-old incision is a normal sign of healing and can be addressed after urgent calls.", "Correct. Lip and tongue swelling the day after starting lisinopril suggests angioedema, a potentially fatal airway emergency needing immediate action.", "A question about taking ibuprofen with meals is routine teaching with no time pressure attached."]}], "dosage-lab-values": [{"q": "A client is prescribed 1,000 mL of 0.9% sodium chloride to infuse over 8 hours by infusion pump. At what rate in mL/hr should the nurse set the pump?", "opts": ["62 mL/hr", "100 mL/hr", "133 mL/hr", "125 mL/hr"], "a": 3, "r": "Total volume divided by total time equals 1,000 mL / 8 hr = 125 mL/hr. Selecting 133 mL/hr would reflect dividing by 7.5 hours and would deliver excess fluid, a risk for clients with cardiac or renal compromise.", "why": ["62 mL/hr is half the correct rate, the result of dividing 1,000 mL by 16 hours instead of 8.", "100 mL/hr comes from dividing 1,000 mL by 10 hours rather than the ordered 8 hours, underinfusing the client.", "133 mL/hr reflects dividing 1,000 mL by 7.5 hours and would deliver excess fluid to a client with cardiac or renal compromise.", "Correct. Total volume divided by total time gives 1,000 mL divided by 8 hours, which equals 125 mL/hr."]}, {"q": "The nurse must infuse 500 mL of lactated Ringer's over 4 hours using gravity tubing with a drop factor of 15 gtt/mL. How many drops per minute should the nurse regulate the infusion to deliver?", "opts": ["21 gtt/min", "31 gtt/min", "42 gtt/min", "63 gtt/min"], "a": 1, "r": "(500 mL x 15 gtt/mL) / 240 min = 7,500 / 240 = 31.25, which rounds to 31 gtt/min. Choosing 63 gtt/min would double the intended rate, reflecting use of a 2-hour rather than 4-hour infusion time.", "why": ["21 gtt/min results from applying a 10 gtt/mL drop factor instead of the 15 gtt/mL tubing actually in use.", "Correct. 500 mL times 15 gtt/mL divided by 240 minutes equals 7,500/240, or 31.25, which rounds to 31 gtt/min.", "42 gtt/min comes from using a 20 gtt/mL drop factor and would infuse the lactated Ringer's much too quickly.", "63 gtt/min doubles the correct rate by dividing over 120 minutes rather than the ordered 240 minutes."]}, {"q": "A client with heart failure who takes digoxin and furosemide has a serum potassium level of 2.8 mEq/L. The morning digoxin dose is due. Which action should the nurse take first?", "opts": ["Withhold the digoxin and notify the provider about the potassium level", "Administer the digoxin and encourage the client to eat bananas and oranges", "Give the scheduled furosemide dose as ordered", "Recheck the potassium level with morning laboratory draws tomorrow"], "a": 0, "r": "Hypokalemia (normal 3.5 to 5.0 mEq/L) potentiates digoxin binding at the myocardium and precipitates toxicity and lethal dysrhythmias, so the dose is held and the provider notified. Giving furosemide would drive the potassium even lower, worsening the very problem that must be corrected.", "why": ["Correct. A potassium of 2.8 mEq/L potentiates digoxin binding at the myocardium, so the dose is held and the provider notified.", "Dietary potassium raises the level far too slowly, and giving digoxin now exposes the client to toxicity and lethal dysrhythmias.", "Furosemide wastes more potassium and would drive the level of 2.8 mEq/L even lower, worsening the underlying problem.", "Waiting until tomorrow leaves a critically low potassium untreated while the client receives a drug made dangerous by it."]}, {"q": "A 24 kg child is prescribed an antibiotic at 30 mg/kg/day divided every 8 hours. How many milligrams should the nurse administer per dose?", "opts": ["80 mg", "180 mg", "240 mg", "720 mg"], "a": 2, "r": "30 mg/kg x 24 kg = 720 mg/day, and 720 mg divided by 3 doses = 240 mg per dose. Selecting 720 mg would give the entire daily amount in a single administration, a threefold overdose.", "why": ["80 mg results from dividing the 720 mg daily dose by 9 rather than by the three doses given every 8 hours.", "180 mg comes from dividing 720 mg by four doses, as though the drug were scheduled every 6 hours instead of every 8.", "Correct. 30 mg/kg times 24 kg equals 720 mg per day, and 720 mg divided by three doses gives 240 mg per dose.", "720 mg is the entire daily amount given at once, a threefold overdose of the ordered every-8-hour dose."]}, {"q": "A client taking digoxin reports nausea and seeing yellow halos around lights. The apical pulse is 52/min and the serum digoxin level is 2.6 ng/mL. Which action should the nurse take?", "opts": ["Withhold the dose, notify the provider, and monitor the client for dysrhythmias", "Administer the dose and recheck the apical pulse in 1 hour", "Give the dose with food to reduce the nausea", "Encourage the client to follow a potassium-restricted diet"], "a": 0, "r": "A level above the therapeutic range of 0.5 to 2.0 ng/mL with bradycardia, nausea, and visual halos indicates digoxin toxicity, so the drug is held and the provider notified while cardiac monitoring continues. Giving the dose with food does not reduce serum drug levels and would deepen the toxicity.", "why": ["Correct. A level of 2.6 ng/mL with a pulse of 52, nausea, and yellow halos indicates digoxin toxicity, so the dose is held.", "Giving digoxin with an apical pulse of 52 and a toxic serum level deepens the bradycardia and risks lethal dysrhythmias.", "Food does not lower a serum level of 2.6 ng/mL; this nausea reflects toxicity rather than simple gastric irritation.", "Restricting potassium is backwards, because hypokalemia worsens digoxin toxicity rather than relieving it."]}, {"q": "A client receiving warfarin for atrial fibrillation has an INR of 6.8 with no evidence of active bleeding. The next dose is due. Which action should the nurse take?", "opts": ["Administer the dose as scheduled and document the INR", "Administer protamine sulfate as the antidote", "Increase dietary vitamin K immediately and give the dose", "Hold the warfarin, notify the provider, and anticipate an order for vitamin K (phytonadione)"], "a": 3, "r": "A therapeutic INR for atrial fibrillation is 2 to 3, so 6.8 carries a high hemorrhage risk; the dose is held, the provider notified, and vitamin K anticipated. Protamine sulfate reverses heparin, not warfarin, and giving it would leave the elevated INR untreated.", "why": ["Giving warfarin at an INR of 6.8 adds further anticoagulation and sharply increases the risk of spontaneous hemorrhage.", "Protamine sulfate reverses heparin, not warfarin, so giving it would leave the dangerously prolonged INR untreated.", "Dietary vitamin K acts far too slowly to correct an INR of 6.8, and giving the dose compounds the problem.", "Correct. With a target INR of 2 to 3, a value of 6.8 requires holding the dose, notifying the provider, and anticipating vitamin K."]}, {"q": "A client who weighs 176 lb is prescribed a medication at 0.5 mg/kg as a single dose. How many milligrams should the nurse administer?", "opts": ["35 mg", "40 mg", "44 mg", "88 mg"], "a": 1, "r": "176 lb / 2.2 = 80 kg, and 80 kg x 0.5 mg/kg = 40 mg. Choosing 88 mg results from multiplying pounds by 0.5 without converting to kilograms, which would more than double the intended dose.", "why": ["35 mg results from using an assumed 70 kg weight instead of converting the client's actual 176 lb to kilograms.", "Correct. 176 lb divided by 2.2 equals 80 kg, and 80 kg times 0.5 mg/kg equals a 40 mg dose.", "44 mg comes from dividing 176 by 2 instead of 2.2, yielding 88 kg and an excessive dose.", "88 mg results from multiplying pounds directly by 0.5 without converting to kilograms, more than doubling the intended dose."]}, {"q": "A client with small cell lung cancer has a serum sodium of 118 mEq/L and is increasingly confused and lethargic. Which action should the nurse take first?", "opts": ["Encourage the client to drink at least 2 L of water daily", "Administer a 1,000 mL bolus of 0.9% sodium chloride over 15 minutes", "Initiate seizure precautions and notify the provider", "Recheck the sodium level with the morning laboratory draw"], "a": 2, "r": "Severe hyponatremia (normal 135 to 145 mEq/L) causes cerebral edema, and confusion signals impending seizures, so safety measures and provider notification come first. Encouraging free water would further dilute the sodium, and rapid uncontrolled saline correction risks osmotic demyelination.", "why": ["Encouraging 2 L of water daily further dilutes a sodium of 118 mEq/L and would deepen the cerebral edema.", "A 1,000 mL bolus over 15 minutes corrects sodium far too rapidly and risks osmotic demyelination syndrome.", "Correct. A sodium of 118 mEq/L with confusion signals cerebral edema and impending seizures, so precautions and provider notification come first.", "Waiting for morning labs leaves a client with critical hyponatremia and altered mental status unprotected from seizures."]}, {"q": "A client who received regular insulin at 0730 is diaphoretic, shaky, and anxious at 1000. The bedside glucose is 52 mg/dL. The client is alert and able to swallow. Which action should the nurse take first?", "opts": ["Give 4 ounces of orange juice", "Administer 1 mg of glucagon intramuscularly", "Start an intravenous line and give 50% dextrose", "Recheck the glucose level in 15 minutes before intervening"], "a": 0, "r": "For a conscious client with an intact swallow, 15 g of a fast-acting oral carbohydrate such as 4 ounces of juice is the standard first treatment, followed by a repeat glucose in 15 minutes. Glucagon and IV dextrose are reserved for clients who are unconscious or unable to swallow safely, and delaying treatment allows neuroglycopenia to worsen.", "why": ["Correct. For an alert client who can swallow, 4 ounces of juice delivers about 15 g of fast-acting carbohydrate, the standard first treatment.", "Glucagon is reserved for hypoglycemic clients who are unconscious or unable to swallow, so it is unnecessarily invasive here.", "IV 50% dextrose is for clients who cannot take oral carbohydrate, and starting a line first delays needed treatment.", "Rechecking before treating delays correction of a glucose of 52 mg/dL and lets neuroglycopenic symptoms worsen."]}, {"q": "A client receiving chemotherapy has a platelet count of 18,000/mm3. Which intervention should the nurse implement?", "opts": ["Encourage the client to brush with a firm-bristled toothbrush after every meal", "Administer the prescribed medication by intramuscular injection into the deltoid", "Institute bleeding precautions, avoid invasive procedures, and hold anticoagulants pending provider review", "Place the client in a private room and require all visitors to wear a mask"], "a": 2, "r": "A platelet count below 20,000/mm3 carries a high risk of spontaneous hemorrhage, so bleeding precautions and avoidance of punctures and anticoagulants are the priority. Masking visitors addresses neutropenia rather than thrombocytopenia, and firm brushing or IM injections would directly provoke bleeding.", "why": ["Firm-bristled brushing traumatizes the gums and provokes bleeding when the platelet count is only 18,000/mm3.", "Intramuscular injection punctures muscle and causes hematoma formation in severe thrombocytopenia, so oral or IV routes are preferred.", "Correct. A platelet count below 20,000/mm3 carries high risk of spontaneous hemorrhage, so bleeding precautions and avoiding punctures are the priority.", "A private room with masked visitors addresses neutropenia and infection risk, not the bleeding risk of thrombocytopenia."]}]};

  { id:'psychosocial',             name:'Psychosocial Integrity',        group:'cat', color:'#f76808', icon:'brain' },
  { id:'basic-care-comfort',       name:'Basic Care & Comfort',          group:'cat', color:'#0091ff', icon:'bed' },
  { id:'pharm-parenteral',         name:'Pharmacological Therapies',     group:'cat', color:'#d6409f', icon:'pill' },
  { id:'reduction-risk',           name:'Reduction of Risk Potential',   group:'cat', color:'#0d9488', icon:'chart' },
  { id:'physiological-adaptation', name:'Physiological Adaptation',      group:'cat', color:'#ab6400', icon:'pulse' },

  { id:'cardiovascular',           name:'Cardiovascular',                group:'sub', color:'#e93d82', icon:'heart' },
  { id:'respiratory',              name:'Respiratory',                   group:'sub', color:'#00a2c7', icon:'lungs' },
  { id:'endocrine',                name:'Endocrine',                     group:'sub', color:'#8e4ec6', icon:'droplet' },
  { id:'neuro',                    name:'Neurological',                  group:'sub', color:'#5b5bd6', icon:'brain' },
  { id:'gastrointestinal',         name:'Gastrointestinal',              group:'sub', color:'#bd4b00', icon:'stomach' },
  { id:'renal-genitourinary',      name:'Renal & Genitourinary',         group:'sub', color:'#067a6f', icon:'kidney' },
  { id:'maternity',                name:'Maternity & Newborn',           group:'sub', color:'#c2298a', icon:'baby' },
  { id:'pediatrics',               name:'Pediatrics',                    group:'sub', color:'#f5a524', icon:'baby' },
  { id:'mental-health',            name:'Mental Health',                 group:'sub', color:'#46a758', icon:'smile' },
  { id:'fundamentals',             name:'Fundamentals',                  group:'sub', color:'#3e63dd', icon:'book' },
  { id:'prioritization-delegation',name:'Prioritization & Delegation',   group:'sub', color:'#ca3214', icon:'list' },
  { id:'dosage-lab-values',        name:'Dosage Calc & Lab Values',      group:'sub', color:'#6e56cf', icon:'flask' }
];

/* ---------- helpers ---------- */
function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${a})`;
}
function icon(key, cls) {
  return `<svg viewBox="0 0 24 24" class="${cls||''}">${ICONS[key]||ICONS.book}</svg>`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
const LETTERS = ['A','B','C','D'];

const TICK = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

/* Renders the full A-D breakdown: why the right answer is right AND
   why each wrong option is wrong. `picked` may be null (results view). */
function whyBlockHTML(q, picked) {
  if (!q.why || !q.why.length) return '';
  const rows = q.opts.map((o, idx) => {
    const isCorrect = idx === q.a;
    const youPicked = picked !== null && picked !== undefined && idx === picked && !isCorrect;
    return `<div class="why-row ${isCorrect ? 'is-correct' : 'is-wrong'}${youPicked ? ' you-picked' : ''}">
      <span class="why-mark ${isCorrect ? 'ok' : 'no'}">${isCorrect ? TICK : CROSS}</span>
      <span class="why-body">
        <span class="why-opt"><span class="why-letter">${LETTERS[idx]}.</span> ${esc(o)}
          <span class="why-tag">${isCorrect ? 'Correct' : 'Incorrect'}</span>
          ${youPicked ? '<span class="why-you">Your answer</span>' : ''}
        </span>
        <span class="why-text">${esc(String(q.why[idx]).replace(/^Correct[.:,]?\s*/i, ''))}</span>
      </span>
    </div>`;
  }).join('');
  return `<div class="why-block">
    <div class="why-label">Why each option is right or wrong</div>
    <div class="why-list">${rows}</div>
  </div>`;
}

/* ---------- render topic grids ---------- */
function tileHTML(t) {
  const n = (BANK[t.id] || []).length;
  return `<button class="topic-tile" id="tile-${t.id}" onclick="startTopic('${t.id}')"
    style="--c:${t.color};--c-soft:${hexToRgba(t.color,0.10)};--c-line:${hexToRgba(t.color,0.22)}">
    <span class="tile-icon">${icon(t.icon)}</span>
    <span class="tile-name">${t.name}</span>
    <span class="tile-meta">${n} questions</span>
  </button>`;
}
document.getElementById('gridCategories').innerHTML =
  TOPICS.filter(t => t.group === 'cat').map(tileHTML).join('');
document.getElementById('gridSubjects').innerHTML =
  TOPICS.filter(t => t.group === 'sub').map(tileHTML).join('');

/* ---------- practice state ---------- */
let S = null;
const slot = document.getElementById('practiceSlot');

function startTopic(id) {
  const topic = TOPICS.find(t => t.id === id);
  const qs = BANK[id] || [];
  S = { topic, qs, i: 0, picked: null, answered: false, picks: [] };

  document.querySelectorAll('.topic-tile').forEach(el => el.classList.remove('active'));
  const tile = document.getElementById('tile-' + id);
  if (tile) tile.classList.add('active');

  slot.classList.add('open');
  document.body.classList.add('practicing');
  renderQuestion();
  scrollCardToTop();
}

/* Bring the practice card flush to the top of the viewport,
   clearing the sticky nav. */
function scrollCardToTop() {
  const nav = document.querySelector('.nav-bar');
  const offset = (nav ? nav.offsetHeight : 66) + 14;
  const y = slot.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
}

function shellHTML(inner, progressPct) {
  const t = S.topic;
  return `<div class="practice-card"
      style="--c:${t.color};--c-soft:${hexToRgba(t.color,0.10)};--c-line:${hexToRgba(t.color,0.22)}">
    <div class="practice-top">
      <span class="practice-badge">${icon(t.icon)}</span>
      <div class="practice-titles">
        <div class="practice-title">${t.name}</div>
        <div class="practice-sub" id="practiceSub"></div>
      </div>
      <button class="practice-close" onclick="closePractice()" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <div class="practice-progress"><span style="width:${progressPct}%"></span></div>
    <div class="practice-body">${inner}</div>
  </div>`;
}

function renderQuestion() {
  const q = S.qs[S.i];
  const pct = (S.i / S.qs.length) * 100;

  const opts = q.opts.map((o, idx) => {
    let cls = 'q-opt';
    if (S.answered) {
      cls += ' locked';
      if (idx === q.a) cls += ' correct';
      else if (idx === S.picked) cls += ' wrong';
    } else if (idx === S.picked) {
      cls += ' picked';
    }
    return `<button class="${cls}" onclick="pickOption(${idx})">
      <span class="q-letter">${LETTERS[idx]}</span>
      <span class="q-text">${esc(o)}</span>
    </button>`;
  }).join('');

  let feedback = '';
  if (S.answered) {
    const ok = S.picked === q.a;
    feedback = `
      <div class="q-feedback">
        <div class="q-verdict ${ok ? 'ok' : 'no'}">
          ${ok ? TICK : CROSS}
          ${ok ? 'Correct' : 'Incorrect &mdash; the answer is ' + LETTERS[q.a]}
        </div>
        ${whyBlockHTML(q, S.picked)}
        <div class="q-rationale"><b>Key takeaway</b>${esc(q.r)}</div>
      </div>`;
  }

  const last = S.i === S.qs.length - 1;
  const btn = S.answered
    ? `<button class="btn-main" onclick="nextQuestion()">${last ? 'See results' : 'Next question'}</button>`
    : `<button class="btn-main" id="submitBtn" onclick="submitAnswer()" ${S.picked === null ? 'disabled' : ''}>Submit answer</button>`;

  slot.innerHTML = shellHTML(`
    <div class="q-stem">${esc(q.q)}</div>
    <div class="q-opts">${opts}</div>
    <div class="practice-foot">
      <span class="practice-count">Question ${S.i + 1} of ${S.qs.length}</span>
      ${btn}
    </div>
    ${feedback}`, pct);

  document.getElementById('practiceSub').textContent =
    `Question ${S.i + 1} of ${S.qs.length}`;
}

function pickOption(idx) {
  if (S.answered) return;
  S.picked = idx;
  renderQuestion();
}

function submitAnswer() {
  if (S.picked === null || S.answered) return;
  S.answered = true;
  S.picks.push(S.picked);
  renderQuestion();
  scrollCardToTop();
}

function nextQuestion() {
  if (S.i === S.qs.length - 1) { renderResults(); return; }
  S.i++;
  S.picked = null;
  S.answered = false;
  renderQuestion();
  scrollCardToTop();
}

function renderResults() {
  const total = S.qs.length;
  const score = S.picks.reduce((n, p, i) => n + (p === S.qs[i].a ? 1 : 0), 0);
  const pct = Math.round((score / total) * 100);
  const ringColor = pct >= 80 ? '#34c759' : pct >= 60 ? '#f5a524' : '#ff3b30';

  let headline, blurb;
  if (pct >= 80) {
    headline = 'Strong set.';
    blurb = `You're testing well above the pass line on ${S.topic.name}. Keep this topic on a light review cycle and put your time into weaker areas.`;
  } else if (pct >= 60) {
    headline = 'Almost there.';
    blurb = `You're close on ${S.topic.name}. Read the rationales for the ones you missed &mdash; most gaps here are recognition, not knowledge.`;
  } else {
    headline = 'This one needs work.';
    blurb = `${S.topic.name} is a weak area right now. Work through the rationales below, then run the set again in a day or two.`;
  }

  const items = S.qs.map((q, i) => {
    const p = S.picks[i];
    const ok = p === q.a;
    return `<div class="res-item" id="res-${i}">
      <button class="res-item-top" onclick="toggleReview(${i})">
        <span class="res-mark ${ok ? 'ok' : 'no'}">
          <svg viewBox="0 0 24 24">${ok ? '<path d="M5 13l4 4L19 7"/>' : '<path d="M6 6l12 12M18 6L6 18"/>'}</svg>
        </span>
        <span class="res-item-q">${i + 1}. ${esc(q.q)}</span>
        <svg viewBox="0 0 24 24" class="res-chev"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="res-item-body">
        ${whyBlockHTML(q, p)}
        <div class="res-why">${esc(q.r)}</div>
      </div>
    </div>`;
  }).join('');

  slot.innerHTML = shellHTML(`
    <div class="res-head">
      <div class="res-ring" style="background:conic-gradient(${ringColor} 0% ${pct}%, #ececf2 ${pct}% 100%)">
        <div class="res-ring-in">
          <span class="res-score">${score}/${total}</span>
          <span class="res-outof">${pct}% correct</span>
        </div>
      </div>
      <div class="res-copy">
        <h3>${headline}</h3>
        <p>${blurb}</p>
      </div>
    </div>
    <div class="res-review-label">Review all ${total} questions</div>
    <div class="res-list">${items}</div>
    <div class="res-actions">
      <button class="btn-main" onclick="retryTopic()">Retry this topic</button>
      <button class="btn-ghost" onclick="closePractice()">Pick another topic</button>
    </div>`, 100);

  document.getElementById('practiceSub').textContent = 'Set complete';
  scrollCardToTop();
}

function toggleReview(i) {
  document.getElementById('res-' + i).classList.toggle('open');
}

function retryTopic() {
  startTopic(S.topic.id);
}

function closePractice() {
  slot.classList.remove('open');
  document.body.classList.remove('practicing');
  slot.innerHTML = '';
  document.querySelectorAll('.topic-tile').forEach(el => el.classList.remove('active'));
  S = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
