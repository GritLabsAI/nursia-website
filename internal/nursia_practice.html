gnal thyroid storm, a life-threatening hormone surge needing cooling, beta-blockade, and antithyroid therapy.", "A sore throat with swallowing is expected after intubation and a neck incision, so it calls for comfort measures rather than immediate follow-up.", "A small amount of serosanguineous drainage is normal; only copious drainage or pooling behind the neck would suggest hemorrhage requiring urgent action."]}, {"q": "Eight hours after a total thyroidectomy, a client reports tingling around the mouth and in the fingertips, and the nurse elicits facial twitching when tapping over the facial nerve. Which action should the nurse anticipate?", "opts": ["Administering IV calcium gluconate as ordered", "Encouraging the client to breathe into a paper bag", "Administering a dose of levothyroxine", "Applying an ice collar to the surgical site"], "a": 0, "r": "A positive Chvostek sign with perioral and digital paresthesias indicates hypocalcemia from inadvertent parathyroid injury or removal, and IV calcium gluconate is the treatment to prevent laryngospasm and tetany. Rebreathing into a bag treats respiratory alkalosis from hyperventilation and would not correct the underlying calcium deficit, delaying definitive therapy.", "why": ["Correct. A positive Chvostek sign with perioral and digital tingling indicates hypocalcemia from parathyroid injury, and IV calcium gluconate prevents laryngospasm and tetany.", "Rebreathing treats paresthesias caused by hyperventilation-induced respiratory alkalosis; here the serum calcium itself is low, so this would delay definitive replacement.", "Levothyroxine replaces thyroid hormone, which is not the deficiency producing these symptoms, and it takes days to act on an acute calcium problem.", "An ice collar eases incisional swelling and pain but has no effect on the calcium deficit causing the twitching and paresthesias."]}, {"q": "A client with Addison disease is admitted after two days of vomiting. Blood pressure is 78/44, heart rate 124, sodium 126 mEq/L, and potassium 5.9 mEq/L. Which prescription should the nurse implement first?", "opts": ["Oral fludrocortisone 0.1 mg daily", "Sodium polystyrene sulfonate 15 g orally", "IV hydrocortisone with 0.9% sodium chloride infusion", "Regular insulin 10 units IV push"], "a": 2, "r": "Addisonian crisis is a shock state caused by cortisol and aldosterone deficiency, and IV glucocorticoid replacement with isotonic saline simultaneously treats the hypotension, hyponatremia, and hyperkalemia. An oral agent such as fludrocortisone acts too slowly and cannot be relied on in a vomiting, hypotensive client, so it does not address the immediate circulatory threat.", "why": ["Oral fludrocortisone cannot be absorbed reliably in a vomiting client and acts far too slowly to reverse shock-level hypotension in adrenal crisis.", "Sodium polystyrene sulfonate lowers potassium over hours and is oral, which is unsafe with active vomiting; hydrocortisone corrects the hyperkalemia at its source.", "Correct. IV hydrocortisone with isotonic saline replaces missing cortisol and volume, simultaneously reversing the hypotension, hyponatremia, and hyperkalemia of Addisonian crisis.", "Insulin shifts potassium intracellularly but is not indicated here; without glucose it risks hypoglycemia and ignores the cortisol deficiency driving the crisis."]}, {"q": "The nurse is teaching a client newly diagnosed with Cushing syndrome. Which client statement indicates correct understanding of self-care?", "opts": ["I should add extra salt to my food to keep my blood pressure up", "I will report any fever or sore throat right away because infections may be masked", "Bruising easily means my platelet count is dangerously low", "I can stop my medication once my face returns to its normal shape"], "a": 1, "r": "Excess cortisol suppresses the inflammatory response, so classic signs of infection may be blunted and any fever or sore throat warrants prompt reporting; this reflects a safety and infection-prevention priority. Adding salt is incorrect because cortisol excess already promotes sodium and water retention with resulting hypertension and edema.", "why": ["Cortisol excess already causes sodium and water retention with hypertension and edema, so adding salt would worsen fluid overload rather than help.", "Correct. Excess cortisol blunts the inflammatory response and can mask infection, so any fever or sore throat must be reported promptly.", "Easy bruising in Cushing syndrome comes from cortisol-induced capillary fragility and thinned skin, not from thrombocytopenia, so this belief is factually inaccurate.", "Therapy is not stopped once moon facies improves; abruptly discontinuing steroid replacement after treatment can precipitate a life-threatening adrenal crisis."]}, {"q": "A client with small cell lung cancer has a serum sodium of 118 mEq/L, urine specific gravity of 1.032, and is increasingly lethargic. Which intervention should the nurse expect to implement?", "opts": ["Encourage oral fluids to 3,000 mL per day", "Administer desmopressin intranasally", "Infuse 5% dextrose in water at 125 mL/hr", "Restrict fluids to approximately 800 to 1,000 mL per day"], "a": 3, "r": "The dilutional hyponatremia with concentrated urine is characteristic of SIADH, and fluid restriction is the cornerstone of treatment to raise serum sodium and prevent cerebral edema and seizures. Encouraging fluids would worsen the water retention and drop sodium further, increasing the risk of neurologic deterioration.", "why": ["Pushing 3,000 mL daily would deepen the dilutional hyponatremia and increase the risk of cerebral edema and seizures in this lethargic client.", "Desmopressin is synthetic ADH used for diabetes insipidus; giving it in SIADH adds to the excess antidiuretic hormone already causing water retention.", "Dextrose in water becomes free water once the dextrose is metabolized, so it would dilute serum sodium further and worsen the neurologic decline.", "Correct. Restricting intake to roughly 800 to 1,000 mL daily reverses the water retention of SIADH and gradually raises the serum sodium."]}, {"q": "A client is being monitored after transsphenoidal pituitary surgery. Which finding should the nurse report to the provider immediately?", "opts": ["Urine output of 60 mL/hr with a specific gravity of 1.018", "Urine output of 380 mL/hr with a specific gravity of 1.002 and rising serum sodium", "Complaints of a mild frontal headache relieved by acetaminophen", "Nasal packing that is dry and intact with no drainage"], "a": 1, "r": "Massive dilute diuresis with a very low specific gravity and rising serum sodium indicates central diabetes insipidus from disrupted ADH secretion, which can rapidly cause hypovolemia and hypernatremia and requires desmopressin. A urine output of 60 mL/hr with a mid-range specific gravity is a normal expected finding and needs only continued monitoring.", "why": ["Sixty milliliters per hour with a specific gravity of 1.018 is normal output and concentration, requiring routine monitoring rather than immediate reporting.", "Correct. Massive dilute diuresis with a rising serum sodium indicates central diabetes insipidus after pituitary surgery, risking rapid hypovolemia and requiring desmopressin.", "A mild frontal headache relieved by acetaminophen is expected after this approach; severe headache with a stiff neck would instead suggest a leak.", "Dry, intact nasal packing is the desired finding; clear drainage or persistent postnasal drip would be the concerning sign of a CSF leak."]}, {"q": "An 82-year-old nursing home resident with type 2 diabetes has a blood glucose of 792 mg/dL, serum osmolality of 340 mOsm/kg, negative serum ketones, and is difficult to arouse. Which nursing action takes priority?", "opts": ["Establishing IV access and initiating 0.9% sodium chloride as prescribed", "Obtaining a urine specimen for culture and sensitivity", "Teaching the family about sick-day management rules", "Administering the client's usual oral metformin dose"], "a": 0, "r": "Hyperglycemic hyperosmolar state produces extreme dehydration with fluid deficits that may exceed 8 to 10 L, so restoring intravascular volume is the priority intervention before other measures. Metformin is contraindicated in an acutely dehydrated, hyperosmolar client because of the risk of lactic acidosis and would not address the volume deficit.", "why": ["Correct. Hyperglycemic hyperosmolar state creates fluid deficits that can exceed 8 liters, so IV access and isotonic fluid resuscitation are the priority.", "A urine culture may identify the precipitating infection, but obtaining it does not treat the profound dehydration currently threatening tissue perfusion.", "Sick-day teaching helps prevent recurrence but is inappropriate while the resident is difficult to arouse and hemodynamically unstable from severe dehydration.", "Metformin is contraindicated in acute dehydration because of lactic acidosis risk, and an oral drug is unsafe in a barely arousable client."]}], "neuro": [{"q": "A client arrives 90 minutes after the sudden onset of right-sided weakness and expressive aphasia. Which finding in the history should the nurse report before thrombolytic therapy is considered?", "opts": ["Blood pressure of 158/88 mm Hg on arrival", "A gastrointestinal bleed requiring transfusion three weeks ago", "A history of atrial fibrillation treated with rate control", "A blood glucose of 132 mg/dL"], "a": 1, "r": "Recent active internal bleeding within the previous 21 days is an absolute contraindication to alteplase because thrombolysis could produce catastrophic hemorrhage, making this a critical safety report. A blood pressure of 158/88 is below the 185/110 threshold that would require treatment before thrombolysis, so it is not disqualifying.", "why": ["A pressure of 158/88 is below the 185/110 threshold that must be treated before alteplase, so it does not disqualify this client.", "Correct. Active internal bleeding requiring transfusion within the past 21 days is an absolute contraindication to alteplase because of catastrophic hemorrhage risk.", "Atrial fibrillation is a common source of embolic stroke rather than a contraindication; anticoagulant use, not rate control, would raise bleeding concern.", "A glucose of 132 mg/dL is normal; only marked hypoglycemia or hyperglycemia would mimic stroke and change the thrombolytic decision."]}, {"q": "A client with a traumatic brain injury has these serial vital signs: blood pressure rising from 124/76 to 178/62, heart rate falling from 88 to 48, and respirations becoming irregular. Which conclusion should the nurse draw?", "opts": ["The client is developing hypovolemic shock", "The client is responding appropriately to mannitol therapy", "The client is experiencing an anxiety reaction to the ICU environment", "The client is showing Cushing triad, indicating dangerously increased intracranial pressure"], "a": 3, "r": "Widening pulse pressure, bradycardia, and irregular respirations form Cushing triad, a late and ominous sign of increased intracranial pressure and impending herniation that requires immediate provider notification. Hypovolemic shock would instead produce hypotension with tachycardia and a narrowed pulse pressure, the opposite pattern.", "why": ["Hypovolemic shock produces hypotension, tachycardia, and a narrowed pulse pressure, which is the opposite of the widening pressure and bradycardia seen here.", "Effective mannitol therapy would lower intracranial pressure and stabilize vital signs, so this deteriorating pattern reflects failure rather than therapeutic response.", "Anxiety raises heart rate and blood pressure together; it does not cause bradycardia with irregular respirations in a client with brain injury.", "Correct. Widening pulse pressure, bradycardia, and irregular respirations form Cushing triad, a late sign of intracranial hypertension and impending herniation."]}, {"q": "The nurse enters a room and finds a client having a generalized tonic-clonic seizure in bed. Which action should the nurse take first?", "opts": ["Turn the client to the side and protect the head", "Insert a padded tongue blade between the teeth", "Restrain the client's arms to prevent injury", "Draw a stat serum phenytoin level"], "a": 0, "r": "Side-lying positioning maintains a patent airway and allows secretions to drain, addressing airway and breathing priorities while padding protects the head from trauma. Inserting anything into the mouth or restraining the limbs during a seizure can cause dental, oral, or musculoskeletal injury and is contraindicated.", "why": ["Correct. Side-lying positioning keeps the airway patent and lets secretions drain, while protecting the head prevents trauma during the convulsive movements.", "Forcing anything between clenched teeth can fracture teeth, lacerate the mouth, or obstruct the airway, and is contraindicated during an active seizure.", "Restraining the limbs during tonic-clonic activity can cause fractures and soft tissue injury; the nurse guides the client away from hazards instead.", "A phenytoin level helps assess dosing after the event, but drawing laboratory studies never takes precedence over protecting the airway during a seizure."]}, {"q": "A client with a T4 spinal cord injury suddenly reports a pounding headache; blood pressure is 210/112, and the nurse notes flushing above the level of injury and gooseflesh below it. After placing the client in high Fowler position, which action should the nurse take next?", "opts": ["Administer an as-needed dose of oral acetaminophen", "Apply oxygen at 4 L/min by nasal cannula", "Assess for a kinked urinary catheter or bladder distention", "Perform passive range-of-motion exercises to the lower extremities"], "a": 2, "r": "Autonomic dysreflexia is triggered by a noxious stimulus below the injury level, and bladder distention or an obstructed catheter is the most common cause, so removing the stimulus resolves the hypertensive crisis. Giving acetaminophen treats a symptom while leaving the trigger in place, allowing blood pressure to remain at stroke-level values.", "why": ["Acetaminophen treats the headache symptom while the noxious trigger continues driving stroke-level hypertension, so the dysreflexic crisis would simply persist.", "Oxygen may be added for comfort, but hypoxia is not the problem and the blood pressure will not fall until the stimulus is removed.", "Correct. Bladder distention or a kinked catheter is the most common trigger below the injury, and removing it resolves the hypertensive crisis.", "Passive range of motion adds more stimulation below the level of injury and could intensify the sympathetic surge rather than relieve it."]}, {"q": "A college student is admitted with suspected bacterial meningitis after presenting with fever, nuchal rigidity, and photophobia. Which nursing action is most important during the first 24 hours?", "opts": ["Position the client supine with the neck flexed for comfort", "Keep the room brightly lit for frequent neurologic assessment", "Encourage ambulation in the hallway every 4 hours", "Maintain droplet precautions until 24 hours of effective antibiotics have been given"], "a": 3, "r": "Neisseria meningitidis is transmitted by respiratory droplets, so droplet precautions protect other clients and staff until the client has received 24 hours of appropriate antibiotic therapy. Bright lighting worsens photophobia and increases discomfort and stimulation, so a darkened, quiet room is preferred.", "why": ["Neck flexion stretches inflamed meninges and increases pain, so the client is positioned with the head of the bed elevated and neck neutral.", "Bright lighting aggravates photophobia and adds stimulation; a darkened, quiet room is preferred while neurologic checks are still performed as scheduled.", "Hallway ambulation every four hours increases stimulation and energy demand during acute meningitis, when quiet rest with minimal stimuli is indicated.", "Correct. Meningococcal meningitis spreads by respiratory droplets, so droplet precautions protect others until 24 hours of effective antibiotic therapy are complete."]}, {"q": "A client with myasthenia gravis takes pyridostigmine. Which statement by the client indicates a need for further teaching?", "opts": ["I will schedule my most demanding activities for the morning", "If I miss a dose it is fine to skip it and take the next one later in the day", "I will take my medication about 30 minutes before meals", "I will call my provider if I develop new difficulty swallowing"], "a": 1, "r": "Anticholinesterase medication must be taken on an exact schedule because missed or delayed doses can precipitate myasthenic crisis with respiratory failure, so casually skipping a dose reflects unsafe understanding. Taking the drug 30 minutes before meals is correct because it maximizes chewing and swallowing strength and reduces aspiration risk.", "why": ["Scheduling demanding activities in the morning is correct, because muscle strength is greatest early and fatigue accumulates as the day progresses.", "Correct. Skipping or delaying anticholinesterase doses can precipitate myasthenic crisis with respiratory failure, so this statement reveals unsafe understanding needing correction.", "Taking pyridostigmine about 30 minutes before meals is accurate, since peak strength then improves chewing and swallowing and lowers aspiration risk.", "Reporting new difficulty swallowing is appropriate, because bulbar weakness signals worsening disease and threatens the airway, so this reflects correct understanding."]}, {"q": "The nurse is planning care for a client with Parkinson disease who has a shuffling gait, bradykinesia, and difficulty initiating movement. Which intervention should the nurse include?", "opts": ["Instruct the client to walk with the feet close together for balance", "Discourage exercise to conserve limited energy", "Teach the client to consciously lift the toes and swing the arms while walking", "Provide all meals as pureed textures regardless of swallowing ability"], "a": 2, "r": "Deliberately lifting the toes, using a wide base, and swinging the arms counteracts the festinating shuffling gait and reduces fall risk, supporting both mobility and safety. Narrowing the base of support would decrease stability and increase falls, and routine puree without a swallow evaluation is unnecessarily restrictive.", "why": ["A narrow base of support reduces stability in a client with bradykinesia and festination, increasing rather than decreasing the risk of falls.", "Exercise preserves range of motion, balance, and function in Parkinson disease, so discouraging it accelerates rigidity, contractures, and overall deconditioning.", "Correct. Consciously lifting the toes and swinging the arms interrupts the shuffling festinating gait, lengthening stride and improving balance and safety.", "Pureed textures should follow a swallowing evaluation; applying them to everyone is unnecessarily restrictive and can reduce appetite and nutritional intake."]}, {"q": "A client with relapsing-remitting multiple sclerosis asks how to reduce the risk of an exacerbation. Which response by the nurse is most accurate?", "opts": ["Avoid overheating, including hot baths and strenuous activity in hot weather", "Limit fluid intake to less than 1,000 mL per day", "Remain on strict bed rest whenever symptoms are present", "Take a hot bath before bed to loosen spastic muscles"], "a": 0, "r": "Elevated core temperature slows conduction in demyelinated fibers and commonly triggers a temporary worsening of symptoms, so heat avoidance is standard teaching. Hot baths are specifically discouraged for this reason, and prolonged bed rest promotes deconditioning, contractures, and pressure injury rather than protecting the client.", "why": ["Correct. Elevated core temperature slows conduction in demyelinated fibers, so avoiding hot baths and heat exposure prevents transient worsening of symptoms.", "Fluid restriction has no role in multiple sclerosis and promotes constipation and urinary tract infection, both of which can aggravate symptoms.", "Strict bed rest causes deconditioning, contractures, and pressure injury; balanced activity with planned rest periods is recommended even during exacerbations.", "A hot bath raises core temperature and typically intensifies weakness and fatigue, so it is specifically discouraged despite its appeal for spasticity."]}, {"q": "A client with a closed head injury opens the eyes to painful stimuli, makes incomprehensible sounds, and withdraws from pain. What Glasgow Coma Scale score should the nurse document?", "opts": ["6", "12", "10", "8"], "a": 3, "r": "Eye opening to pain scores 2, incomprehensible sounds score 2, and withdrawal from pain scores 4, for a total of 8, which is the threshold at which intubation for airway protection is generally considered. A score of 6 would underestimate the motor response, since withdrawal is scored higher than abnormal flexion or extension.", "why": ["Six would require a lower motor score such as abnormal flexion, but withdrawal from pain scores four, making this total too low.", "Twelve overestimates this client, since eye opening to pain and incomprehensible sounds each earn only two points rather than higher responses.", "Ten is too high, because reaching that total would require confused or oriented speech instead of the incomprehensible sounds documented here.", "Correct. Eye opening to pain scores 2, incomprehensible sounds 2, and withdrawal 4, totaling 8, the threshold for considering intubation."]}, {"q": "A client admitted after a fall has clear fluid draining from the right nostril that forms a yellow ring around a central blood stain on the linen. Which nursing action is appropriate?", "opts": ["Pack the nostril firmly with sterile gauze", "Insert a small-bore nasogastric tube to decompress the stomach", "Allow the drainage to flow freely onto a sterile pad and notify the provider", "Have the client blow the nose to clear the drainage"], "a": 2, "r": "A halo sign suggests cerebrospinal fluid rhinorrhea from a basilar skull fracture; drainage should be collected on a loose sterile dressing without obstruction, and the provider notified because of meningitis risk. Packing the nose or passing a nasogastric tube risks forcing organisms intracranially or passing the tube through the fracture into the brain.", "why": ["Packing the nostril obstructs cerebrospinal fluid drainage and can force organisms upward through the fracture line, sharply raising the risk of meningitis.", "A nasogastric tube can pass through the basilar skull fracture into the cranial vault, so oral placement is required if decompression is needed.", "Correct. The halo sign suggests cerebrospinal fluid rhinorrhea, so drainage flows freely onto a sterile pad and the provider is notified for meningitis risk.", "Blowing the nose raises intracranial and sinus pressure and can force bacteria into the cranial cavity, so it is specifically prohibited."]}], "gastrointestinal": [{"q": "A client with a history of esophageal varices vomits approximately 500 mL of bright red blood. Blood pressure is 86/48, heart rate 126, and skin is cool and clammy. Which action should the nurse take first?", "opts": ["Obtain a stool specimen for occult blood testing", "Insert a nasogastric tube for gastric lavage", "Position the client supine with the legs elevated on pillows", "Establish large-bore IV access and begin the prescribed isotonic fluid bolus"], "a": 3, "r": "Active hematemesis with hypotension and tachycardia signals hypovolemic shock, and rapid volume replacement through large-bore IV access is the priority circulation intervention. Stool occult blood testing confirms bleeding that is already obvious and does nothing to restore perfusion, so it is a low priority in an unstable client.", "why": ["Occult blood testing confirms bleeding that is already obvious as hematemesis and does nothing to restore perfusion in a hypotensive client.", "Gastric lavage may be ordered later, but it is not the first action and can further traumatize fragile varices before volume is restored.", "Supine leg elevation gives only transient venous return and raises aspiration risk in a client actively vomiting blood, so it cannot replace fluid resuscitation.", "Correct. Hematemesis with hypotension and tachycardia signals hypovolemic shock, so large-bore access with isotonic fluid resuscitation addresses the circulation priority."]}, {"q": "A client with cirrhosis has an ammonia level of 92 mcg/dL, asterixis, and increasing confusion. The provider prescribes lactulose. Which finding indicates the medication is achieving its therapeutic effect?", "opts": ["The client reports relief of abdominal fullness", "The client has two to three soft stools daily and is more oriented", "The client's abdominal girth decreases by 3 cm", "The client's serum albumin rises to 3.8 g/dL"], "a": 1, "r": "Lactulose acidifies the colon to trap ammonia and works as an osmotic laxative, so two to three soft stools per day with improving mentation shows effectiveness. A decrease in abdominal girth reflects diuretic response or paracentesis for ascites, not ammonia clearance, so it is not the intended endpoint for this drug.", "why": ["Relief of abdominal fullness is nonspecific comfort and does not demonstrate ammonia clearance or improvement in hepatic encephalopathy.", "Correct. Lactulose acidifies the colon to trap ammonia and acts osmotically, so two to three soft stools with clearing mentation confirm effectiveness.", "A decrease in abdominal girth reflects diuretic response or paracentesis for ascites rather than the ammonia-lowering action of lactulose.", "Serum albumin reflects hepatic synthetic function and improves slowly with nutrition; lactulose has no direct effect on the albumin level."]}, {"q": "A client is diagnosed with hepatitis A after a restaurant outbreak. Which statement by the client indicates correct understanding of transmission?", "opts": ["I got this from sharing needles with someone", "My spouse needs testing because we shared razors", "I most likely picked this up from contaminated food or water", "This will probably become a lifelong chronic liver infection"], "a": 2, "r": "Hepatitis A is spread by the fecal-oral route through contaminated food, water, or hands, and meticulous handwashing is the key preventive measure. Needle sharing and shared razors transmit bloodborne hepatitis B and C, which is a different route and a different chronicity profile, since hepatitis A does not become chronic.", "why": ["Needle sharing transmits bloodborne hepatitis B and C, not hepatitis A, so this statement misidentifies the route in a foodborne outbreak.", "Shared razors transmit bloodborne hepatitis; household contacts of hepatitis A are protected by handwashing and postexposure vaccine or immune globulin instead.", "Correct. Hepatitis A spreads by the fecal-oral route through contaminated food, water, or hands, which fits this restaurant-associated outbreak exactly.", "Hepatitis A is a self-limiting acute illness that does not become chronic; hepatitis B and C carry the chronic carrier risk."]}, {"q": "A client admitted with acute pancreatitis reports severe epigastric pain radiating to the back, with a serum lipase of 1,120 units/L. Which nursing intervention is most appropriate?", "opts": ["Maintain NPO status and assist the client into a side-lying position with knees flexed", "Provide a high-fat, high-calorie diet to meet metabolic demands", "Place the client flat in bed to reduce diaphragmatic irritation", "Apply heat to the abdomen for 20 minutes every hour"], "a": 0, "r": "Resting the gut with NPO status reduces pancreatic enzyme stimulation, and a knee-flexed side-lying or fetal position decreases tension on the inflamed pancreas and eases pain. A high-fat diet is the opposite of what is indicated because fat is the strongest stimulus for pancreatic secretion and will intensify pain.", "why": ["Correct. NPO status rests the pancreas by limiting enzyme stimulation, and a side-lying knee-flexed position reduces tension on the inflamed gland.", "Fat is the strongest stimulus for pancreatic enzyme secretion, so a high-fat diet would intensify autodigestion and severely worsen the epigastric pain.", "Lying flat increases pressure on the inflamed pancreas and typically worsens pain; a flexed or upright position provides considerably more relief.", "Heat increases blood flow and metabolic demand at an acutely inflamed site, so it is not indicated and may intensify pancreatic inflammation."]}, {"q": "A client recovering from an episode of acute cholecystitis is being discharged. Which meal selection indicates the client understands the recommended diet?", "opts": ["Fried chicken, coleslaw with mayonnaise, and whole milk", "Baked cod, steamed rice, green beans, and skim milk", "Cheeseburger with french fries and a chocolate milkshake", "Sausage omelet with buttered toast and cream-based soup"], "a": 1, "r": "A low-fat meal minimizes cholecystokinin release and gallbladder contraction, which reduces the biliary colic that follows fatty meals. The fried chicken selection is high in fat and would trigger gallbladder stimulation and pain, so it demonstrates a misunderstanding of the dietary restriction.", "why": ["Fried chicken, mayonnaise-based slaw, and whole milk are high in fat and would trigger gallbladder contraction with recurrent biliary colic.", "Correct. Baked fish, rice, vegetables, and skim milk are low in fat, minimizing cholecystokinin release and the pain that follows fatty meals.", "A cheeseburger, fries, and a milkshake are among the highest-fat selections available and would predictably provoke a painful biliary attack.", "Sausage, buttered toast, and cream-based soup are all high in fat, so this choice shows the dietary restriction was not understood."]}, {"q": "A client with a known duodenal ulcer suddenly develops severe, unrelenting abdominal pain; the abdomen is rigid and board-like, and bowel sounds are absent. Which action should the nurse take?", "opts": ["Administer the prescribed antacid and reassess in 1 hour", "Offer small sips of milk to coat the gastric lining", "Assist the client to ambulate to relieve trapped gas", "Keep the client NPO, notify the provider immediately, and prepare for emergency surgery"], "a": 3, "r": "A rigid board-like abdomen with absent bowel sounds after ulcer disease indicates perforation with peritonitis, a surgical emergency requiring immediate provider notification and NPO status. Giving an antacid or milk delays definitive care and introduces oral intake into an abdomen that will likely require urgent operative repair.", "why": ["An antacid cannot treat perforation, and reassessing in an hour delays surgical care while peritonitis and sepsis rapidly progress.", "Milk gives oral intake to a client who will likely need emergency surgery and only briefly buffers acid before stimulating rebound secretion.", "This pain is peritoneal irritation from perforation rather than trapped gas, and ambulating a client with an acute abdomen delays needed surgery.", "Correct. Board-like rigidity with absent bowel sounds indicates perforation with peritonitis, a surgical emergency requiring NPO status and immediate provider notification."]}, {"q": "A client with ulcerative colitis reports 14 bloody stools per day, a temperature of 101.8 F, heart rate 118, and marked abdominal distention with tenderness. Which complication should the nurse suspect?", "opts": ["Toxic megacolon", "Irritable bowel syndrome flare", "Lactose intolerance", "Hemorrhoidal bleeding"], "a": 0, "r": "Fever, tachycardia, abdominal distention, and profuse bloody diarrhea in ulcerative colitis point to toxic megacolon, which risks perforation and sepsis and requires urgent evaluation. Irritable bowel syndrome does not produce fever, systemic toxicity, or bloody stools, so it cannot account for this presentation.", "why": ["Correct. Fever, tachycardia, distention, and profuse bloody diarrhea in ulcerative colitis indicate toxic megacolon, which risks perforation and sepsis.", "Irritable bowel syndrome causes cramping and altered stool patterns but never fever, systemic toxicity, or grossly bloody stools like these.", "Lactose intolerance produces bloating, gas, and osmotic diarrhea after dairy intake, not fever, tachycardia, and fourteen bloody stools daily.", "Hemorrhoids can add bright red blood on the stool surface but cannot explain fever, tachycardia, and marked abdominal distention with tenderness."]}, {"q": "A client with a small bowel obstruction has a nasogastric tube connected to low intermittent suction. The nurse notes the client has no drainage for 2 hours and reports increasing nausea. Which action should the nurse take first?", "opts": ["Advance the tube 5 cm and resecure it", "Administer the prescribed antiemetic", "Assess the tube for kinks and verify placement and suction settings", "Remove the tube and notify the provider"], "a": 2, "r": "Assessment precedes intervention in the nursing process, so the nurse first checks for mechanical causes such as kinking, disconnection, or an incorrect suction setting before doing anything else. Advancing or removing the tube without assessment risks misplacement or loss of a needed decompression route while the actual problem may be a simple kink.", "why": ["Advancing the tube blindly before assessment risks coiling or misplacement and may not resolve a simple kink or an incorrect suction setting.", "An antiemetic masks the nausea produced by a nonfunctioning tube, treating the symptom while gastric and intestinal contents continue to accumulate.", "Correct. Assessment precedes intervention, so checking for kinks, verifying placement, and confirming suction settings identifies the most likely mechanical cause first.", "Removing the tube eliminates needed decompression in bowel obstruction and is premature when the cause may be a correctable kink or setting."]}, {"q": "The nurse is teaching a client with a new sigmoid colostomy about pouch care. Which statement by the client indicates correct understanding?", "opts": ["I should cut the barrier opening about one-eighth inch larger than my stoma", "A dusky purple stoma is normal for the first few weeks", "I should empty the pouch only when it is completely full", "I will irrigate the stoma daily with hot tap water"], "a": 0, "r": "Sizing the barrier about one-eighth inch larger than the stoma protects peristomal skin from effluent while avoiding pressure on the stoma itself. A dusky or purple stoma indicates impaired circulation and must be reported immediately, so accepting it as normal is a dangerous misconception.", "why": ["Correct. Cutting the barrier about one-eighth inch larger than the stoma shields peristomal skin from effluent without constricting the stoma itself.", "A dusky purple stoma signals impaired circulation and must be reported immediately; a healthy stoma remains pink or beefy red and moist.", "Waiting until the pouch is completely full strains the seal and causes leaks, so it is emptied when one-third to one-half full.", "Sigmoid colostomy irrigation uses lukewarm water when prescribed; hot tap water can burn the delicate stomal mucosa, making this statement unsafe."]}, {"q": "A client with gastroesophageal reflux disease reports nighttime heartburn and a sour taste on waking. Which instruction should the nurse provide?", "opts": ["Lie down for 30 minutes after eating to aid digestion", "Avoid eating within 3 hours of bedtime and elevate the head of the bed 6 to 8 inches", "Drink a cup of peppermint tea before bed to relax the stomach", "Sleep flat with two pillows under the knees"], "a": 1, "r": "Avoiding late meals and using gravity by elevating the head of the bed reduces nocturnal reflux of gastric contents into the esophagus. Peppermint relaxes the lower esophageal sphincter and actually worsens reflux, so recommending it would increase the client's symptoms.", "why": ["Lying down after eating lets gastric contents move against a weakened sphincter; clients should remain upright two to three hours after meals.", "Correct. Avoiding food within three hours of bedtime and elevating the head of the bed uses gravity to prevent nocturnal reflux.", "Peppermint relaxes the lower esophageal sphincter and increases reflux, so a bedtime cup would intensify this client's nighttime heartburn.", "Pillows under the knees do not raise the esophagus above the stomach, so lying flat still permits gastric contents to reflux."]}], "renal-genitourinary": [{"q": "A client in the oliguric phase of acute kidney injury has a serum potassium of 6.8 mEq/L and peaked T waves on the cardiac monitor. Which prescription should the nurse implement first?", "opts": ["Sodium polystyrene sulfonate 30 g orally", "Furosemide 40 mg IV push", "Calcium gluconate 10% IV over 5 minutes", "Dietary consult for a potassium-restricted diet"], "a": 2, "r": "IV calcium gluconate does not lower potassium but immediately stabilizes the cardiac membrane against lethal dysrhythmias, which addresses the circulation priority in symptomatic hyperkalemia. Sodium polystyrene sulfonate removes potassium from the body but takes hours to work, so it cannot protect the myocardium in the moment.", "why": ["Sodium polystyrene sulfonate does remove potassium but works over hours, leaving the myocardium unprotected during the immediate risk of lethal dysrhythmias.", "Furosemide promotes renal potassium loss but is unreliable during the oliguric phase and does not stabilize the cardiac membrane right now.", "Correct. IV calcium gluconate does not lower potassium but immediately stabilizes the myocardium against lethal dysrhythmias in symptomatic hyperkalemia with peaked T waves.", "Dietary potassium restriction belongs to long-term management and has no effect on a potassium of 6.8 with electrocardiographic changes already present."]}, {"q": "A client with chronic kidney disease has an arteriovenous fistula in the left forearm. Which nursing action is essential?", "opts": ["Palpate for a thrill and auscultate for a bruit over the fistula each shift", "Draw all routine laboratory specimens from the fistula arm", "Take blood pressures in the left arm to avoid the IV site on the right", "Apply a snug elastic bandage over the fistula between treatments"], "a": 0, "r": "A palpable thrill and audible bruit confirm patency of the fistula, and their absence signals clotting that requires immediate reporting to preserve dialysis access. Blood draws, blood pressure cuffs, and constrictive dressings on the access extremity compress the vessel and can cause thrombosis, so they are contraindicated.", "why": ["Correct. A palpable thrill and audible bruit confirm fistula patency, and their absence signals clotting that must be reported to salvage the access.", "Routine venipuncture in the access arm risks infection and thrombosis; the fistula is cannulated only for dialysis by specially trained staff.", "A blood pressure cuff compresses the fistula and can cause thrombosis, so pressures must be taken in the opposite extremity.", "A snug elastic bandage constricts the fistula and can occlude flow, so the access site is kept free of constrictive wraps."]}, {"q": "A client receiving continuous ambulatory peritoneal dialysis reports abdominal pain, and the nurse notes that the drained effluent is cloudy. Which action should the nurse take?", "opts": ["Increase the dwell time of the next exchange", "Obtain a specimen of the effluent for culture and notify the provider", "Warm the next dialysate bag in a microwave before instilling", "Document the expected finding and continue exchanges"], "a": 1, "r": "Cloudy effluent with abdominal pain is the hallmark of peritonitis, the most common serious complication of peritoneal dialysis, and requires culture plus prompt antibiotic therapy. Treating it as an expected finding delays treatment and risks progression to sepsis and permanent membrane damage.", "why": ["Lengthening the dwell does not treat infection and would keep contaminated fluid in the peritoneum longer, allowing bacteria to multiply further.", "Correct. Cloudy effluent with abdominal pain is the hallmark of peritonitis, so culture and prompt provider notification allow antibiotics to begin quickly.", "Dialysate is warmed with dry heat, never a microwave, which heats unevenly and can burn the peritoneum, and this ignores the infection.", "Cloudy effluent is never an expected finding, so documenting and continuing exchanges delays antibiotic therapy and risks sepsis and membrane damage."]}, {"q": "A 5-year-old with nephrotic syndrome has generalized edema, 4+ proteinuria, and serum albumin of 1.9 g/dL. Which nursing assessment finding requires the most immediate attention?", "opts": ["Weight gain of 0.5 kg over 24 hours", "Periorbital edema that is worse in the morning", "Frothy-appearing urine in the collection container", "Temperature of 102.2 F with abdominal tenderness"], "a": 3, "r": "Children with nephrotic syndrome lose immunoglobulins in the urine and are at high risk for spontaneous bacterial peritonitis, so fever with abdominal tenderness is a potentially life-threatening infection requiring immediate action. Periorbital edema on waking is a classic expected finding of the disease and is monitored rather than treated urgently.", "why": ["A half-kilogram gain in 24 hours warrants continued monitoring of fluid status but is far less urgent than signs of systemic infection.", "Periorbital edema that is worse on waking is a classic expected finding in nephrotic syndrome and is monitored rather than treated urgently.", "Frothy urine reflects the heavy proteinuria already documented and is an anticipated feature of nephrotic syndrome rather than an emergency.", "Correct. Urinary immunoglobulin loss predisposes to spontaneous bacterial peritonitis, so fever with abdominal tenderness signals a life-threatening infection needing immediate action."]}, {"q": "An 84-year-old resident of a long-term care facility becomes acutely confused and incontinent over 12 hours. Temperature is 99.1 F and urine is cloudy with a strong odor. Which conclusion should the nurse draw?", "opts": ["The confusion is an expected consequence of aging", "The client is likely experiencing early dementia and needs a neurology referral", "New-onset confusion may be the primary presentation of a urinary tract infection in an older adult", "The client should be restrained until the confusion resolves"], "a": 2, "r": "Older adults often lack fever and dysuria, and acute change in mental status is frequently the first sign of a urinary tract infection, so a urinalysis and culture are indicated. Attributing sudden confusion to normal aging or dementia would miss an acute, treatable infection and delay antibiotics.", "why": ["Acute confusion is never a normal consequence of aging, and dismissing it as expected delays workup of a treatable acute illness.", "Dementia develops gradually over months to years, so a change occurring over 12 hours points to an acute cause instead.", "Correct. Older adults often lack fever and dysuria, so new-onset confusion with cloudy odorous urine suggests infection warranting urinalysis and culture.", "Restraints do not treat the underlying infection, increase agitation and injury risk, and require an order after less restrictive measures fail."]}, {"q": "A client is admitted with severe right flank pain radiating to the groin and hematuria; a CT scan confirms a 4 mm ureteral stone. Which intervention should the nurse include in the plan of care?", "opts": ["Restrict oral fluids to 1,000 mL per day to reduce urine production", "Strain all urine and encourage fluid intake of 2.5 to 3 L per day", "Maintain strict bed rest until the stone passes", "Insert an indwelling catheter to monitor output hourly"], "a": 1, "r": "Straining urine captures the stone for compositional analysis that guides prevention, and generous fluid intake promotes stone passage and flushes the urinary tract. Restricting fluids concentrates urine and encourages further crystal formation, which is the opposite of the desired outcome.", "why": ["Restricting fluids concentrates the urine, promotes further crystal formation, and makes spontaneous passage of the 4 mm stone considerably less likely.", "Correct. Straining captures the stone for analysis that guides prevention, and 2.5 to 3 liters daily promotes passage and flushes the tract.", "Strict bed rest is not indicated, since ambulation helps move the stone down the ureter and prevents complications of immobility.", "An indwelling catheter is invasive, adds infection risk, and would trap the very stone the nurse needs to capture by straining urine."]}, {"q": "A client with benign prostatic hyperplasia begins taking tamsulosin. Which instruction is most important for the nurse to provide?", "opts": ["Expect your urine to turn bright orange while on this drug", "Take the medication with a full glass of grapefruit juice", "Stop the medication as soon as your urinary stream improves", "Rise slowly from sitting or lying because this drug can cause dizziness and fainting"], "a": 3, "r": "Tamsulosin is an alpha-1 blocker that relaxes smooth muscle in the bladder neck and also causes vasodilation, producing orthostatic hypotension and first-dose syncope, so fall prevention teaching is the safety priority. Stopping the drug when symptoms improve would allow obstruction to recur, since the medication controls rather than cures the condition.", "why": ["Orange discoloration of urine occurs with phenazopyridine or rifampin, not tamsulosin, so this instruction is factually inaccurate for this drug.", "Grapefruit juice can raise drug levels and deepen the hypotensive effect, so it should be avoided rather than deliberately taken with tamsulosin.", "Tamsulosin controls rather than cures prostatic obstruction, so stopping it once the stream improves allows symptoms and retention to return.", "Correct. Alpha-1 blockade causes vasodilation with orthostatic hypotension and first-dose syncope, making slow position changes the essential fall-prevention instruction."]}, {"q": "The nurse is supervising a nursing assistant caring for a client with an indwelling urinary catheter. Which observed action requires the nurse to intervene?", "opts": ["The assistant places the drainage bag on the bed beside the client during transport", "The assistant secures the catheter tubing to the client's thigh", "The assistant performs perineal care with soap and water", "The assistant empties the drainage bag when it is two-thirds full"], "a": 0, "r": "Raising the drainage bag to or above bladder level allows contaminated urine to reflux into the bladder, markedly increasing the risk of catheter-associated urinary tract infection, so the nurse must intervene. Securing the tubing to the thigh is correct practice because it prevents traction and urethral trauma.", "why": ["Correct. A bag at or above bladder level lets contaminated urine reflux back, so the nurse must intervene to prevent catheter-associated infection.", "Securing the tubing to the thigh is correct practice that prevents traction on the urethra and accidental dislodgement, so no intervention is needed.", "Perineal care with soap and water is the recommended method for reducing periurethral bacteria, so this action requires no correction.", "Emptying the bag at two-thirds full is appropriate, since bags are emptied before they overfill and strain the closed drainage system."]}, {"q": "A client with stage 4 chronic kidney disease is prescribed calcium acetate. Which instruction should the nurse give about this medication?", "opts": ["Take it at bedtime on an empty stomach", "Take it 1 hour before meals to increase absorption", "Take it with each meal to bind phosphorus in food", "Take it only on dialysis days"], "a": 2, "r": "Calcium acetate is a phosphate binder that must be present in the gut with food to bind dietary phosphorus and lower serum phosphate levels. Taking it on an empty stomach or before meals leaves no phosphorus available to bind, making the therapy ineffective and allowing renal osteodystrophy to progress.", "why": ["Taking it at bedtime on an empty stomach leaves no dietary phosphorus in the gut to bind, so serum phosphate remains elevated.", "Calcium acetate is not meant to be absorbed, and dosing an hour before meals separates it from the phosphorus it must bind.", "Correct. As a phosphate binder, calcium acetate must be present in the gut with food to bind dietary phosphorus and lower serum phosphate.", "Phosphorus is consumed every day, so limiting the binder to dialysis days lets phosphate accumulate and renal osteodystrophy progress."]}, {"q": "A client on hemodialysis three times weekly asks about food choices. Which selection indicates the client understands the prescribed restrictions?", "opts": ["Baked potato with skin, banana, and orange juice", "Canned soup, processed lunch meat, and dill pickles", "Cantaloupe, dried apricots, and tomato juice", "White rice, green beans, and a small serving of grilled chicken"], "a": 3, "r": "White rice, green beans, and a controlled portion of protein are appropriately low in potassium, phosphorus, and sodium for a client on hemodialysis. Potatoes, bananas, and orange juice are all high-potassium foods that could precipitate life-threatening hyperkalemia between dialysis treatments.", "why": ["Potato with skin, banana, and orange juice are all high-potassium foods that could precipitate dangerous hyperkalemia between dialysis treatments.", "Canned soup, processed lunch meat, and pickles are extremely high in sodium and phosphate additives, worsening thirst, fluid gain, and hypertension.", "Cantaloupe, dried apricots, and tomato juice are concentrated potassium sources and are specifically discouraged for clients receiving hemodialysis.", "Correct. White rice, green beans, and a small portion of chicken keep potassium, phosphorus, and sodium within the prescribed dialysis limits."]}], "maternity": [{"q": "A client at 34 weeks gestation presents with a blood pressure of 164/108, 3+ proteinuria, a severe headache, and epigastric pain. Which nursing action takes priority?", "opts": ["Obtain a 24-hour urine collection for total protein", "Initiate seizure precautions and prepare to administer magnesium sulfate as prescribed", "Encourage ambulation to promote circulation", "Schedule a follow-up prenatal visit in one week"], "a": 1, "r": "Headache and epigastric pain with severe-range hypertension indicate preeclampsia with severe features and imminent risk of eclamptic seizure, so magnesium sulfate prophylaxis and seizure precautions protect both client and fetus. A 24-hour urine collection may confirm the diagnosis but takes a full day and does nothing to prevent the immediate threat of seizure.", "why": ["A 24-hour collection takes a full day and only confirms proteinuria already documented, doing nothing to prevent an imminent eclamptic seizure.", "Correct. Severe-range hypertension with headache and epigastric pain signals impending eclampsia, so seizure precautions and magnesium sulfate protect mother and fetus.", "Ambulation adds stimulation and injury risk in a client who could seize at any moment; a quiet, low-stimulation environment is required.", "Waiting a week for follow-up ignores a hypertensive emergency that demands immediate treatment and likely delivery planning at 34 weeks."]}, {"q": "During labor, the nurse observes fetal heart rate decelerations that begin after the peak of each contraction and return to baseline after the contraction ends. Which action should the nurse take first?", "opts": ["Increase the oxytocin infusion rate to shorten labor", "Prepare the client for immediate cesarean birth", "Reposition the client to a left lateral position", "Document the reassuring fetal heart rate pattern"], "a": 2, "r": "Late decelerations indicate uteroplacental insufficiency, and left lateral repositioning relieves aortocaval compression to improve placental perfusion as the first corrective measure, followed by stopping oxytocin, giving oxygen, and increasing IV fluids. Increasing oxytocin would intensify contractions and further reduce placental blood flow, worsening fetal hypoxia.", "why": ["Increasing oxytocin intensifies contractions and further reduces placental perfusion, so the infusion is stopped rather than titrated up with late decelerations.", "Cesarean birth may follow if intrauterine resuscitation fails, but noninvasive corrective measures such as repositioning are attempted first.", "Correct. Late decelerations reflect uteroplacental insufficiency, and left lateral positioning relieves aortocaval compression to improve placental blood flow immediately.", "This pattern is not reassuring, since decelerations beginning after the peak and recovering late indicate hypoxia requiring intervention rather than documentation alone."]}, {"q": "Immediately after spontaneous rupture of membranes, the nurse sees a loop of umbilical cord protruding from the vagina and the fetal heart rate drops to 78 beats per minute. Which action should the nurse take first?", "opts": ["Apply a gloved hand to lift the presenting part off the cord and call for help", "Attempt to gently replace the cord into the vagina", "Place the client in high Fowler position", "Obtain a set of maternal vital signs"], "a": 0, "r": "Manually elevating the presenting part relieves cord compression and restores fetal oxygenation while the team prepares for emergency cesarean birth, and the nurse maintains this position continuously. Attempting to replace the cord causes vasospasm and further compromises fetal circulation, so it is contraindicated.", "why": ["Correct. Manually lifting the presenting part off the cord restores fetal oxygenation and is held continuously until emergency cesarean birth is accomplished.", "Handling or replacing the cord causes vasospasm that worsens fetal hypoxia, so the cord is never pushed back into the vagina.", "High Fowler position increases pressure of the presenting part against the cord; knee-chest or Trendelenburg positioning relieves compression instead.", "Maternal vital signs are needed before surgery, but obtaining them first leaves the cord compressed while the fetal heart rate remains at 78."]}, {"q": "A client receiving a magnesium sulfate infusion for preeclampsia has a respiratory rate of 10, absent deep tendon reflexes, and urine output of 20 mL/hr. Which action should the nurse take?", "opts": ["Increase the infusion rate to achieve a therapeutic level", "Administer an additional loading dose", "Continue the infusion and reassess in 1 hour", "Stop the infusion and prepare to administer calcium gluconate"], "a": 3, "r": "Respiratory depression, loss of reflexes, and oliguria are signs of magnesium toxicity, so the infusion is stopped immediately and calcium gluconate, the antidote, is given to prevent respiratory and cardiac arrest. Continuing or increasing the infusion would allow serum magnesium to rise further and could be fatal.", "why": ["Increasing the rate would drive serum magnesium higher in a client already showing toxicity, risking respiratory arrest and cardiac collapse.", "A second loading dose adds magnesium to a client whose reflexes are already absent, compounding the toxicity instead of reversing it.", "Waiting an hour with a respiratory rate of 10 and absent reflexes allows toxicity to progress toward respiratory and cardiac arrest.", "Correct. Respiratory depression, absent reflexes, and oliguria indicate magnesium toxicity, so the infusion is stopped and calcium gluconate, the antidote, is given."]}, {"q": "Thirty minutes after a vaginal birth, a client saturates a perineal pad in 10 minutes. The fundus is boggy and located above the umbilicus and displaced to the right. Which action should the nurse take first?", "opts": ["Administer methylergonovine intramuscularly", "Massage the fundus until firm and then assist the client to empty the bladder", "Begin a rapid infusion of lactated Ringer solution", "Notify the provider and prepare for surgical exploration"], "a": 1, "r": "A boggy, elevated, and right-deviated fundus indicates uterine atony with bladder distention, and fundal massage plus bladder emptying are the immediate independent nursing actions that restore uterine tone and control bleeding. Methylergonovine may be needed next but is a dependent intervention and is contraindicated in hypertensive clients, so massage comes first.", "why": ["Methylergonovine may be needed if bleeding continues, but it is a dependent order and is contraindicated in hypertension, so massage comes first.", "Correct. A boggy, elevated, right-deviated fundus indicates atony with bladder distention, so massage plus emptying the bladder restores uterine tone immediately.", "Rapid fluid infusion supports circulating volume but does not stop the bleeding; the uterus must contract to compress the placental site vessels.", "Surgical exploration is reserved for retained fragments or lacerations after simpler measures fail, and this cause is correctable at the bedside."]}, {"q": "A first-time mother who is breastfeeding reports sore, cracked nipples on day 3 postpartum. Which teaching should the nurse provide?", "opts": ["Ensure the infant latches with a wide mouth taking in the nipple and much of the areola", "Limit each feeding to 5 minutes per breast until soreness resolves", "Wash the nipples with soap before and after each feeding", "Offer formula supplementation to allow the nipples to heal for 48 hours"], "a": 0, "r": "Most nipple trauma results from shallow latch, so correcting the latch so the infant takes in the areola rather than just the nipple resolves the pain and protects the milk supply. Soap removes the protective secretions of the Montgomery glands and further dries and cracks the skin, worsening the problem.", "why": ["Correct. Most nipple trauma results from a shallow latch, so a wide-mouth latch that includes much of the areola relieves pain and protects supply.", "Shortening feedings does not correct the shallow latch causing the damage and risks engorgement, plugged ducts, and a declining milk supply.", "Soap strips the protective lubricating secretions of the Montgomery glands, drying the skin further and worsening the cracking and pain.", "Formula supplementation reduces breast stimulation and milk supply and may cause nipple confusion without correcting the underlying latch problem."]}, {"q": "At 1 minute of life a newborn has a heart rate of 128, a weak slow cry, some flexion of the extremities, a grimace with suctioning, and a pink body with blue hands and feet. What Apgar score should the nurse assign?", "opts": ["5", "9", "6", "8"], "a": 2, "r": "Heart rate above 100 scores 2, weak cry scores 1, some flexion scores 1, grimace scores 1, and acrocyanosis scores 1, for a total of 6, which indicates moderate difficulty requiring stimulation and close monitoring. A score of 9 would require nearly all parameters to be optimal, which does not match the weak respiratory effort and limited tone described.", "why": ["Five is one point too low, because a heart rate above 100 earns the full two points that this total undercounts.", "Nine would require a vigorous cry, active flexion, and completely pink color, none of which match this newborn's weak cry and acrocyanosis.", "Correct. Heart rate 2, weak cry 1, some flexion 1, grimace 1, and acrocyanosis 1 total 6, indicating moderate difficulty needing stimulation.", "Eight overestimates this newborn, since the weak cry, partial flexion, and grimace each earn only one point rather than two."]}, {"q": "A client who is Rh negative gives birth to an Rh positive newborn, and the direct Coombs test on the newborn is negative. Which action should the nurse anticipate?", "opts": ["No further intervention is needed because the newborn is Rh positive", "Administering Rho(D) immune globulin to the newborn", "Preparing the newborn for an exchange transfusion", "Administering Rho(D) immune globulin to the mother within 72 hours of birth"], "a": 3, "r": "An Rh negative mother who delivers an Rh positive infant receives Rho(D) immune globulin within 72 hours to prevent maternal antibody formation that would endanger future pregnancies. The immune globulin is never given to the newborn, and an exchange transfusion is unnecessary because the negative Coombs test shows the infant is not currently sensitized.", "why": ["It is precisely because the newborn is Rh positive that prophylaxis is needed; doing nothing risks maternal sensitization that endangers future pregnancies.", "Rho(D) immune globulin is given to the Rh negative mother and never to the newborn, so this reflects a misunderstanding of the therapy.", "Exchange transfusion treats severe hemolytic disease, but the negative direct Coombs test shows the newborn's cells are not coated with maternal antibody.", "Correct. The Rh negative mother receives Rho(D) immune globulin within 72 hours of birth to prevent antibody formation that would threaten later pregnancies."]}, {"q": "A newborn whose mother had poorly controlled gestational diabetes is macrosomic and, at 1 hour of age, is jittery and diaphoretic with a weak cry. Which action should the nurse take first?", "opts": ["Obtain a heel-stick blood glucose level", "Place the newborn under a radiant warmer and recheck in 30 minutes", "Swaddle the newborn and place him in the bassinet to rest", "Notify the provider to order a septic workup"], "a": 0, "r": "Infants of diabetic mothers develop hyperinsulinemia in utero and are at high risk for hypoglycemia, and jitteriness with a weak cry demands immediate glucose measurement so treatment can begin. Simply swaddling and allowing the infant to rest delays detection of a condition that can rapidly cause seizures and neurologic injury.", "why": ["Correct. Jitteriness, diaphoresis, and a weak cry in a macrosomic infant of a diabetic mother demand an immediate heel-stick glucose measurement.", "A radiant warmer addresses cold stress, and waiting 30 minutes delays detection of hypoglycemia that can rapidly cause seizures and neurologic injury.", "Swaddling and letting the infant rest treats these findings as normal newborn behavior and postpones recognition of a dangerous glucose deficit.", "Sepsis can mimic these signs, but a glucose check is faster and noninvasive and addresses the far more likely cause here."]}, {"q": "Ten minutes after an epidural is placed, a laboring client's blood pressure falls from 118/72 to 82/46 and the fetal heart rate baseline drops to 100 beats per minute. Which action should the nurse take first?", "opts": ["Administer the prescribed dose of ephedrine", "Place the client in a semi-Fowler position and encourage slow breathing", "Turn the client to the left side and increase the IV fluid infusion rate", "Prepare the client for an immediate cesarean birth"], "a": 2, "r": "Sympathetic blockade from the epidural causes vasodilation and hypotension, and lateral positioning with an IV fluid bolus is the first-line nursing intervention to restore maternal blood pressure and placental perfusion. Ephedrine is an appropriate follow-up if positioning and fluids fail, but it is a dependent intervention that should not precede the immediate noninvasive measures.", "why": ["Ephedrine is an appropriate rescue if positioning and fluids fail, but it is a dependent order that should not precede noninvasive first-line measures.", "Semi-Fowler position does not relieve aortocaval compression, and slow breathing does nothing for the sympathetic blockade causing this vasodilation and hypotension.", "Correct. Lateral positioning relieves aortocaval compression while an IV fluid bolus counters epidural-induced vasodilation, restoring maternal pressure and placental perfusion.", "Cesarean birth is premature, since epidural-induced hypotension usually responds quickly to repositioning and fluids with recovery of the fetal heart rate."]}], "pediatrics": [{"q": "A 3-year-old arrives in the emergency department sitting forward in a tripod position, drooling, with a muffled voice, inspiratory stridor, and a temperature of 39.4 C (102.9 F). Which action should the nurse take first?", "opts": ["Use a tongue blade to visualize the posterior pharynx", "Keep the child upright in the parent's arms and notify the provider immediately while preparing for emergency airway management", "Obtain a throat culture and send it to the laboratory", "Place the child supine and start a peripheral IV for antibiotics"], "a": 1, "r": "Drooling, muffled voice, stridor, and tripod positioning suggest epiglottitis, a true airway emergency; keeping the child calm and upright prevents complete obstruction while skilled airway support is mobilized (ABCs). Inspecting the pharynx with a tongue blade or forcing the child supine can trigger laryngospasm and total occlusion, so those actions are contraindicated.", "why": ["Depressing the tongue in suspected epiglottitis can provoke laryngospasm and complete airway obstruction, so this action is contraindicated.", "Correct. Keeping the child calm and upright preserves the marginal airway while skilled personnel prepare for emergency intubation, addressing airway first.", "A throat culture requires pharyngeal manipulation and delays airway management; cultures are obtained only after the airway is secured.", "Supine positioning lets the swollen epiglottis occlude the airway, and an IV start increases crying and obstruction before the airway is protected."]}, {"q": "A 4-month-old with respiratory syncytial virus bronchiolitis has a respiratory rate of 68/min, nasal flaring, thick nasal secretions, and an oxygen saturation of 88% on room air. Which action should the nurse take first?", "opts": ["Offer the ordered oral fluids to help thin secretions", "Place the infant prone to improve oxygenation", "Suction the nares with a bulb syringe and apply supplemental oxygen", "Obtain a nasopharyngeal swab for RSV testing"], "a": 2, "r": "Infants are obligate nose breathers, so clearing the nares and correcting hypoxemia addresses airway and breathing first under the ABC framework. Offering oral fluids to a tachypneic infant with a rate of 68/min risks aspiration and does nothing for the immediate hypoxemia.", "why": ["Oral fluids in an infant breathing 68 times per minute risk aspiration and do nothing for the current hypoxemia.", "Prone positioning is not an established bronchiolitis intervention, raises sudden death risk in infants, and leaves the obstructed nares uncleared.", "Correct. Infants are obligate nose breathers, so bulb suctioning plus supplemental oxygen relieves the obstruction and corrects the 88% saturation immediately.", "An RSV swab confirms the diagnosis but is diagnostic rather than therapeutic, and collecting it leaves the hypoxemia untreated."]}, {"q": "A parent whose 18-month-old had a first simple febrile seizure is being discharged. Which statement by the parent indicates that teaching has been effective?", "opts": ["If another seizure occurs, I will turn my child on his side and time how long it lasts.", "I will place a padded tongue blade in his mouth to protect his tongue.", "Giving ibuprofen at the first sign of fever will prevent all future seizures.", "My child will need to take antiseizure medication every day for life."], "a": 0, "r": "Side-lying positioning protects the airway from aspiration and timing the event guides treatment decisions, which is the core of safe home seizure management. Placing anything in the mouth is unsafe and can cause oral trauma or obstruction, and antipyretics have not been shown to prevent recurrent febrile seizures.", "why": ["Correct. Side-lying protects the airway from aspiration during a seizure, and timing the event guides decisions about emergency treatment.", "Nothing should be placed in the mouth during a seizure; a tongue blade can break teeth, lacerate tissue, or obstruct the airway.", "Antipyretics improve comfort but have never been shown to prevent recurrence of febrile seizures, so this statement is factually inaccurate.", "Simple febrile seizures are benign and self-limited, so daily lifelong antiseizure medication is not indicated and reflects a misunderstanding."]}, {"q": "A 12-month-old is scheduled for MMR and varicella vaccines at a well-child visit. The child has clear rhinorrhea, an occasional cough, and a temperature of 37.6 C (99.7 F). Which action should the nurse take?", "opts": ["Withhold both vaccines until the child has been symptom free for 2 weeks", "Administer the varicella vaccine only", "Notify the provider to obtain an order deferring immunizations for 1 month", "Administer both vaccines as scheduled, because a mild upper respiratory infection is not a contraindication"], "a": 3, "r": "Mild illness with or without low-grade fever is not a contraindication to immunization, and deferring doses creates missed opportunities for protection. Withholding the vaccines would delay immunity unnecessarily; only moderate to severe acute illness or a true anaphylactic reaction to a component warrants postponement.", "why": ["No two-week symptom-free rule exists, and this delay would create repeated missed opportunities to immunize this child.", "Splitting the visit is unnecessary because neither live vaccine is contraindicated by clear rhinorrhea and a temperature of 37.6 C.", "Deferring a month delays protection without benefit, and no provider order is needed because mild illness is not a contraindication.", "Correct. Mild upper respiratory illness with low-grade fever is not a contraindication, so both live vaccines are given as scheduled."]}, {"q": "The nurse is teaching the parents of a 4-year-old with cystic fibrosis about pancreatic enzyme replacement. Which instruction should the nurse include?", "opts": ["Give the enzymes once daily at bedtime", "Mix the enzyme beads in hot milk so they dissolve completely", "Give the enzyme capsules with every meal and snack, sprinkling the beads on applesauce if the child cannot swallow the capsule", "Hold the enzymes on days the child has loose stools"], "a": 2, "r": "Enzymes must be given with all meals and snacks to allow fat and protein absorption, and the beads may be sprinkled on a small amount of an acidic food such as applesauce. Holding enzymes when stools are loose worsens steatorrhea and malabsorption, since loose fatty stools usually signal an inadequate rather than an excessive enzyme dose.", "why": ["Once-daily bedtime dosing leaves every meal uncovered, so fat and protein pass unabsorbed and steatorrhea and poor growth continue.", "Heat destroys the enteric coating on the enzyme beads and milk is alkaline; beads belong on a small amount of acidic food.", "Correct. Enzymes must accompany every meal and snack, and the beads may be sprinkled on applesauce when the child cannot swallow capsules.", "Loose fatty stools usually indicate too little enzyme rather than too much, so holding doses worsens malabsorption and weight loss."]}, {"q": "A 4-year-old with Kawasaki disease is receiving IV immunoglobulin and high-dose aspirin. Which assessment finding requires immediate follow-up by the nurse?", "opts": ["Bilateral basilar crackles and a new S3 gallop", "Red, cracked lips and a strawberry tongue", "Peeling skin on the palms and soles", "Irritability and bilateral conjunctival redness without drainage"], "a": 0, "r": "Crackles with a new gallop suggest myocarditis or fluid overload from the IVIG infusion and represent a cardiovascular emergency requiring immediate intervention (ABCs). Cracked lips, strawberry tongue, desquamation, irritability, and nonexudative conjunctivitis are all expected features of Kawasaki disease and do not require urgent action.", "why": ["Correct. Crackles with a new S3 gallop suggest myocarditis or IVIG-related fluid overload, a cardiovascular emergency under the ABC framework.", "Red cracked lips and strawberry tongue are classic expected findings in Kawasaki disease and call for comfort measures, not urgent intervention.", "Desquamation of the palms and soles is an expected subacute-phase feature of Kawasaki disease rather than an emergency.", "Irritability and nonexudative conjunctival redness are hallmark Kawasaki findings; they are distressing but not immediately dangerous."]}, {"q": "During a 9-month well-child visit, which finding should the nurse report to the provider for further developmental evaluation?", "opts": ["The infant cries when the parent leaves the examination room", "The infant bangs two blocks together", "The infant says mama without referring to a specific person", "The infant is unable to sit without support"], "a": 3, "r": "Independent sitting is expected by about 8 months, so its absence at 9 months is a gross motor red flag warranting evaluation. Separation anxiety, banging objects together, and nonspecific babbling of mama are all normal 9-month findings and require only reassurance.", "why": ["Separation anxiety peaks near 9 months, so crying when the parent leaves reflects normal attachment rather than a developmental delay.", "Banging two blocks together is an age-appropriate fine motor milestone for a 9-month-old and needs no referral.", "Nonspecific babbling of mama is normal at 9 months; specific use of the word is not expected until closer to 12 months.", "Correct. Independent sitting is expected by about 8 months, so its absence at 9 months is a gross motor red flag requiring evaluation."]}, {"q": "A 6-month-old with tetralogy of Fallot suddenly becomes deeply cyanotic and irritable while crying during a diaper change. Which action should the nurse take first?", "opts": ["Administer oxygen by face mask and start an IV line", "Place the infant in a knee-chest position", "Give the scheduled dose of digoxin", "Lay the infant flat and stimulate crying to expand the lungs"], "a": 1, "r": "The knee-chest position increases systemic vascular resistance and decreases right-to-left shunting, which is the immediate treatment for a hypercyanotic tet spell and can be done instantly at the bedside. Oxygen and IV access follow, but starting an IV first prolongs crying and worsens the shunt.", "why": ["Oxygen and IV access are appropriate but come after positioning; starting an IV first prolongs crying and worsens the right-to-left shunt.", "Correct. The knee-chest position raises systemic vascular resistance, decreasing right-to-left shunting and relieving the hypercyanotic tet spell immediately.", "Digoxin does not relieve the infundibular spasm of a tet spell, and giving a scheduled dose delays the positioning the infant needs.", "Lying flat lowers systemic vascular resistance and stimulating crying increases the shunt, deepening the cyanosis rather than relieving it."]}, {"q": "The nurse reviews home safety with the parent of a 2-year-old. Which statement by the parent requires further teaching?", "opts": ["I keep all cleaning products in a locked cabinet.", "My toddler rides in a rear-facing car seat in the back seat.", "I let my 2-year-old eat popcorn and whole grapes while watching television.", "I set the water heater temperature at 49 C (120 F)."], "a": 2, "r": "Popcorn and whole grapes are leading choking hazards for children under 4, and eating while distracted increases aspiration risk, so this statement shows a knowledge deficit. Locked chemicals, rear-facing restraint, and a water heater at 49 C (120 F) are all correct toddler safety measures.", "why": ["Locking cleaning products away is correct poison prevention for a toddler and shows appropriate understanding.", "Rear-facing restraint in the back seat is the recommended standard for a 2-year-old, so no further teaching is needed.", "Correct. Popcorn and whole grapes are leading choking hazards under age 4, and eating while distracted by television increases aspiration risk.", "A water heater set at 49 C (120 F) prevents scald burns and reflects correct home safety practice."]}, {"q": "An 18 kg child is prescribed amoxicillin 45 mg/kg/day divided every 12 hours. The pharmacy sends a labeled syringe containing 500 mg for the next dose. Which action should the nurse take?", "opts": ["Hold the dose and clarify the order with the provider, because the calculated safe dose is 405 mg every 12 hours", "Give the 500 mg dose because it is within 20% of the calculated dose", "Administer half of the 500 mg dose and document the change", "Administer the dose as sent and monitor the child for adverse effects"], "a": 0, "r": "45 mg/kg x 18 kg = 810 mg/day, divided by 2 doses = 405 mg per dose, so the 500 mg syringe exceeds the prescribed dose and must be clarified before administration. Adjusting or splitting the dose independently is outside the nurse's scope and giving an unverified dose violates safe medication administration.", "why": ["Correct. 45 mg/kg x 18 kg equals 810 mg daily, or 405 mg every 12 hours, so the 500 mg syringe exceeds the order.", "No twenty percent tolerance rule exists in safe medication administration; a dose that does not match the order must be verified, not rationalized.", "Splitting the syringe to 250 mg underdoses the child, and independently altering a prescribed dose exceeds the nurse's scope.", "Knowingly giving a discrepant dose and watching for adverse effects exposes the child to harm instead of preventing it."]}], "mental-health": [{"q": "A client admitted for major depressive disorder has begun giving away personal belongings and tells the nurse, \"Everyone would be better off soon; I won't be a burden much longer.\" Which action should the nurse take first?", "opts": ["Reassure the client that symptoms improve once the antidepressant takes effect", "Document the statement and continue with unit rounds", "Ask the client directly whether he is thinking of killing himself and whether he has a plan", "Notify the client's family that he is feeling hopeless"], "a": 2, "r": "Asking directly about suicidal ideation, plan, and means is the assessment step that determines the level of risk and precautions needed; direct questioning does not increase risk. Offering reassurance closes communication and leaves the immediate physical safety threat, the highest Maslow priority, unassessed.", "why": ["Reassurance about antidepressant onset closes communication and leaves the immediate risk of self-harm, the highest safety priority, unassessed.", "Documenting and continuing rounds leaves a client showing classic suicide warning signs unassessed and unmonitored.", "Correct. Asking directly about ideation, plan, and means determines lethality and the precautions needed; direct questioning does not increase risk.", "Calling the family may follow later, but it neither measures lethality nor secures the client's immediate physical safety."]}, {"q": "A client who takes lithium for bipolar disorder reports vomiting and diarrhea for 2 days and now has a coarse hand tremor and an unsteady gait. The serum lithium level is 2.1 mEq/L. Which action should the nurse take first?", "opts": ["Hold the next dose and notify the provider immediately", "Encourage a low-sodium diet and increased fluid intake", "Administer the dose with food to reduce the nausea", "Document the findings and reassess the client in 4 hours"], "a": 0, "r": "A level above 1.5 mEq/L with vomiting, coarse tremor, and ataxia indicates lithium toxicity, so the drug is withheld and the provider notified before any further dose is given. Restricting sodium is dangerous because low sodium increases lithium reabsorption and would raise the level further.", "why": ["Correct. A leve
