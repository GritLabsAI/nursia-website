opriate?", "opts": ["Apply ice packs to the knees for 30 minutes each morning", "Rest the joints completely and avoid activity until the pain resolves", "Apply moist heat before activity and follow with gentle range-of-motion exercise", "Wrap the knees tightly with elastic bandages overnight"], "a": 2, "r": "Moist heat increases blood flow and tissue extensibility, relieving the stiffness of osteoarthritis and making subsequent gentle movement more effective. Cold is better suited to acute inflammatory flares, and complete inactivity leads to further stiffness, contracture, and muscle atrophy.", "why": ["Thirty minutes of ice each morning increases stiffness in osteoarthritis; cold is better suited to acute inflammatory flares.", "Complete rest until pain resolves leads to further stiffness, contracture, and muscle atrophy around the arthritic knees.", "Correct. Moist heat increases blood flow and tissue extensibility, easing morning stiffness so gentle range of motion becomes more effective.", "Tight elastic wraps worn overnight can impair circulation and do nothing to relieve osteoarthritic morning stiffness."]}, {"q": "The nurse is providing oral care for an unconscious client receiving oxygen by mask. Which action should the nurse take?", "opts": ["Turn the client's head to the side and use suction while cleaning with a small amount of solution on a soft brush or swab", "Place the client supine and flat to allow full access to the mouth", "Use lemon-glycerin swabs every 2 hours to moisten the mucosa", "Omit oral care while the client is receiving nothing by mouth"], "a": 0, "r": "Side-lying positioning with suction available protects the airway of the unconscious client during oral care, which reduces oral bacterial load and ventilator- and hospital-associated pneumonia. Supine flat positioning invites aspiration, lemon-glycerin dries mucosa further, and NPO status makes oral care more important, not less.", "why": ["Correct. Side-lying positioning with suction available protects the unconscious client's airway while small amounts of solution clean the mouth safely.", "Lying supine and flat pools fluid at the back of the throat and invites aspiration in a client who cannot protect the airway.", "Lemon-glycerin swabs dry and irritate oral mucosa and are no longer recommended for oral care.", "Being NPO makes oral care more important, not optional, because bacteria and secretions still accumulate in the mouth."]}], "pharm-parenteral": [{"q": "A client with a pulmonary embolism is receiving a continuous IV heparin infusion at 1,200 units/hr. The 0600 aPTT result is 110 seconds (control 30 seconds), and the nurse notes bleeding around the peripheral IV site. What should the nurse do first?", "opts": ["Administer protamine sulfate 25 mg IV push", "Stop the heparin infusion and notify the provider", "Apply a pressure dressing to the IV site and recheck in 1 hour", "Decrease the infusion rate by half and repeat the aPTT in 6 hours"], "a": 1, "r": "An aPTT more than 2.5 times control with active bleeding indicates excessive anticoagulation, so the nurse stops the ongoing source of harm and notifies the provider for new orders. Protamine sulfate is the antidote but requires a provider order and is not the first independent nursing action; simply dressing the site allows the heparin to keep circulating.", "why": ["Protamine is the correct antidote but requires a provider order, and giving it before stopping the infusion leaves heparin still flowing in.", "Correct. Stopping the infusion immediately halts further anticoagulation, and provider notification secures new orders when the aPTT is nearly four times control with active bleeding.", "A pressure dressing treats the visible oozing while systemic heparin keeps circulating unchecked, and waiting an hour delays correction of dangerous over-anticoagulation.", "Halving the rate still delivers heparin to an already over-anticoagulated bleeding client, and rechecking the aPTT in six hours is far too long a delay."]}, {"q": "Fifteen minutes into a vancomycin 1 g IV infusion running over 30 minutes, a client reports itching and the nurse observes flushing of the face, neck, and upper chest with a blood pressure of 92/54 mm Hg. Which action is the priority?", "opts": ["Document the finding as an expected response to vancomycin", "Administer the next dose in a more dilute solution", "Obtain a set of blood cultures before continuing", "Stop the infusion and notify the provider"], "a": 3, "r": "Flushing, pruritus, and hypotension during rapid vancomycin infusion indicate vancomycin infusion reaction (red man syndrome), a histamine-mediated response managed by stopping the infusion, giving an antihistamine, and restarting at a slower rate. Documenting it as expected ignores the hypotension, which is a circulatory (ABC) problem requiring immediate intervention.", "why": ["Flushing may be common with vancomycin, but a blood pressure of 92/54 is a circulatory problem that cannot be charted as expected and ignored.", "Diluting future doses does help prevent recurrence, but it does nothing about the reaction happening right now during the infusion in progress.", "Blood cultures address suspected infection, not a histamine-mediated infusion reaction, and drawing them while the drug keeps infusing prolongs the hypotension.", "Correct. Flushing, pruritus, and hypotension during rapid vancomycin infusion indicate an infusion reaction; stopping the drug removes the histamine trigger while the provider orders antihistamines."]}, {"q": "Twenty minutes after a unit of packed red blood cells is started, a client has a temperature increase from 37.0 C to 38.6 C, chills, low back pain, and dark red-brown urine. What is the nurse's first action?", "opts": ["Stop the transfusion and keep the line open with 0.9% sodium chloride using new tubing", "Slow the transfusion to 50 mL/hr and administer acetaminophen", "Obtain a urine specimen for hemoglobin before taking further action", "Administer diphenhydramine 25 mg IV and continue the transfusion"], "a": 0, "r": "Fever, chills, flank pain, and hemoglobinuria signal an acute hemolytic transfusion reaction; stopping the blood immediately while maintaining IV access with normal saline through new tubing prevents further hemolysis and supports renal perfusion. Slowing the rate or premedicating still exposes the client to incompatible cells and can be fatal.", "why": ["Correct. Fever, chills, flank pain, and hemoglobinuria signal acute hemolysis, so stopping the blood halts further destruction while new saline tubing preserves access and renal perfusion.", "Slowing the rate still infuses incompatible red cells, and acetaminophen is appropriate for a simple febrile reaction rather than this hemolytic emergency.", "The urine specimen is part of the workup, but obtaining it first lets incompatible cells keep infusing during a potentially fatal reaction.", "Antihistamines treat mild allergic reactions; continuing this transfusion exposes the client to more incompatible cells and can cause acute renal failure or death."]}, {"q": "A client receiving total parenteral nutrition through a tunneled central catheter is scheduled for a procedure, and the next TPN bag is unavailable from the pharmacy. Which nursing action is most appropriate?", "opts": ["Flush the catheter with heparin and cap the lumen until TPN arrives", "Hang 0.9% sodium chloride at the same rate as the TPN", "Hang 10% dextrose in water at the ordered TPN rate and monitor glucose", "Reduce the current bag rate by half so it lasts until the new bag arrives"], "a": 2, "r": "Abrupt cessation of concentrated dextrose can cause rebound hypoglycemia because endogenous insulin remains elevated, so a 10% dextrose infusion is hung at the same rate as a bridge while glucose is monitored. Normal saline provides no glucose, and deliberately slowing or diluting the prescribed TPN alters the ordered nutrition and does not prevent hypoglycemia.", "why": ["Capping the line abruptly ends the concentrated dextrose infusion while endogenous insulin remains elevated, setting this client up for rebound hypoglycemia.", "Saline maintains line patency but supplies no glucose at all, so the client's still-circulating insulin can drive the blood sugar down sharply.", "Correct. Hanging 10% dextrose at the same rate bridges the gap and prevents rebound hypoglycemia from persistently elevated endogenous insulin while glucose is monitored.", "Deliberately halving the prescribed rate alters the ordered nutrition without a new order and still tapers glucose delivery downward, risking hypoglycemia."]}, {"q": "While a nurse is changing the injection cap on a client's subclavian central line, the client suddenly becomes dyspneic, tachycardic, and reports chest pain, and a churning murmur is auscultated. Which action should the nurse take first?", "opts": ["Elevate the head of the bed to high Fowler position", "Obtain a stat chest x-ray to confirm catheter placement", "Start a 500 mL normal saline bolus through a peripheral line", "Clamp the catheter and place the client in left lateral Trendelenburg position"], "a": 3, "r": "These findings indicate air embolism; clamping the catheter stops further air entry and left lateral Trendelenburg traps air in the right ventricular apex away from the pulmonary outflow tract while oxygen is applied. Raising the head of the bed increases air entrainment risk, and imaging delays a life-threatening circulatory emergency.", "why": ["Raising the head of the bed increases air entrainment at the subclavian site rather than trapping the air that has already entered.", "A chest x-ray may confirm catheter position later, but imaging first delays the clamping and positioning that keep the air bolus out of the pulmonary outflow tract.", "Fluid does not displace intracardiac air, and volume loading through a peripheral line wastes critical minutes during a rapidly fatal circulatory emergency.", "Correct. Clamping stops further air entry, and left lateral Trendelenburg traps the air bolus in the right ventricular apex away from the pulmonary outflow tract."]}, {"q": "A postoperative client using morphine patient-controlled analgesia has a respiratory rate of 7 breaths/min, oxygen saturation of 86% on room air, and is difficult to arouse. Which action should the nurse take first?", "opts": ["Stop the PCA, stimulate the client, and apply oxygen", "Administer naloxone 0.4 mg IV push immediately", "Reduce the PCA basal rate and continue to monitor", "Place the client in a side-lying position and obtain an ABG"], "a": 0, "r": "Airway and breathing come first: stopping the opioid source, arousing the client, and delivering oxygen can reverse mild opioid-induced respiratory depression within seconds and is fully within nursing scope. Naloxone is indicated if the client does not respond, but giving it before basic airway and oxygenation measures also risks abrupt reversal with severe pain and hemodynamic instability.", "why": ["Correct. Stopping the opioid source, stimulating the client, and applying oxygen address airway and breathing at once and lie fully within independent nursing scope.", "Naloxone is warranted if stimulation and oxygen fail, but giving it first risks abrupt reversal with severe postoperative pain and hemodynamic instability.", "Reducing the basal rate keeps opioid infusing into a client already breathing seven times a minute at 86 percent saturation; the PCA must stop entirely.", "An arterial blood gas only documents hypercapnia already evident from the respiratory rate and saturation, delaying oxygen and discontinuation of the opioid."]}, {"q": "A provider prescribes dopamine 5 mcg/kg/min for a client weighing 70 kg. The pharmacy supplies dopamine 400 mg in 250 mL of D5W. At what rate in mL/hr should the nurse set the infusion pump?", "opts": ["9.8 mL/hr", "12.5 mL/hr", "13.1 mL/hr", "21 mL/hr"], "a": 2, "r": "The dose is 5 mcg/kg/min x 70 kg = 350 mcg/min, or 21,000 mcg/hr (21 mg/hr); the concentration is 400 mg/250 mL = 1.6 mg/mL, so 21 mg/hr divided by 1.6 mg/mL equals approximately 13.1 mL/hr. The 21 mL/hr option mistakenly treats mg/hr as mL/hr and would deliver a significantly excessive vasopressor dose.", "why": ["This figure comes from an error converting micrograms per minute to milligrams per hour and would deliver far less dopamine than the prescribed 5 mcg/kg/min.", "This rate reflects a weight or rounding error; 21 mg/hr against a concentration of 1.6 mg/mL does not compute to 12.5 mL/hr.", "Correct. 5 mcg/kg/min times 70 kg equals 21 mg/hr, and dividing by the 1.6 mg/mL concentration gives approximately 13.1 mL/hr.", "This mistakenly treats the calculated 21 mg/hr dose as milliliters per hour, delivering roughly 60 percent more vasopressor than the provider prescribed."]}, {"q": "A client in status epilepticus is prescribed IV phenytoin 1 g loading dose. Which nursing action is essential during administration?", "opts": ["Mix the phenytoin in 250 mL of 5% dextrose in water", "Infuse at a rate no faster than 50 mg/min with cardiac monitoring", "Administer through the same line as the maintenance dextrose infusion", "Push the dose over 2 minutes to achieve a rapid therapeutic level"], "a": 1, "r": "Phenytoin must be infused no faster than 50 mg/min with continuous cardiac and blood pressure monitoring because rapid administration causes hypotension, bradycardia, and asystole. Phenytoin precipitates in dextrose solutions and must be diluted and flushed with normal saline only, so dextrose-based options are unsafe.", "why": ["Phenytoin precipitates in dextrose solutions, so mixing it in D5W risks crystal formation, line occlusion, and an unreliable loading dose during status epilepticus.", "Correct. Limiting the rate to 50 mg/min with continuous cardiac monitoring prevents the hypotension, bradycardia, and asystole that rapid phenytoin administration causes.", "Running phenytoin through a line already carrying dextrose causes precipitation at the Y-site; normal saline is the only compatible flush and diluent.", "Pushing a 1 gram load over two minutes vastly exceeds 50 mg/min and can produce profound hypotension and cardiac arrest."]}, {"q": "A client with a serum potassium of 2.8 mEq/L has a prescription for potassium chloride 40 mEq IV. Which action by the nurse indicates safe practice?", "opts": ["Administering the dose as an IV push over 5 minutes for rapid correction", "Adding the potassium to the existing bag already hanging at the bedside", "Withholding the dose until the client's urine output is documented as absent", "Diluting the dose and infusing it on a pump at no more than 10 mEq/hr through a patent line"], "a": 3, "r": "Potassium chloride is always diluted and infused by pump at a controlled rate, generally 10 mEq/hr on a general unit, because rapid delivery causes fatal dysrhythmias; IV push potassium is never acceptable. Adequate urine output should be verified before administration, so withholding for absent output is partially correct but the option as written describes confirming anuria rather than the safe administration technique.", "why": ["Intravenous push potassium is never acceptable at any rate, because the sudden myocardial concentration causes fatal dysrhythmias and cardiac arrest.", "Adding potassium to a bag already hanging prevents adequate mixing and can deliver a concentrated bolus, and it bypasses pharmacy preparation and labeling.", "Urine output should indeed be verified before giving potassium, but this option describes documented anuria, which is a reason to hold rather than a safe administration technique.", "Correct. Diluted potassium infused by pump at no more than 10 mEq/hr through a patent line corrects the level of 2.8 without provoking dysrhythmias."]}, {"q": "A nurse is teaching a client newly diagnosed with type 1 diabetes to mix NPH and regular insulin in one syringe. Which client statement indicates correct understanding?", "opts": ["I inject air into the NPH vial first, then air into the regular vial, and draw up the regular insulin first.", "I draw up the cloudy NPH insulin first so it does not contaminate the clear regular insulin.", "I should shake both vials vigorously to make sure the insulin is completely mixed.", "I can mix my insulin glargine with the regular insulin the same way to save an injection."], "a": 0, "r": "Air is injected into the longer-acting cloudy NPH vial first, then into the regular vial, and the clear regular (short-acting) insulin is withdrawn first to prevent contaminating the regular vial with NPH. Drawing NPH first would introduce intermediate-acting insulin into the regular vial and alter its onset; glargine is never mixed with any other insulin.", "why": ["Correct. Air is injected into the cloudy NPH vial first, then the regular vial, and clear regular insulin is withdrawn first to keep NPH out of it.", "Drawing the NPH first contaminates the regular vial with intermediate-acting insulin, unpredictably delaying the onset of every subsequent short-acting dose.", "Vigorous shaking creates foam and bubbles that make accurate dosing impossible; NPH is gently rolled between the palms to resuspend it.", "Insulin glargine is never mixed with any other insulin, because altering its pH disrupts the slow precipitation that gives it a flat basal action."]}], "reduction-risk": [{"q": "Two hours after a right femoral cardiac catheterization, a client reports increasing fullness in the groin. The nurse finds a 6 cm firm swelling at the site, heart rate 118/min, and blood pressure 88/52 mm Hg. What should the nurse do first?", "opts": ["Reposition the client on the left side and reassess in 15 minutes", "Instruct the client to flex the right leg to relieve pressure", "Apply firm manual pressure above the puncture site and call the provider", "Mark the edges of the swelling and continue routine monitoring"], "a": 2, "r": "An expanding groin hematoma with tachycardia and hypotension indicates arterial bleeding and impending hypovolemic shock, so direct pressure proximal to the puncture site controls hemorrhage while help is summoned. Marking the site or repositioning delays hemostasis, and flexing the affected extremity is contraindicated after femoral access.", "why": ["Repositioning does nothing to compress a bleeding femoral artery, and a fifteen-minute delay allows further blood loss in a client already hypotensive.", "Flexing the accessed extremity is contraindicated after femoral catheterization because it disrupts the puncture site and increases bleeding into the groin.", "Correct. Firm pressure proximal to the puncture compresses the bleeding artery immediately, and the tachycardia with hypotension means the provider is needed now.", "Marking the edges is useful for a stable hematoma, but with a heart rate of 118 and pressure of 88/52 routine monitoring delays urgently needed hemostasis."]}, {"q": "A client with heart failure taking digoxin and furosemide has these morning labs: potassium 3.0 mEq/L, sodium 138 mEq/L, digoxin level 1.6 ng/mL, creatinine 1.0 mg/dL. Which result requires the most immediate follow-up?", "opts": ["Potassium 3.0 mEq/L", "Sodium 138 mEq/L", "Digoxin level 1.6 ng/mL", "Creatinine 1.0 mg/dL"], "a": 0, "r": "Hypokalemia potentiates digoxin binding at the myocardial cell and can precipitate life-threatening dysrhythmias even when the digoxin level is therapeutic (0.5 to 2 ng/mL). The digoxin level itself is within range and the sodium and creatinine are normal, so they do not require urgent intervention.", "why": ["Correct. Potassium of 3.0 potentiates digoxin binding at the myocardial cell and can trigger lethal dysrhythmias even when the digoxin level is therapeutic.", "Sodium of 138 mEq/L falls within the normal range of 135 to 145 and requires no follow-up in this client.", "A digoxin level of 1.6 ng/mL sits within the therapeutic range of 0.5 to 2, so it is not the most urgent result.", "Creatinine of 1.0 mg/dL is normal and indicates adequate renal clearance of both the digoxin and the furosemide."]}, {"q": "Six hours after a total thyroidectomy, a client reports a sensation of tightness in the neck and difficulty swallowing. The dressing is dry, but the nurse notes the neck circumference has increased. Which action is the priority?", "opts": ["Loosen the dressing and document the finding", "Assess the airway and notify the surgeon immediately", "Check the Trousseau and Chvostek signs for hypocalcemia", "Elevate the head of the bed and apply an ice collar"], "a": 1, "r": "Neck tightness with increasing circumference after thyroidectomy suggests deep hematoma formation that can compress the trachea, so airway assessment and immediate surgeon notification take priority under the ABC framework. Hypocalcemia is a real post-thyroidectomy complication but is not an immediate airway threat, and comfort measures do not address the expanding bleed.", "why": ["Loosening the dressing may relieve superficial constriction but does nothing about a deep hematoma compressing the trachea, and documenting alone delays rescue.", "Correct. Increasing neck circumference with tightness after thyroidectomy suggests an expanding hematoma that can compress the trachea, so airway assessment and surgeon notification come first.", "Hypocalcemia is a genuine post-thyroidectomy complication worth assessing later, but tetany is not the immediate airway threat these findings describe.", "Elevation and an ice collar are reasonable comfort measures but will not stop an expanding bleed or relieve tracheal compression."]}, {"q": "A client on lithium for bipolar disorder reports 3 days of vomiting and diarrhea and now has coarse hand tremors, slurred speech, and unsteady gait. The lithium level is 2.1 mEq/L. Which action should the nurse anticipate?", "opts": ["Administering the next scheduled lithium dose with extra fluids", "Restricting sodium intake to promote lithium excretion", "Encouraging a low-fluid diet to concentrate the drug", "Holding the lithium and preparing the client for possible hemodialysis"], "a": 3, "r": "A level above 2.0 mEq/L with neurologic signs is severe lithium toxicity; the drug is held and hemodialysis may be required for definitive removal. Sodium and fluid restriction worsen toxicity because lithium is reabsorbed with sodium in the proximal tubule, and giving another dose would be dangerous.", "why": ["Giving another dose to a client already at a toxic 2.1 mEq/L with neurologic signs would deepen the toxicity and could be fatal.", "Sodium restriction increases lithium reabsorption in the proximal tubule, raising the serum level further rather than promoting its excretion.", "Restricting fluids concentrates lithium and worsens toxicity, especially in a client already volume depleted from three days of vomiting and diarrhea.", "Correct. A level above 2.0 with coarse tremor, slurred speech, and ataxia is severe toxicity, so lithium is held and hemodialysis may be needed."]}, {"q": "Immediately following a large-volume paracentesis in which 6 L of ascitic fluid was removed, a client's blood pressure falls from 122/76 to 86/50 mm Hg and the heart rate rises to 116/min. What is the nurse's best initial action?", "opts": ["Place the client supine, monitor vital signs closely, and notify the provider", "Ambulate the client to promote fluid redistribution", "Administer the prescribed diuretic to prevent reaccumulation", "Reinfuse the drained ascitic fluid through a peripheral IV"], "a": 0, "r": "Rapid removal of large volumes of ascites causes intravascular fluid shifts and hypovolemia, so supine positioning, close monitoring, and prompt notification for volume expansion (often albumin) address the circulatory compromise. A diuretic would deepen the hypovolemia, and ambulating a hypotensive client is unsafe.", "why": ["Correct. Removing 6 L of ascites shifts fluid out of the vascular space, so supine positioning with close monitoring and prompt notification supports perfusion until albumin is ordered.", "Ambulating a client with a systolic pressure of 86 risks syncope and injury, and it does nothing to restore intravascular volume.", "A diuretic pulls still more fluid from the vascular space and would deepen the hypovolemia this client already has after the drainage.", "Reinfusing drained ascitic fluid through a peripheral IV is not a nursing intervention and carries serious infection and reaction risks."]}, {"q": "A client returns to the unit after a bronchoscopy performed with moderate sedation and topical lidocaine to the oropharynx. The client asks for a drink of water. Which response by the nurse is most appropriate?", "opts": ["You may have small sips of water now that you are fully awake.", "I will bring ice chips instead, since they are safer after this test.", "I need to check that your gag reflex has returned before you have anything to drink.", "You must stay without food or fluids for 24 hours after a bronchoscopy."], "a": 2, "r": "Topical anesthesia suppresses the gag reflex and creates aspiration risk, so oral intake is withheld until the gag reflex is confirmed to have returned, usually within 2 hours. Ice chips carry the same aspiration risk as water, and a blanket 24-hour restriction is unnecessary and not evidence based.", "why": ["Being fully awake does not mean the gag reflex has returned; topical lidocaine leaves the airway unprotected and swallowing water risks aspiration.", "Ice chips melt into liquid and carry exactly the same aspiration risk as water while the gag reflex remains suppressed.", "Correct. Topical anesthesia to the oropharynx suppresses the gag reflex, so all intake is withheld until its return is confirmed, usually within about two hours.", "A blanket 24-hour restriction is far longer than needed, since the gag reflex typically returns within a couple of hours after bronchoscopy."]}, {"q": "A client with type 2 diabetes taking metformin is scheduled for a CT scan with iodinated contrast tomorrow. The serum creatinine is 1.9 mg/dL. Which action should the nurse take?", "opts": ["Give the metformin with a full glass of water on the morning of the scan", "Hold the metformin and clarify the plan with the provider before the scan", "Administer an extra dose of metformin to prevent hyperglycemia during fasting", "Encourage the client to restrict all fluids for 12 hours before the scan"], "a": 1, "r": "Iodinated contrast can precipitate acute kidney injury, and with impaired renal function metformin accumulates and increases the risk of lactic acidosis, so metformin is withheld around the time of contrast and the plan is verified with the provider. Fluid restriction is the opposite of the hydration needed to protect the kidneys from contrast nephropathy.", "why": ["Giving metformin before contrast in a client with a creatinine of 1.9 allows the drug to accumulate and risks lactic acidosis.", "Correct. Iodinated contrast can precipitate acute kidney injury, and with a creatinine of 1.9 metformin accumulates and risks lactic acidosis, so it is held pending clarification.", "An extra dose compounds the accumulation risk, and metformin alone does not cause hypoglycemia that would need covering during fasting.", "Fluid restriction is the opposite of the hydration that protects the kidneys from contrast nephropathy and would worsen renal injury."]}, {"q": "Four hours after an open reduction and internal fixation of the femur, the nurse notes the client's blood pressure has fallen from 128/78 to 96/58 mm Hg, heart rate is 122/min, respirations 26/min, and the surgical drain has collected 350 mL of bright red drainage in the past hour. Which finding most strongly indicates hemorrhage requiring immediate follow-up?", "opts": ["Respiratory rate of 26 breaths/min", "Complaint of incisional pain rated 6 of 10", "Oral temperature of 37.8 C", "350 mL of bright red drainage in 1 hour with narrowing pulse pressure"], "a": 3, "r": "Brisk bright red drainage combined with tachycardia, hypotension, and a narrowing pulse pressure is the classic pattern of ongoing surgical hemorrhage and compensated shock requiring immediate provider notification. Tachypnea is a compensatory response that is explained by the same problem, and moderate incisional pain and a low-grade temperature are expected postoperative findings.", "why": ["Tachypnea is a compensatory response to the blood loss rather than the finding that identifies the hemorrhage itself.", "Moderate incisional pain is expected four hours after femoral fixation and calls for analgesia, not emergency intervention.", "An oral temperature of 37.8 C reflects the normal inflammatory response of the early postoperative period and is not an emergency.", "Correct. 350 mL of bright red drainage in one hour with hypotension, tachycardia, and a narrowing pulse pressure is active hemorrhage with compensated shock."]}, {"q": "A client who had a lumbar puncture 4 hours ago reports a severe throbbing headache that worsens when sitting upright and improves when lying flat. Which nursing intervention is most appropriate?", "opts": ["Ambulate the client in the hallway to promote CSF circulation", "Restrict oral fluids to reduce cerebrospinal fluid production", "Keep the client flat, encourage fluids, and administer prescribed analgesia", "Position the client in high Fowler with the neck flexed forward"], "a": 2, "r": "A postural post-dural puncture headache results from CSF leakage, and lying flat with increased fluid intake and analgesia supports CSF volume restoration and comfort. Upright positioning and ambulation increase the pressure gradient and worsen the headache, and fluid restriction reduces the CSF replacement the client needs.", "why": ["Ambulation puts the client upright, increasing the pressure gradient at the puncture site and intensifying the headache rather than relieving it.", "Restricting fluids withholds the volume needed to replace leaked cerebrospinal fluid and will worsen rather than relieve this headache.", "Correct. A headache that eases when lying flat is a post-dural puncture headache from CSF leak, treated with flat positioning, fluids, and analgesia.", "High Fowler position reproduces exactly the upright posture that worsens this headache, and neck flexion offers no benefit after a lumbar puncture."]}, {"q": "A client receiving warfarin for atrial fibrillation has an INR of 5.8 and reports bleeding gums when brushing. There is no other active bleeding. Which prescription should the nurse anticipate?", "opts": ["Hold the warfarin and administer oral vitamin K (phytonadione)", "Administer protamine sulfate 50 mg IV over 10 minutes", "Continue the current warfarin dose and recheck the INR in 1 week", "Give an additional dose of warfarin to stabilize the level"], "a": 0, "r": "An INR well above the 2 to 3 target with minor bleeding is managed by holding warfarin and giving vitamin K, the specific antidote that restores clotting factor synthesis. Protamine sulfate reverses heparin, not warfarin, and continuing or increasing the dose would raise the INR further and risk major hemorrhage.", "why": ["Correct. An INR of 5.8 with only minor bleeding is managed by holding warfarin and giving oral vitamin K to restore clotting factor synthesis.", "Protamine sulfate reverses heparin, not warfarin, so it would have no effect on this client's markedly elevated INR.", "Continuing the dose leaves the INR nearly double the upper target for another week and risks progression to major hemorrhage.", "Additional warfarin further suppresses clotting factor synthesis and would push an already dangerous INR of 5.8 even higher."]}], "physiological-adaptation": [{"q": "A client with chronic kidney disease who missed two dialysis sessions has a serum potassium of 7.2 mEq/L. The cardiac monitor shows peaked T waves and a widening QRS complex. Which prescription should the nurse implement first?", "opts": ["Sodium polystyrene sulfonate 30 g orally", "Regular insulin 10 units with 50% dextrose IV", "Furosemide 40 mg IV push", "Calcium gluconate 1 g IV over 3 minutes"], "a": 3, "r": "With ECG changes from severe hyperkalemia, IV calcium gluconate is given first because it immediately stabilizes the myocardial cell membrane and protects against lethal dysrhythmias. Insulin with dextrose shifts potassium intracellularly and sodium polystyrene removes it from the body, but both act too slowly to prevent imminent cardiac arrest.", "why": ["The resin does remove potassium from the body, but it works over hours and cannot protect a heart already showing a widening QRS.", "Insulin with dextrose shifts potassium into cells within about twenty minutes, an appropriate next step but too slow to be given first.", "Diuresis requires functioning kidneys, and this client with chronic kidney disease and missed dialysis has little capacity to excrete the potassium load.", "Correct. IV calcium gluconate immediately stabilizes the myocardial cell membrane against the peaked T waves and widening QRS while slower potassium-lowering therapies take effect."]}, {"q": "A client admitted with diabetic ketoacidosis has a glucose of 620 mg/dL, pH 7.12, bicarbonate 10 mEq/L, and potassium 5.8 mEq/L, and is receiving an IV insulin infusion and normal saline. Two hours later the glucose is 260 mg/dL. Which action should the nurse anticipate?", "opts": ["Stopping the insulin infusion immediately", "Adding dextrose to the IV fluids while continuing the insulin infusion", "Administering a 50 mL ampule of 50% dextrose IV push", "Beginning a potassium-restricted diet"], "a": 1, "r": "When the glucose approaches 250 mg/dL in DKA, dextrose is added to the IV fluids so the insulin infusion can continue to close the anion gap and clear ketones without causing hypoglycemia. Stopping the insulin prematurely allows ketogenesis and acidosis to persist even though the glucose has normalized.", "why": ["Stopping insulin when the glucose falls halts correction of the acidosis, allowing ketogenesis and the anion gap to persist despite a normal sugar.", "Correct. Adding dextrose once glucose nears 250 lets the insulin infusion keep clearing ketones and closing the anion gap without causing hypoglycemia.", "A 50% dextrose ampule treats symptomatic hypoglycemia; at 260 mg/dL it would cause a sharp rebound in glucose and serum osmolality.", "Insulin therapy drives potassium into cells, so this client will soon need potassium replacement rather than a restricted intake."]}, {"q": "A client with Addison disease is admitted with nausea, vomiting, blood pressure 82/48 mm Hg, heart rate 124/min, sodium 126 mEq/L, potassium 5.9 mEq/L, and glucose 54 mg/dL after abruptly stopping hydrocortisone. What is the nurse's priority intervention?", "opts": ["Administer IV hydrocortisone and 0.9% sodium chloride with dextrose as prescribed", "Restrict fluids to correct the hyponatremia", "Place the client on strict bed rest and recheck vital signs in 1 hour", "Administer a potassium-binding resin before other treatments"], "a": 0, "r": "Addisonian crisis is a life-threatening deficiency of cortisol and aldosterone producing hypovolemic shock, hyponatremia, hyperkalemia, and hypoglycemia; IV glucocorticoid replacement with saline and dextrose corrects all of these simultaneously. Fluid restriction would deepen the hypovolemia because the hyponatremia here is dilutional to volume loss, not fluid overload.", "why": ["Correct. IV hydrocortisone with saline and dextrose replaces the missing cortisol while simultaneously correcting the hypovolemia, hyponatremia, hyperkalemia, and hypoglycemia of addisonian crisis.", "The hyponatremia here reflects aldosterone deficiency and volume loss, so restricting fluids would deepen the shock rather than correct the sodium.", "A blood pressure of 82/48 with a heart rate of 124 is shock; waiting an hour without treatment risks cardiovascular collapse.", "The hyperkalemia results from aldosterone deficiency and resolves with steroid and fluid replacement, so a resin treats the effect rather than the cause."]}, {"q": "A client with a head injury has a urine output of 900 mL/hr for 3 hours, urine specific gravity of 1.002, and serum sodium of 158 mEq/L. Which condition should the nurse suspect, and what is the priority action?", "opts": ["SIADH; restrict fluids to 800 mL per day", "Acute kidney injury; prepare for emergent dialysis", "Diabetes insipidus; replace fluids and prepare to administer desmopressin", "Hyperglycemic hyperosmolar state; begin an insulin infusion"], "a": 2, "r": "Massive dilute urine output with dilute specific gravity and hypernatremia after head injury indicates central diabetes insipidus from deficient antidiuretic hormone, treated with fluid replacement and desmopressin. SIADH is the opposite picture, producing concentrated urine and hyponatremia, so fluid restriction would rapidly worsen this client's hypovolemia.", "why": ["SIADH produces concentrated urine and hyponatremia, the opposite of these findings, and fluid restriction would rapidly worsen this client's hypovolemia.", "Acute kidney injury characteristically causes oliguria with a rising creatinine, not 900 mL per hour of maximally dilute urine.", "Correct. Massive dilute urine with a specific gravity of 1.002 and sodium of 158 after head injury indicates central diabetes insipidus needing fluids and desmopressin.", "Hyperglycemic hyperosmolar state involves extreme hyperglycemia with an osmotic diuresis; no elevated glucose is reported and insulin cannot replace absent antidiuretic hormone."]}, {"q": "A client with severe sepsis has these arterial blood gases on room air: pH 7.28, PaCO2 30 mm Hg, HCO3 14 mEq/L, PaO2 88 mm Hg. How should the nurse interpret these results?", "opts": ["Respiratory acidosis with metabolic compensation", "Metabolic acidosis with partial respiratory compensation", "Respiratory alkalosis, uncompensated", "Metabolic alkalosis with respiratory compensation"], "a": 1, "r": "The low pH with a low bicarbonate identifies a metabolic acidosis, and the low PaCO2 shows the lungs are hyperventilating to compensate, though the pH remains abnormal so compensation is only partial. Respiratory acidosis would require an elevated PaCO2, which is not present here.", "why": ["Respiratory acidosis requires an elevated PaCO2, but this client's PaCO2 of 30 mm Hg is low, which rules that interpretation out.", "Correct. The low pH with a bicarbonate of 14 identifies metabolic acidosis, and the PaCO2 of 30 shows respiratory compensation that remains partial since the pH is still acidotic.", "Respiratory alkalosis would raise the pH above 7.45; this pH of 7.28 is acidotic, so the low PaCO2 is compensation rather than the primary disorder.", "Metabolic alkalosis requires an elevated pH and elevated bicarbonate, but both of those values are low here."]}, {"q": "A trauma client has a blood pressure of 84/60 mm Hg, heart rate 132/min, respirations 30/min, cool clammy skin, urine output 15 mL/hr, and a hemoglobin of 6.8 g/dL. Which intervention should the nurse implement first?", "opts": ["Insert an indwelling urinary catheter to track output", "Obtain a 12-lead ECG to evaluate the tachycardia", "Place the client in reverse Trendelenburg position", "Infuse warmed isotonic crystalloid rapidly through large-bore IV access"], "a": 3, "r": "These findings represent hypovolemic shock from hemorrhage, and restoring circulating volume through large-bore access while blood products are obtained directly addresses the C in the ABCs. Catheter placement and an ECG provide data but do not treat the failing perfusion, and reverse Trendelenburg would further reduce venous return.", "why": ["An indwelling catheter improves measurement of output but is a monitoring step that does nothing to restore the failing perfusion.", "The tachycardia is an expected compensatory response to hemorrhage, and obtaining an ECG delays the volume resuscitation this client urgently needs.", "Reverse Trendelenburg lowers the legs and further reduces venous return, worsening preload in a client already in hypovolemic shock.", "Correct. Rapid warmed isotonic crystalloid through large-bore access restores circulating volume while blood is obtained, directly treating the hemorrhagic shock in the ABC framework."]}, {"q": "A client with a T3 spinal cord injury suddenly reports a pounding headache, and the nurse finds a blood pressure of 210/112 mm Hg, heart rate 48/min, flushing above the injury level, and profuse sweating. What should the nurse do first?", "opts": ["Place the client in a sitting position and check for a distended bladder or kinked catheter", "Administer the prescribed nifedipine sublingually", "Lay the client flat and elevate the legs", "Notify the rapid response team and obtain a stat CT of the head"], "a": 0, "r": "Autonomic dysreflexia is treated first by sitting the client upright to lower blood pressure orthostatically and removing the noxious stimulus, most often bladder distention or a kinked catheter. Lying the client flat raises cerebral blood pressure and increases stroke risk, and antihypertensives are given only if the stimulus removal does not resolve the crisis.", "why": ["Correct. Sitting the client upright lowers blood pressure orthostatically while checking the bladder and catheter removes the noxious stimulus driving the dysreflexia.", "Antihypertensives are reserved for pressures that stay dangerously high after the noxious stimulus is removed, so drug therapy is not the first step.", "Lying flat with the legs elevated raises cerebral pressure further in a client already at 210/112, increasing the risk of stroke or seizure.", "A head CT investigates a complication that has not yet occurred and delays the simple positioning and bladder check that usually resolve the crisis."]}, {"q": "A client 24 hours after a craniotomy has a Glasgow Coma Scale that has fallen from 14 to 10, blood pressure 168/62 mm Hg, heart rate 52/min, and irregular respirations. Which nursing action is most appropriate?", "opts": ["Suction the client deeply every hour to clear secretions", "Cluster all nursing care activities to allow longer rest periods", "Elevate the head of the bed 30 degrees with the head midline and notify the provider", "Administer a 1,000 mL normal saline bolus to improve cerebral perfusion"], "a": 2, "r": "Widening pulse pressure, bradycardia, and irregular respirations are the Cushing triad of rising intracranial pressure; head elevation with neutral neck alignment promotes venous drainage while the provider is urgently notified. Deep suctioning and fluid boluses both raise intracranial pressure, and clustering care causes cumulative ICP spikes rather than preventing them.", "why": ["Deep hourly suctioning provokes coughing and sharp spikes in intracranial pressure, which is harmful in a client already showing Cushing triad.", "Clustering activities stacks stimulation together and produces cumulative intracranial pressure elevations; care should instead be spaced with rest between interventions.", "Correct. Bradycardia, widened pulse pressure, and irregular respirations are Cushing triad, so head elevation with midline alignment promotes venous drainage while the provider is notified.", "A 1,000 mL bolus increases cerebral edema and intracranial pressure, and this hypertensive client has no volume deficit to correct."]}, {"q": "A client with chronic alcohol use is admitted with magnesium 1.1 mg/dL, potassium 3.1 mEq/L, and calcium 7.8 mg/dL, and the monitor shows frequent premature ventricular contractions. Which action should the nurse take first?", "opts": ["Encourage a diet high in green leafy vegetables and nuts", "Administer the prescribed oral potassium supplement", "Place the client on seizure precautions and reassess in 4 hours", "Prepare to administer IV magnesium sulfate with continuous cardiac monitoring"], "a": 3, "r": "Hypomagnesemia causes refractory hypokalemia and hypocalcemia and predisposes to ventricular dysrhythmias including torsades de pointes, so IV magnesium replacement with cardiac monitoring is the priority. Giving potassium alone will not correct the deficit because the kidneys continue to waste potassium until magnesium is replaced, and dietary teaching does not address an acute dysrhythmia.", "why": ["Dietary teaching is appropriate for long-term repletion but does nothing about the ventricular ectopy occurring on the monitor right now.", "Potassium will not correct until the magnesium is replaced, because renal potassium wasting continues as long as hypomagnesemia persists.", "Seizure precautions are a reasonable safety measure, but waiting four hours ignores PVCs that can deteriorate into torsades de pointes.", "Correct. IV magnesium with cardiac monitoring treats the deficit driving the PVCs as well as the refractory hypokalemia and hypocalcemia of chronic alcohol use."]}, {"q": "A client weighing 80 kg has deep partial-thickness and full-thickness burns over 40% of the total body surface area. Using the Parkland formula (4 mL x kg x %TBSA), how much lactated Ringer solution should the nurse plan to infuse during the first 8 hours after the burn?", "opts": ["3,200 mL", "6,400 mL", "12,800 mL", "1,600 mL"], "a": 1, "r": "The 24-hour total is 4 mL x 80 kg x 40 = 12,800 mL, and half of that (6,400 mL) is delivered in the first 8 hours calculated from the time of injury, not the time of admission. The 12,800 mL option is the full 24-hour volume and infusing it in 8 hours would cause dangerous fluid overload.", "why": ["This equals only one quarter of the 24-hour requirement and would badly under-resuscitate a client with 40 percent burns during the critical first hours.", "Correct. Parkland gives 4 mL times 80 kg times 40 percent, or 12,800 mL over 24 hours, and half of that, 6,400 mL, infuses in the first eight hours.", "This is the entire 24-hour volume; delivering it within eight hours would cause pulmonary edema and dangerous fluid overload.", "This figure falls far below the calculated requirement and would leave the client in worsening hypovolemic burn shock."]}], "cardiovascular": [{"q": "A client with chronic heart failure calls the clinic reporting a 4 lb weight gain over 2 days, new shortness of breath when lying flat, and swelling of both ankles. Which response by the nurse is most appropriate?", "opts": ["You need to be evaluated today; these are signs your heart failure is worsening.", "Take an extra dose of your furosemide and call back next week.", "Increase your fluid intake to flush the extra sodium out of your body.", "This is a normal variation; weigh yourself again in 3 days."], "a": 0, "r": "A weight gain of more than 2 to 3 lb in 2 days with orthostatic dyspnea and edema signals fluid volume overload and decompensation requiring prompt evaluation. Self-adjusting diuretics without assessment is unsafe, and increasing fluid intake would worsen the congestion.", "why": ["Correct. Four pounds gained in two days with new orthopnea and bilateral ankle edema indicates fluid overload and decompensating heart failure needing same-day evaluation.", "Self-adjusting a diuretic without assessment risks hypokalemia and hypovolemia, and waiting a week allows the decompensation to progress toward pulmonary edema.", "Increasing fluids adds to the volume already overloading this client and would worsen both the orthopnea and the ankle edema.", "Rapid weight gain with orthopnea and edema is never a normal variation, and waiting three days delays treatment of worsening heart failure."]}, {"q": "A client with stable angina reports substernal chest pain rated 8 of 10 that began 10 minutes ago. Blood pressure is 138/84 mm Hg and heart rate 88/min. After the first sublingual nitroglycerin tablet, the pain is 6 of 10 and the blood pressure is 108/66 mm Hg. What should the nurse do next?", "opts": ["Withhold further nitroglycerin because the blood pressure has fallen", "Administer sublingual morphine before repeating nitroglycerin", "Give a second nitroglycerin tablet in 5 minutes and recheck blood pressure", "Have the client ambulate to determine whether the pain is exertional"], "a": 2, "r": "Up to three sublingual nitroglycerin doses are given 5 minutes apart as long as the systolic blood pressure remains above 90 mm Hg, and this client has both residual pain and adequate pressure. Withholding the dose leaves ongoing myocardial ischemia untreated, and ambulation would increase myocardial oxygen demand during an anginal episode.", "why": ["A systolic pressure of 108 remains well above the 90 mm Hg threshold, so withholding the dose leaves ongoing myocardial ischemia untreated.", "Morphine is considered only after the full nitroglycerin sequence fails to relieve pain, and giving it now would mask ischemic symptoms.", "Correct. Up to three sublingual doses are given five minutes apart while systolic pressure stays above 90, and this client still has pain at 6 of 10.", "Exertion during an active anginal episode increases myocardial oxygen demand and can extend the ischemia; the diagnosis is already established."]}, {"q": "A client is admitted with new-onset atrial fibrillation with a ventricular rate of 156/min, blood pressure 88/54 mm Hg, and reports lightheadedness and chest pressure. Which prescription should the nurse question?", "opts": ["Prepare the client for synchronized cardioversion", "Apply oxygen at 2 L/min by nasal cannula", "Obtain a stat 12-lead ECG and serum electrolytes", "Administer metoprolol 5 mg IV push now"], "a": 3, "r": "The client is hemodynamically unstable, and IV beta blockade would further lower an already low blood pressure; unstable atrial fibrillation with a rapid ventricular response is treated with synchronized cardioversion. Oxygen and diagnostic studies are appropriate supportive measures that do not compromise perfusion.", "why": ["Synchronized cardioversion is the indicated treatment for unstable atrial fibrillation with a rapid ventricular response, so this order should be carried out.", "Supplemental oxygen supports myocardial oxygenation during chest pressure and does not compromise perfusion, so this order needs no clarification.", "A stat 12-lead ECG with electrolytes guides therapy and identifies reversible causes without delaying care, so it is an appropriate order.", "Correct. IV metoprolol would further lower a blood pressure already at 88/54 in a hemodynamically unstable client, so this prescription must be questioned."]}, {"q": "A client taking digoxin for heart failure reports nausea, anorexia, and seeing yellow-green halos around lights. The apical pulse is 52/min. Which action should the nurse take first?", "opts": ["Administer the scheduled digoxin dose and monitor the pulse", "Hold the digoxin and obtain a serum digoxin level and potassium", "Encourage the client to eat crackers before the dose to reduce nausea", "Give an antiemetic and reassess in 30 minutes"], "a": 1, "r": "Visual halos, gastrointestinal upset, and bradycardia below 60/min are classic digoxin toxicity, so the drug is held and a level with electrolytes is obtained since hypokalemia potentiates toxicity. Administering the dose would deepen the toxicity, and treating only the nausea masks a dangerous drug effect.", "why": ["Administering another dose to a client with halos, anorexia, and an apical rate of 52 would deepen the toxicity and risk severe bradydysrhythmias.", "Correct. Yellow-green halos, anorexia, nausea, and an apical pulse of 52 are classic digoxin toxicity, so the drug is held while level and potassium are checked.", "Eating crackers treats the nausea as simple stomach upset and ignores that it is a warning sign of digoxin toxicity.", "An antiemetic relieves one symptom while masking evidence of toxicity, and the bradycardia and visual disturbances would remain untreated."]}, {"q": "A nurse is teaching a client newly prescribed lisinopril for hypertension. Which client statement indicates a need for further teaching?", "opts": ["I will rise slowly from bed to avoid getting dizzy.", "I will call my provider if I develop swelling of my lips or tongue.", "I will use a salt substitute on my food instead of table salt.", "A dry, persistent cough is something I should report to my provider."], "a": 2, "r": "Most salt substitutes are potassium chloride, and ACE inhibitors reduce potassium excretion, so their combined use risks hyperkalemia and dysrhythmias. The other statements correctly reflect orthostatic precautions, recognition of angioedema, and reporting the ACE inhibitor cough.", "why": ["Rising slowly is accurate teaching for the orthostatic hypotension that ACE inhibitors commonly cause, especially with early doses.", "Recognizing lip or tongue swelling as angioedema and calling the provider is exactly the right response to this rare, life-threatening reaction.", "Correct. This statement needs correction because salt substitutes are potassium chloride and lisinopril reduces potassium excretion, creating a risk of hyperkalemia and dysrhythmias.", "A persistent dry cough from bradykinin accumulation is a well-known ACE inhibitor effect that should be reported, so this statement is accurate."]}, {"q": "A postoperative client reports new unilateral calf pain, and the nurse notes the right calf is 4 cm larger than the left, warm, and reddened. Which action should the nurse take first?", "opts": ["Notify the provider and maintain the client on bed rest with the leg supported", "Vigorously massage the calf to relieve the muscle cramp", "Apply sequential compression devices to both legs immediately", "Have the client ambulate to determine whether the pain resolves"], "a": 0, "r": "Unilateral calf swelling, warmth, and pain suggest deep vein thrombosis, and the client is kept at rest while the provider is notified and diagnostic ultrasound is arranged, to reduce the chance of clot dislodgement. Massage and ambulation before diagnosis can dislodge a thrombus and cause pulmonary embolism.", "why": ["Correct. Unilateral calf swelling, warmth, and pain suggest deep vein thrombosis, so rest with the leg supported limits clot movement while ultrasound is arranged.", "Massaging a suspected thrombus can dislodge it and cause a pulmonary embolism, so it is contraindicated with these findings.", "Sequential compression over an existing clot can propel it centrally, and these devices are intended for prevention rather than treatment.", "Ambulating to see whether the pain resolves both delays diagnosis and risks dislodging a clot into the pulmonary circulation."]}, {"q": "A nurse is teaching a client with peripheral arterial disease about self-care. Which instruction should the nurse include?", "opts": ["Elevate your legs above heart level whenever you are sitting.", "Apply a heating pad to your feet at night to improve circulation.", "Wear knee-high compression stockings during the day.", "Inspect your feet daily and wear well-fitting shoes at all times."], "a": 3, "r": "Arterial insufficiency reduces perfusion and healing capacity, so daily foot inspection and protective footwear prevent unnoticed injury and ulceration. Elevating the legs and applying compression further reduce arterial inflow (appropriate for venous disease instead), and heating pads risk burns in a limb with impaired sensation and perfusion.", "why": ["Elevating the legs reduces arterial inflow to already ischemic tissue; elevation is appropriate for venous disease, not arterial insufficiency.", "Heating pads risk serious burns in a limb with impaired sensation and poor perfusion that cannot dissipate the heat.", "Compression stockings are a venous insufficiency measure and would further restrict arterial blood flow in peripheral arterial disease.", "Correct. Reduced arterial perfusion impairs healing, so daily foot inspection and well-fitting shoes keep small unnoticed injuries from progressing to ulcers."]}, {"q": "A client with hypertension has been taking metoprolol for 3 months and tells the nurse about plans to stop it because the blood pressure is now normal. What is the nurse's best response?", "opts": ["That is reasonable; you can stop once two readings are under 120/80.", "Stopping this medication suddenly can cause rebound hypertension and chest pain, so it must be tapered by your provider.", "You can stop the metoprolol as long as you continue to exercise regularly.", "Cut the tablets in half yourself and stop after 2 days."], "a": 1, "r": "Abrupt beta blocker withdrawal causes rebound tachycardia, hypertension, and can precipitate angina or myocardial infarction from receptor upregulation, so any discontinuation is tapered under provider supervision. Normal readings reflect drug effectiveness rather than resolution of hypertension, so stopping on that basis is unsafe.", "why": ["Normal readings show the medication is working rather than that hypertension has resolved, so stopping on that basis invites rebound effects.", "Correct. Abrupt beta blocker withdrawal causes rebound tachycardia and hypertension from receptor upregulation and can precipitate angina or infarction, so tapering is provider directed.", "Regular exercise supports blood pressure control but offers no protection against the rebound sympathetic surge of abruptly stopping metoprolol.", "A self-designed two-day taper is far too rapid and is not a dosing decision the client should make without the provider."]}, {"q": "A client on long-term warfarin therapy is being taught about diet. Which client statement indicates correct understanding?", "opts": ["I will keep my intake of green leafy vegetables about the same from week to week.", "I should completely eliminate all spinach, kale, and broccoli from my diet.", "I can take over-the-counter ibuprofen for my arthritis whenever I need it.", "I will double my dose on any day I eat a large salad."], "a": 0, "r": "Warfarin dosing is titrated to a client's usual vitamin K intake, so consistency rather than elimination keeps the INR stable. Eliminating all vitamin K foods causes wide INR swings if the client resumes them, ibuprofen adds bleeding risk, and clients never self-adjust warfarin doses.", "why": ["Correct. Warfarin is titrated to the client's usual vitamin K intake, so keeping green leafy vegetable consumption consistent week to week keeps the INR stable.", "Complete elimination is unnecessary and produces wide INR swings whenever the client later resumes eating those vegetables.", "Ibuprofen inhibits platelet function and irritates gastric mucosa, compounding warfarin's bleeding risk, so it should not be used freely.", "Clients never self-adjust warfarin doses, and doubling it after a salad would push the INR into a dangerous range."]}, {"q": "Twelve hours after coronary artery bypass surgery, a client has muffled heart sounds, blood pressure 84/70 mm Hg, jugular venous distention, and a sudden decrease in chest tube drainage from 100 mL/hr to 5 mL/hr. Which complication should the nurse suspect?", "opts": ["Pulmonary embolism", "Hypovolemic shock from graft site bleeding", "Cardiac tamponade", "Acute graft occlusion with myocardial infarction"], "a": 2, "r": "Muffled heart sounds, hypotension with a narrowed pulse pressure, and jugular venous distention form Beck triad, and the abrupt drop in chest tube output suggests the tube has clotted while blood accumulates in the pericardium. Hypovolemic shock would present with flat neck veins rather than distention, which is the key distinguishing finding.", "why": ["Pulmonary embolism causes sudden dyspnea and hypoxemia rather than muffled heart sounds with an abrupt fall in chest tube drainage.", "Bleeding-related hypovolemia produces flat neck veins, whereas this client has jugular venous distention, which is the key distinguishing finding.", "Correct. Muffled heart sounds, hypotension with a narrow pulse pressure, and jugular distention form Beck triad, and the sudden drainage drop suggests a clotted chest tube.", "Acute graft occlusion produces ischemic ECG changes and chest pain rather than muffled sounds with distended neck veins and stopped drainage."]}], "respiratory": [{"q": "A client with severe COPD and chronic carbon dioxide retention is receiving oxygen at 2 L/min by nasal cannula with an oxygen saturation of 90%. The client reports increased dyspnea, and a family member has turned the oxygen up to 6 L/min. The client is now drowsy and difficult to arouse. What should the nurse do first?", "opts": ["Remove the oxygen entirely and encourage pursed-lip breathing", "Return the oxygen to the prescribed rate and assess respiratory rate and level of consciousness", "Place the client in Trendelenburg position and administer a bronchodilator", "Obtain a sputum specimen for culture and sensitivity"], "a": 1, "r": "Excessive oxygen in a chronic retainer can blunt respiratory drive and worsen hypercapnia with resulting somnolence, so returning to the prescribed flow while reassessing breathing and neurologic status addresses the cause directly. Removing oxygen completely would cause dangerous hypoxemia, which is more immediately lethal than hypercapnia.", "why": ["Removing oxygen entirely from a client with severe COPD causes profound hypoxemia, which is more immediately lethal than the hypercapnia excess oxygen produced.", "Correct. Returning to the prescribed 2 L/min addresses the excess oxygen blunting respiratory drive, and reassessing rate and consciousness gauges the response.", "Trendelenburg pushes abdominal contents against the diaphragm and worsens ventilation in a drowsy client who is already retaining carbon dioxide.", "A sputum culture investigates infection, which is not the cause of this sudden change, and collecting it delays correcting the oxygen-induced hypoventilation."]}, {"q": "A client having an acute asthma exacerbation initially had loud expiratory wheezing throughout all lung fields. After 20 minutes of nebulized albuterol, the nurse notes markedly diminished breath sounds, a respiratory rate of 34/min, and use of accessory muscles. How should the nurse interpret this change?", "opts": ["The albuterol has effectively relieved the bronchospasm", "The client is developing a spontaneous pneumothorax on the left", "The client should be encouraged to rest before the next treatment", "Airflow is severely obstructed and the client requires immediate intervention"], "a": 3, "r": "A silent or markedly diminished chest with continued tachypnea and accessory muscle use means too little air is moving to generate wheezes, an ominous sign of impending respiratory failure requiring rapid escalation. Interpreting the loss of wheezing as improvement is a classic and dangerous error because the work of breathing has increased, not decreased.", "why": ["Genuine relief would bring easier breathing with a falling respiratory rate, not the tachypnea and accessory muscle use this client now shows.", "Pneumothorax produces unilaterally absent sounds with possible tracheal deviation, whereas this client's breath sounds are diminished throughout all fields.", "Pausing for rest in a client using accessory muscles at 34 breaths per minute allows progression toward respiratory arrest rather than recovery.", "Correct. Loss of wheezing with continued tachypnea and accessory muscle use means too little air is moving to generate sound, signaling impending respiratory failure."]}, {"q": "A nurse discovers that a client's chest tube has become disconnected from the drainage system tubing at the bedside. What should the nurse do first?", "opts": ["Submerge the end of the chest tube in a container of sterile water", "Clamp the chest tube near the insertion site and call the provider", "Reconnect the tubing without cleaning it and tape the connection", "Remove the chest tube and apply an occlusive dressing"], "a": 0, "r": "Placing the tube end in sterile water immediately reestablishes a water seal, preventing atmospheric air from entering the pleural space while a new sterile system is obtained. Prolonged clamping traps air and can cause a tension pneumothorax, and the nurse never removes a chest tube.", "why": ["Correct. Submerging the tube end in sterile water immediately reestablishes a water seal, blocking atmospheric air from entering the pleural space until a new system arrives.", "Clamping a chest tube traps air within the pleural space and can convert the problem into a tension pneumothorax.", "Reconnecting contaminated tubing introduces organisms directly into the pleural space and creates a serious risk of empyema.", "Removing a chest tube is outside nursing scope and would collapse the very lung the tube is treating."]}, {"q": "Three days after hip replacement surgery, a client suddenly reports sharp pleuritic chest pain and dyspnea. Vital signs are respirations 32/min, heart rate 124/min, blood pressure 100/62 mm Hg, and oxygen saturation 87% on room air. What should the nurse do first?", "opts": ["Obtain a stat D-dimer and troponin", "Encourage slow deep breathing into a paper bag", "Apply high-flow oxygen and elevate the head of the bed", "Ambulate the client to improve lung expansion"], "a": 2, "r": "This presentation strongly suggests pulmonary embolism, and correcting hypoxemia with oxygen and an upright position addresses airway and breathing before diagnostics are pursued. Rebreathing into a bag would worsen hypoxemia, and ambulating a hemodynamically compromised client can dislodge additional thrombus.", "why": ["A D-dimer and troponin support the diagnosis but do nothing for a saturation of 87 percent; oxygenation precedes diagnostic testing.", "Rebreathing into a paper bag is used for anxiety-related hyperventilation and would deepen the hypoxemia in a client already at 87 percent.", "Correct. High-flow oxygen with the head elevated treats the hypoxemia of a likely pulmonary embolism, addressing breathing before diagnostics are pursued.", "Ambulating a hypoxemic, tachycardic client with a suspected embolism can dislodge more thrombus and worsen the hemodynamic compromise."]}, {"q": "A nurse is suctioning a client with a new tracheostomy. Which action indicates correct technique?", "opts": ["Instilling 5 mL of normal saline into the tracheostomy before each pass", "Applying suction only while withdrawing the catheter, for no more than 10 to 15 seconds", "Suctioning continuously for 30 seconds to clear thick secretions", "Setting wall suction at 200 mm Hg for adult clients"], "a": 1, "r": "Suction is applied only on withdrawal and limited to 10 to 15 seconds per pass to minimize hypoxemia and mucosal trauma. Routine saline instillation is not evidence based and increases infection risk, and prolonged suctioning at excessive pressure causes hypoxemia, bradycardia, and airway injury.", "why": ["Routine saline instillation is not evidence based; it triggers coughing and desaturation and can wash organisms deeper into the lower airway.", "Correct. Applying suction only during withdrawal for 10 to 15 seconds limits the hypoxemia and tracheal mucosal trauma that suctioning causes.", "Thirty seconds of continuous suction removes oxygen along with secretions and can cause hypoxemia, bradycardia, and dysrhythmias.", "Adult wall suction should be set near 80 to 120 mm Hg; 200 mm Hg causes mucosal trauma and bleeding in a new tracheostomy."]}, {"q": "A client is admitted with a productive cough, night sweats, hemoptysis, and a 15 lb weight loss over 2 months, and pulmonary tuberculosis is suspected. Which action should the nurse take first?", "opts": ["Begin four-drug antitubercular therapy immediately", "Obtain three consecutive early-morning sputum specimens", "Place the client in a negative-pressure room and use an N95 respirator", "Administer a tuberculin skin test and read it in 48 hours"], "a": 2, "r": "Tuberculosis spreads by the airborne route, so implementing airborne precautions in a negative-pressure room with N95 protection prevents transmission to staff and other clients while the workup proceeds. Sputum collection and skin testing are necessary but come after isolation, and treatment is not started before specimens are obtained.", "why": ["Antitubercular therapy is delayed until sputum specimens are collected so the organism can be identified and drug susceptibility determined.", "Three early-morning specimens are essential to diagnosis, but collecting them before isolation exposes staff and other clients to airborne bacilli.", "Correct. Tuberculosis spreads by the airborne route, so a negative-pressure room with N95 protection shields staff and other clients while the workup proceeds.", "A tuberculin skin test cannot distinguish active disease from latent infection and takes 48 hours, offering nothing for an actively coughing client."]}, {"q": "A client with acute respiratory distress syndrome is intubated on mechanical ventilation with 100% FiO2 and PEEP of 15 cm H2O. The nurse notes a sudden drop in blood pressure from 112/68 to 78/44 mm Hg with rising peak airway pressures and absent breath sounds on the right. Which complication is most likely?", "opts": ["Ventilator-associated pneumonia", "Right mainstem intubation with left lung collapse", "Tension pneumothorax", "Acute pulmonary edema"], "a": 2, "r": "High PEEP predisposes to barotrauma, and the triad of hypotension, rising peak airway pressures, and unilaterally absent breath sounds indicates a tension pneumothorax requiring immediate needle decompression. Ventilator-associated pneumonia develops over days with fever and infiltrates rather than sudden hemodynamic collapse.", "why": ["Ventilator-associated pneumonia develops over days with fever and infiltrates, not sudden hypotension with unilaterally absent breath sounds.", "Right mainstem intubation would silence the left lung, but this client's absent breath sounds are on the right side.", "Correct. High PEEP predisposes to barotrauma, and hypotension with rising peak airway pressures and absent right breath sounds indicates tension pneumothorax needing needle decompression.", "Acute pulmonary edema produces diffuse crackles and pink frothy secretions rather than unilaterally absent breath sounds with a sudden pressure drop."]}, {"q": "An 82-year-old client is brought to the emergency department by family who report new confusion and a fall. Temperature is 37.1 C, respirations 28/min, oxygen saturation 89% on room air, and crackles are auscultated in the right lower lobe. Which conclusion should guide the nurse's next action?", "opts": ["The findings suggest pneumonia, since older adults often present with confusion instead of fever", "The confusion is most likely age-related dementia requiring a safety sitter only", "The normal temperature effectively rules out a respiratory infection", "The crackles are an expected finding in an adult of this age"], "a": 0, "r": "Older adults frequently present with altered mental status and tachypnea rather than fever, and the focal crackles with hypoxemia point to pneumonia requiring oxygen, cultures, and antibiotics. Attributing the change to dementia or dismissing the absent fever would delay treatment of a life-threatening infection.", "why": ["Correct. Older adults often present with confusion and tachypnea instead of fever, and focal right lower lobe crackles with a saturation of 89 percent point to pneumonia.", "Attributing new acute confusion to dementia ignores the hypoxemia and focal crackles and would delay antibiotics for a treatable infection.", "A blunted febrile response is common in older adults, so a temperature of 37.1 C does not exclude pneumonia in this client.", "Focal crackles confined to one lobe are never a normal aging change and here indicate consolidation requiring prompt treatment."]}, {"q": "A client with an acute COPD exacerbation has these arterial blood gases: pH 7.30, PaCO2 58 mm Hg, HCO3 28 mEq/L, PaO2 62 mm Hg. Which nursing action is most appropriate?", "opts": ["Prepare for immediate intubation regardless of clinical status", "Withhold all oxygen therapy until the PaCO2 normalizes", "Encourage rapid deep breaths to blow off carbon dioxide quickly", "Position upright, coach pursed-lip breathing, and prepare for noninvasive positive pressure ventilation"], "a": 3, "r": "These gases show acute-on-chronic respiratory acidosis with hypoxemia, and upright positioning with pursed-lip breathing plus BiPAP improves alveolar ventilation and often avoids intubation. Withholding oxygen leaves dangerous hypoxemia untreated, and rapid deep breathing causes air trapping in obstructive disease rather than CO2 clearance.", "why": ["Intubation is reserved for failure of noninvasive support or deteriorating consciousness, so committing to it regardless of clinical status is unnecessarily invasive.", "Withholding oxygen at a PaO2 of 62 leaves the client hypoxemic, which is more immediately dangerous than the elevated carbon dioxide.", "Rapid deep breathing shortens expiratory time and causes air trapping in obstructive disease, raising rather than lowering the carbon dioxide.", "Correct. Upright positioning with pursed-lip breathing and BiPAP improves alveolar ventilation in this acute-on-chronic respiratory acidosis and often prevents the need for intubation."]}, {"q": "A nurse is teaching a client how to use an incentive spirometer after abdominal surgery. Which client statement indicates correct understanding?", "opts": ["I should blow into the mouthpiece as hard and fast as I can.", "I will inhale slowly and deeply, hold it for about 3 to 5 seconds, then exhale and cough.", "I only need to use this device if I start feeling short of breath.", "I should use it once each morning and once before bed."], "a": 1, "r": "A slow sustained maximal inspiration with a brief inspiratory hold reopens alveoli and prevents atelectasis, and the follow-up cough clears secretions. Forceful exhalation into the device does not expand alveoli, and using it only when symptomatic or twice daily is far less than the recommended 10 breaths every hour while awake.", "why": ["Forceful exhalation into the device is peak flow technique and does not inflate alveoli or prevent postoperative atelectasis after abdominal surgery.", "Correct. A slow deep inspiration held three to five seconds reopens collapsed alveoli, and the follow-up cough clears the secretions that were loosened.", "Waiting until dyspnea appears means atelectasis has already developed; the spirometer is used preventively before any symptoms occur.", "Twice daily use falls far below the recommended ten breaths every hour while awake and will not prevent postoperative atelectasis."]}], "endocrine": [{"q": "A 19-year-old client with type 1 diabetes arrives in the emergency department with a blood glucose of 486 mg/dL, arterial pH 7.18, bicarbonate 12 mEq/L, potassium 5.6 mEq/L, and Kussmaul respirations. Which action should the nurse take first?", "opts": ["Administer subcutaneous insulin glargine as ordered", "Give 1 ampule of sodium bicarbonate IV push", "Begin an IV infusion of 0.9% sodium chloride at 15 mL/kg/hr", "Start an IV potassium chloride infusion at 20 mEq/hr"], "a": 2, "r": "Diabetic ketoacidosis causes profound osmotic diuresis, so isotonic fluid resuscitation is the first priority to restore circulating volume and tissue perfusion, consistent with the ABC/circulation framework. Long-acting subcutaneous insulin is inappropriate in DKA because absorption is unreliable in a volume-depleted client; regular insulin by continuous IV infusion is started after fluids are underway.", "why": ["Long-acting glargine absorbs unpredictably in a volume-depleted client and does not correct the deficit; DKA requires a regular insulin infusion after fluids.", "Bicarbonate is reserved for extreme acidemia near a pH of 6.9 and risks hypokalemia and paradoxical CNS acidosis without restoring perfusion.", "Correct. Osmotic diuresis has depleted intravascular volume, so isotonic saline restores perfusion first and begins lowering glucose before the insulin infusion starts.", "Potassium is already 5.6 mEq/L, so infusing it now could trigger lethal dysrhythmias; replacement waits until levels fall during insulin therapy."]}, {"q": "A client with type 2 diabetes receives NPH insulin at 0700 each morning and reports feeling shaky at work. At which time should the nurse teach the client that a hypoglycemic reaction is most likely to occur?", "opts": ["Between 1100 and 1900, when NPH reaches its peak action", "Between 0715 and 0745, when NPH begins to peak", "Between 2200 and 2400, well after the evening meal", "Immediately after the injection, within 10 to 15 minutes"], "a": 0, "r": "NPH is an intermediate-acting insulin with an onset of about 1 to 2 hours and a peak of roughly 4 to 12 hours, placing peak risk in the late morning through early evening after a 0700 dose. The 10-to-15-minute window describes rapid-acting analogs such as lispro, not NPH, so that option reflects the wrong pharmacokinetic profile.", "why": ["Correct. NPH peaks roughly 4 to 12 hours after a 0700 dose, placing greatest hypoglycemia risk from late morning into early evening.", "NPH has not even reached onset by 15 to 45 minutes; its onset is about 1 to 2 hours, so peaking then is impossible.", "Late evening risk is lower after a morning NPH dose because the peak has already passed and the evening meal has been eaten.", "An effect within 10 to 15 minutes describes rapid-acting analogs such as lispro or aspart, not intermediate-acting NPH, so this timing is wrong."]}, {"q": "A client who is alert and oriented reports dizziness and diaphoresis; a fingerstick glucose is 52 mg/dL. Which action should the nurse take first?", "opts": ["Administer 1 mg of glucagon intramuscularly", "Recheck the blood glucose in 30 minutes", "Give the client a peanut butter sandwich and whole milk", "Provide 15 g of a fast-acting carbohydrate such as 4 oz of juice"], "a": 3, "r": "For a conscious client with hypoglycemia, the rule of 15 applies: give 15 g of fast-acting carbohydrate, recheck in 15 minutes, and repeat as needed before adding a protein-containing snack. Glucagon is reserved for clients who are unconscious or unable to swallow safely, so giving it here is unnecessary and delays a simpler, safer intervention.", "why": ["Glucagon is reserved for clients who are unconscious or cannot swallow safely; this client is alert, so an injection is unnecessary and delays simpler treatment.", "Waiting 30 minutes leaves a symptomatic client hypoglycemic; the recheck happens 15 minutes after carbohydrate is given, not instead of giving it.", "Protein and fat slow glucose absorption, so this snack belongs after the glucose is corrected and only if the next meal is delayed.", "Correct. The rule of 15 applies to a conscious hypoglycemic client: give 15 grams of fast-acting carbohydrate, then recheck the glucose in 15 minutes."]}, {"q": "The nurse is caring for a client on the first postoperative day after a subtotal thyroidectomy. Which assessment finding requires immediate follow-up?", "opts": ["Hoarseness and a weak voice when speaking", "Temperature 103.4 F, heart rate 148, and increasing agitation", "Complaints of a sore throat when swallowing liquids", "A small amount of serosanguineous drainage on the neck dressing"], "a": 1, "r": "Hyperthermia, extreme tachycardia, and agitation suggest thyroid storm, a life-threatening surge of thyroid hormone requiring immediate provider notification, cooling, beta-blockade, and antithyroid therapy. Hoarseness is common after thyroidectomy from airway manipulation or transient laryngeal nerve irritation and is monitored rather than treated emergently.", "why": ["Hoarseness and a weak voice are expected after airway manipulation and are usually transient; they are monitored rather than treated as an emergency.", "Correct. Hyperthermia, a heart rate of 148, and agitation si
