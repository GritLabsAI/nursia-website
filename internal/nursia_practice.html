<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nursia — Practice by Topic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a2e;
    -webkit-font-smoothing: antialiased;
    background-color: #fdfcff;
    background-image: radial-gradient(rgba(123,47,247,0.11) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
    background-position: -6px -6px;
    min-height: 100vh;
  }
  svg { display: block; }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ul { list-style: none; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 32px; }

  /* ---------- NAV ---------- */
  .nav-bar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #ececf2;
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
  }
  .nav-logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-logo .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: linear-gradient(135deg, #7b2ff7, #29b6f6);
  }
  .nav-links { display: flex; align-items: center; gap: 30px; font-size: 14.5px; font-weight: 600; color: #6b6b7c; }
  .nav-links a.on { color: #1a1a2e; font-weight: 700; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-login {
    font-size: 14.5px; font-weight: 700; color: #1a1a2e;
    padding: 8px 6px;
  }
  .nav-login:hover { color: #7b2ff7; }
  .nav-cta {
    background: #1a1a2e; color: #fff;
    padding: 11px 22px; border-radius: 9px;
    font-size: 14px; font-weight: 700;
    transition: transform .15s, box-shadow .15s;
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(20,20,40,0.20); }

  /* ---------- PAGE HEAD ---------- */
  .page-head { padding: 44px 0 26px; }
  .page-head h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
  .page-head h1 .accent {
    background: linear-gradient(90deg, #7b2ff7, #29b6f6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .page-head p { font-size: 15px; color: #6b6b7c; }

  /* ---------- TOPIC SECTIONS ---------- */
  .topic-section { margin-bottom: 34px; }
  .topic-section-head {
    display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px;
  }
  .topic-section-head h2 {
    font-size: 12px; font-weight: 800; letter-spacing: 0.06em;
    text-transform: uppercase; color: #8b8b9c;
  }
  .topic-section-head span { font-size: 12px; font-weight: 600; color: #b4b4c4; }

  .topic-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

  .topic-tile {
    position: relative;
    text-align: left;
    background: #fff;
    border: 1.5px solid #ececf2;
    border-radius: 14px;
    padding: 16px 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    overflow: hidden;
  }
  .topic-tile::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--c); opacity: 0.9;
  }
  .topic-tile:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(20,20,40,0.10); border-color: var(--c); }
  .topic-tile.active { border-color: var(--c); box-shadow: 0 0 0 3px var(--c-soft); }
  .tile-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--c-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .tile-icon svg { width: 19px; height: 19px; stroke: var(--c); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tile-name { font-size: 14px; font-weight: 800; line-height: 1.3; color: #1a1a2e; }
  .tile-meta { font-size: 11.5px; font-weight: 700; color: var(--c); letter-spacing: 0.02em; }

  /* ---------- PRACTICE PANEL (expands in place) ---------- */
  /* while practicing, reserve room below so the card can always scroll flush to the top */
  body.practicing { padding-bottom: 60vh; }
  #practiceSlot { display: none; }
  #practiceSlot.open { display: block; margin: 4px 0 38px; animation: slideDown .32s ease; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .practice-card {
    background: #fff;
    border: 1.5px solid #ececf2;
    border-radius: 18px;
    box-shadow: 0 18px 44px rgba(20,20,40,0.10);
    overflow: hidden;
  }
  .practice-top {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 22px;
    background: var(--c-soft);
    border-bottom: 1.5px solid var(--c-line);
  }
  .practice-badge {
    width: 34px; height: 34px; border-radius: 9px; background: var(--c);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .practice-badge svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .practice-titles { flex: 1; min-width: 0; }
  .practice-title { font-size: 15.5px; font-weight: 800; color: #1a1a2e; line-height: 1.25; }
  .practice-sub { font-size: 12px; font-weight: 700; color: var(--c); margin-top: 2px; }
  .practice-close {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.75); color: #6b6b7c;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .practice-close svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .practice-close:hover { background: #fff; color: #1a1a2e; }

  .practice-progress { height: 4px; background: var(--c-line); }
  .practice-progress span { display: block; height: 100%; background: var(--c); width: 0%; transition: width .3s ease; }

  .practice-body { padding: 26px 30px 28px; }

  .q-stem { font-size: 16.5px; font-weight: 700; line-height: 1.5; color: #1a1a2e; margin-bottom: 20px; }

  .q-opts { display: flex; flex-direction: column; gap: 10px; }
  .q-opt {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
    border: 1.5px solid #ececf2; border-radius: 11px;
    padding: 13px 15px;
    transition: border-color .14s, background .14s;
  }
  .q-opt:hover:not(.locked) { border-color: var(--c); background: var(--c-soft); }
  .q-opt.picked { border-color: var(--c); background: var(--c-soft); }
  .q-letter {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid #c9c9d6; color: #8b8b9c;
    font-size: 11px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    transition: all .14s;
  }
  .q-opt.picked .q-letter { border-color: var(--c); background: var(--c); color: #fff; }
  .q-text { font-size: 14.5px; font-weight: 600; line-height: 1.45; color: #2a2a3a; padding-top: 1px; }

  .q-opt.correct { border-color: #34c759; background: #e9f9ec; }
  .q-opt.correct .q-letter { border-color: #34c759; background: #34c759; color: #fff; }
  .q-opt.wrong { border-color: #ff3b30; background: #fdecea; }
  .q-opt.wrong .q-letter { border-color: #ff3b30; background: #ff3b30; color: #fff; }
  .q-opt.locked { cursor: default; }

  .q-feedback {
    margin-top: 24px;
    padding-top: 22px;
    border-top: 1px solid #ececf2;
  }
  .q-verdict {
    display: flex; align-items: center; gap: 9px;
    font-size: 14px; font-weight: 800;
    margin: 0 0 14px;
  }
  .q-verdict.ok { color: #1e8a3b; }
  .q-verdict.no { color: #c23b2e; }
  .q-verdict svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

  .q-rationale {
    background: #f7f7fb; border-left: 3px solid var(--c);
    border-radius: 8px; padding: 14px 16px;
    font-size: 14px; line-height: 1.6; color: #44445a;
    margin-top: 16px;
  }
  .q-rationale b { color: #1a1a2e; display: block; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }

  /* per-option breakdown */
  .why-block { margin-top: 0; }
  .why-label {
    font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
    color: #8b8b9c; margin-bottom: 10px;
  }
  .why-list { display: flex; flex-direction: column; gap: 8px; }
  .why-row {
    display: flex; align-items: flex-start; gap: 11px;
    border: 1px solid #ececf2; border-radius: 10px;
    padding: 11px 13px; background: #fff;
  }
  .why-row.is-correct { border-color: #bfe9c8; background: #f4fcf6; }
  .why-row.is-wrong { border-color: #f2d9d6; background: #fefaf9; }
  .why-mark {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; color: #fff;
  }
  .why-mark.ok { background: #34c759; }
  .why-mark.no { background: #d4544a; }
  .why-mark svg { width: 10px; height: 10px; stroke: #fff; fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .why-body { flex: 1; min-width: 0; }
  .why-opt {
    font-size: 13px; font-weight: 800; color: #1a1a2e; line-height: 1.4; margin-bottom: 3px;
  }
  .why-opt .why-letter { color: #8b8b9c; margin-right: 2px; }
  .why-row.is-correct .why-tag { color: #1e8a3b; }
  .why-row.is-wrong .why-tag { color: #b8433a; }
  .why-tag { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; margin-left: 6px; }
  .why-text { font-size: 13px; line-height: 1.55; color: #55556a; }
  .why-row.you-picked { box-shadow: 0 0 0 2px rgba(212,84,74,0.18); }
  .why-you {
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
    color: #b8433a; background: #fdecea; padding: 2px 7px; border-radius: 100px; margin-left: 6px;
    white-space: nowrap;
  }

  .practice-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    margin-top: 24px; padding-top: 18px; border-top: 1px solid #ececf2;
  }
  .practice-count { font-size: 13px; font-weight: 700; color: #8b8b9c; }
  .btn-main {
    background: linear-gradient(90deg, #7b2ff7, #29b6f6);
    color: #fff; font-size: 14.5px; font-weight: 800;
    padding: 12px 26px; border-radius: 10px;
    box-shadow: 0 10px 20px rgba(123,47,247,0.22);
    transition: opacity .15s, transform .15s;
  }
  .btn-main:disabled { opacity: 0.4; box-shadow: none; cursor: not-allowed; }
  .btn-main:not(:disabled):hover { transform: translateY(-1px); }
  .btn-ghost {
    border: 1.5px solid #ececf2; color: #1a1a2e;
    font-size: 14px; font-weight: 700; padding: 11px 22px; border-radius: 10px;
  }
  .btn-ghost:hover { border-color: #c9c9d6; background: #fafafd; }

  /* ---------- RESULTS ---------- */
  .res-head { display: flex; align-items: center; gap: 26px; margin-bottom: 26px; flex-wrap: wrap; }
  .res-ring {
    width: 116px; height: 116px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .res-ring-in {
    width: 78%; height: 78%; border-radius: 50%; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .res-score { font-size: 26px; font-weight: 800; color: #1a1a2e; line-height: 1; }
  .res-outof { font-size: 11px; font-weight: 700; color: #8b8b9c; margin-top: 3px; }
  .res-copy { flex: 1; min-width: 240px; }
  .res-copy h3 { font-size: 21px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.01em; }
  .res-copy p { font-size: 14.5px; color: #6b6b7c; line-height: 1.55; }

  .res-review-label {
    font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    color: #8b8b9c; margin-bottom: 12px;
  }
  .res-list { display: flex; flex-direction: column; gap: 8px; }
  .res-item { border: 1.5px solid #ececf2; border-radius: 11px; overflow: hidden; }
  .res-item-top {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
    padding: 12px 15px;
  }
  .res-item-top:hover { background: #fafafd; }
  .res-mark {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .res-mark svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .res-mark.ok { background: #34c759; }
  .res-mark.no { background: #ff3b30; }
  .res-item-q {
    flex: 1; font-size: 13.5px; font-weight: 600; color: #2a2a3a; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  }
  .res-chev { width: 13px; height: 13px; margin-top: 4px; stroke: #b4b4c4; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; transition: transform .2s; }
  .res-item.open .res-item-q { -webkit-line-clamp: unset; font-weight: 700; color: #1a1a2e; }
  .res-item.open .res-chev { transform: rotate(180deg); }
  .res-item-body { display: none; padding: 4px 15px 15px 49px; }
  .res-item.open .res-item-body { display: block; }
  .res-why { font-size: 13px; line-height: 1.6; color: #55556a; background: #f7f7fb; border-left: 3px solid var(--c); border-radius: 8px; padding: 11px 13px; margin-top: 12px; }

  .res-actions { display: flex; gap: 12px; margin-top: 26px; padding-top: 20px; border-top: 1px solid #ececf2; flex-wrap: wrap; }


  @media (max-width: 900px) {
    .topic-grid { grid-template-columns: repeat(2, 1fr); }
    .nav-links { display: none; }
  }
</style>
</head>

<div class="wrap">

    <h1>Pick a topic to <span class="accent">practice</span></h1>
    <p>Every topic runs a 10-question set with full rationales. Choose one to start.</p>
  </div>

  <div class="topic-section">
    <div class="topic-section-head">
      <h2>NCLEX Client Needs</h2>
      <span>The 8 official test plan categories</span>
    </div>
    <div class="topic-grid" id="gridCategories"></div>
  </div>

  <div class="topic-section">
    <div class="topic-section-head">
      <h2>Clinical Subjects</h2>
      <span>Practice by body system and specialty</span>
    </div>
    <div class="topic-grid" id="gridSubjects"></div>
  </div>

  <!-- practice panel expands here, pushing everything below downward -->
  <div id="practiceSlot"></div>

</div>

<script>
const BANK = {"management-of-care": [{"q": "A registered nurse on a busy medical-surgical unit must delegate tasks to an unlicensed assistive personnel (UAP). Which task is appropriate for the RN to delegate to the UAP?", "opts": ["Performing the admission assessment on a client just arrived from the emergency department", "Obtaining a routine set of vital signs on a stable client 2 days postoperative from a hernia repair", "Teaching a newly diagnosed diabetic client how to self-administer insulin", "Evaluating whether a client's pain improved after receiving morphine 30 minutes ago"], "a": 1, "r": "Delegation rules permit the UAP to perform standardized, predictable tasks such as vital signs on a stable client. Admission assessment, teaching, and evaluation of a medication response all require nursing judgment and cannot be delegated because assessment, planning, and evaluation steps of the nursing process remain the RN's responsibility.", "why": ["Admission assessment requires nursing judgment and interpretation of data, so it belongs to the RN and cannot be handed to unlicensed personnel.", "Correct. Vital signs on a stable postoperative client are a standardized, predictable task with a known routine, squarely within UAP training and scope.", "Insulin self-administration teaching is client education, a nursing responsibility that unlicensed assistive personnel are neither licensed nor trained to perform.", "Judging whether morphine relieved the pain is evaluation of a medication response, a nursing process step the RN must retain."]}, {"q": "A client scheduled for a laparoscopic cholecystectomy tells the nurse, \"I signed the consent, but I still don't understand what they are going to remove.\" What is the nurse's best action?", "opts": ["Explain the surgical procedure in detail using a diagram", "Reassure the client that the surgeon is highly experienced", "Notify the surgeon so the procedure can be explained before the client goes to the operating room", "Document that the client is anxious and continue preoperative preparation"], "a": 2, "r": "Informed consent requires that the provider performing the procedure disclose its nature, risks, and alternatives; the nurse witnesses the signature and verifies understanding. Explaining the procedure herself would exceed the nurse's role, so the correct action is to stop the process and notify the surgeon to complete the disclosure.", "why": ["Explaining the surgical procedure in detail exceeds the nurse's role; disclosure of nature, risks, and alternatives belongs to the operating surgeon.", "Praising the surgeon's experience is false reassurance that ignores the knowledge gap and leaves the consent legally invalid.", "Correct. The client's statement shows consent was not informed, so the surgeon must return and complete the disclosure before surgery proceeds.", "Charting anxiety and continuing preparation sends the client to the operating room without informed consent, a legal and ethical failure."]}, {"q": "Four clients are waiting to be seen at the start of the shift. Which client should the charge nurse assign the registered nurse to assess first?", "opts": ["A client with new-onset shortness of breath and an oxygen saturation of 87% on room air", "A client requesting pain medication for incisional pain rated 7 of 10", "A client whose IV site is due to be rotated per policy", "A client asking for discharge instructions before leaving in 2 hours"], "a": 0, "r": "Airway and breathing problems take precedence under the ABC framework, and a saturation of 87% signals hypoxemia requiring immediate intervention. Pain, IV rotation, and discharge teaching are important but do not pose an immediate physiologic threat, so they are addressed after the respiratory issue is resolved.", "why": ["Correct. A saturation of 87% with new dyspnea is a breathing problem under the ABCs and signals hypoxemia needing immediate intervention.", "Pain rated 7 of 10 deserves prompt treatment, but incisional pain is not an immediate physiologic threat and follows the hypoxemic client.", "Routine IV site rotation is a scheduled policy task that can safely wait until the hypoxemic client has been assessed.", "Discharge teaching matters, but the client is not leaving for two hours, making this the least urgent of the four."]}, {"q": "A client with terminal cancer has a valid advance directive stating no cardiopulmonary resuscitation. The adult daughter arrives and insists, \"You have to do everything if his heart stops.\" What is the nurse's most appropriate response?", "opts": ["\"I will change the code status now since you are next of kin.\"", "\"Your father cannot make decisions anymore, so we follow your wishes.\"", "\"I will ask the provider to write a full code order to avoid a conflict.\"", "\"Your father's advance directive guides his care; let's talk with the provider together about his wishes.\""], "a": 3, "r": "A valid advance directive expresses the competent client's own wishes and legally directs care; a family member cannot override it while it remains valid. Acknowledging the daughter's distress and arranging a discussion with the provider supports the client's autonomy while addressing the family's emotional needs.", "why": ["The nurse cannot unilaterally change code status, and next of kin cannot override a valid advance directive written by the client.", "This is factually wrong; the directive was created while the client was competent and continues to express his wishes now.", "Requesting a full code order simply to avoid family conflict overrides the client's documented wishes and violates his autonomy.", "Correct. Upholding the directive while inviting the daughter into a conversation with the provider protects client autonomy and addresses her distress."]}, {"q": "A nurse overhears two staff members discussing a hospitalized client's HIV status in a crowded elevator. Which action should the nurse take first?", "opts": ["Report the staff members to the state board of nursing", "Document the names of everyone in the elevator", "Ask the staff members to stop the conversation and move to a private area", "Notify the client that the disclosure occurred"], "a": 2, "r": "Protecting confidentiality requires immediately stopping the ongoing breach, which is accomplished by asking the staff to end the discussion in a public area. Reporting through the chain of command may follow, but it does not stop the disclosure that is happening at that moment.", "why": ["Reporting to the state board skips the chain of command and does nothing about the breach happening in the elevator right now.", "Recording the names of bystanders documents the breach but does not stop the confidential information still being disclosed.", "Correct. Stopping the conversation and moving it to a private area immediately halts the ongoing confidentiality breach, which is the first priority.", "Informing the client may be appropriate later through facility process, but it does not interrupt the disclosure occurring at this moment."]}, {"q": "The registered nurse is planning assignments for a licensed practical/vocational nurse (LPN/LVN) on a medical unit. Which client is most appropriate to assign to the LPN/LVN?", "opts": ["A client receiving the first dose of IV vancomycin", "A stable client with heart failure requiring daily weights and oral furosemide administration", "A client newly admitted with chest pain and an unread 12-lead ECG", "A client receiving blood product transfusion started 10 minutes ago"], "a": 1, "r": "LPN/LVN scope typically includes administering oral medications and monitoring stable clients with predictable outcomes. First-dose IV antibiotics, unstable chest pain admissions, and the initiation phase of blood transfusion require the RN's assessment and judgment in most facilities.", "why": ["A first dose of IV vancomycin carries risk of hypersensitivity and infusion reactions, requiring RN assessment and close monitoring.", "Correct. A stable heart failure client needing daily weights and oral furosemide has predictable outcomes well within LPN/LVN scope of practice.", "New chest pain with an unread ECG is an unstable, unpredictable situation demanding RN assessment and rapid clinical judgment.", "The first minutes of a transfusion are when reactions occur, so the RN must monitor during the initiation phase."]}, {"q": "A client with a new colostomy is being discharged home alone and expresses difficulty managing the appliance. Which action by the nurse best demonstrates appropriate continuity of care?", "opts": ["Provide written instructions and instruct the client to call the clinic with questions", "Ask the family to visit daily to change the appliance", "Delay the discharge until the client changes the appliance without help", "Initiate a referral for home health nursing and an enterostomal therapy consult"], "a": 3, "r": "Coordinating a home health and ostomy specialist referral extends professional support into the home and addresses the identified self-care deficit. Written instructions alone do not ensure competence, and delaying discharge is not necessary when community resources can meet the need.", "why": ["Written instructions alone neither build skill nor confirm competence in a client who has already voiced difficulty managing the appliance.", "Assigning appliance changes to family ignores the client's own self-care goal and assumes availability and willingness that were never established.", "Holding discharge until the client is fully independent is unnecessarily restrictive when community resources can support continued learning at home.", "Correct. Home health and enterostomal therapy referrals extend professional teaching and support into the home, directly addressing the identified self-care deficit."]}, {"q": "A nurse discovers that a colleague documented a full head-to-toe assessment on a client the colleague never saw. What is the nurse's priority action?", "opts": ["Report the falsified documentation to the nurse manager", "Ask the colleague to correct the entry before the end of shift", "Assess the client personally and say nothing further", "Write an anonymous note to the risk management department"], "a": 0, "r": "Falsified documentation is a legal and safety issue that must be reported through the appropriate chain of command, beginning with the nurse manager. Allowing a peer to quietly amend the record or handling it anonymously fails the nurse's duty to advocate for client safety and accurate records.", "why": ["Correct. Falsified documentation is a legal and client-safety violation that must be reported up the chain of command to the nurse manager.", "Asking the colleague to quietly fix the entry conceals falsification and makes the nurse complicit in an inaccurate legal record.", "Assessing the client is appropriate, but saying nothing leaves fabricated data in the permanent record and the behavior unaddressed.", "An anonymous note bypasses the chain of command and prevents any follow-up, verification, or accountability for the concern."]}, {"q": "During a change-of-shift handoff for a client transferred from the intensive care unit, which information is most important for the nurse to communicate?", "opts": ["The client's food preferences and family visiting pattern", "The client's insurance authorization status", "The current vasoactive drip rate, most recent blood pressure, and pending laboratory results", "The name of the admitting physician and the room number"], "a": 2, "r": "Effective handoff communication prioritizes current physiologic status, active high-alert therapies, and pending results that will drive imminent decisions. Demographic and administrative details are useful but do not affect immediate client safety during the transition of care.", "why": ["Food preferences and visiting patterns support comfort planning but do not influence immediate safety decisions during this transfer.", "Insurance authorization is an administrative detail with no bearing on the client's physiologic stability at the moment of handoff.", "Correct. The active vasoactive drip rate, latest blood pressure, and pending labs drive the imminent decisions the receiving nurse must make.", "Physician name and room number are routine identifiers already in the record and carry no urgent clinical weight during handoff."]}, {"q": "A client hospitalized with a stroke has slurred speech and a swallowing deficit and lives alone in a second-floor walk-up apartment. Which action by the case-managing nurse is most appropriate?", "opts": ["Request a psychiatric consultation for adjustment to disability", "Arrange for the client to be discharged with a family member's phone number", "Schedule a follow-up appointment in the neurology clinic in 6 weeks", "Coordinate an interprofessional discharge conference with speech therapy, physical therapy, and social work"], "a": 3, "r": "Case management for complex post-stroke needs requires coordinating an interprofessional plan that addresses dysphagia, mobility, and the unsafe home environment before discharge. A single clinic appointment weeks later leaves the immediate aspiration and fall risks unmanaged.", "why": ["Psychiatric consultation may help later with adjustment, but it does nothing about the immediate dysphagia, mobility, and stair-climbing hazards.", "A family member's phone number is not a discharge plan and leaves aspiration and fall risks completely unmanaged at home.", "Neurology follow-up is appropriate, but six weeks is far too delayed to address needs that exist the day of discharge.", "Correct. An interprofessional conference addresses swallowing, mobility, and the second-floor walk-up together before discharge, which is the case manager's role."]}], "safety-infection-control": [{"q": "A client is admitted with a productive cough, night sweats, weight loss, and a chest x-ray showing upper lobe cavitation. Which action should the nurse take first?", "opts": ["Obtain three sputum specimens for acid-fast bacillus testing", "Administer the first dose of isoniazid and rifampin", "Place the client in an airborne infection isolation room and apply a fit-tested N95 respirator before entering", "Notify the local public health department of a suspected case"], "a": 2, "r": "Suspected pulmonary tuberculosis requires immediate airborne precautions in a negative-pressure room with N95 respiratory protection to prevent transmission to staff and other clients. Sputum collection, medications, and public health notification are all necessary but occur after the transmission risk is contained.", "why": ["Sputum for acid-fast bacillus testing is essential to diagnosis, but collecting it before isolation exposes staff to airborne organisms.", "Treatment should not start before specimens are collected, and giving medication does nothing to stop transmission in the meantime.", "Correct. Cavitary upper lobe disease with night sweats suggests tuberculosis, so airborne isolation and N95 protection must precede every other action.", "Public health notification is legally required but occurs after the client is isolated and the transmission risk has been contained."]}, {"q": "A client with Clostridioides difficile infection has frequent watery stools. Which action by the nursing student requires the instructor to intervene?", "opts": ["Wearing a gown and gloves to enter the client's room", "Cleaning the client's bedside table with an alcohol-based wipe", "Using a dedicated stethoscope kept in the client's room", "Washing hands with soap and water after removing gloves"], "a": 1, "r": "C. difficile spores are not killed by alcohol; environmental surfaces require a sporicidal agent such as a bleach-based disinfectant. Gown and gloves, dedicated equipment, and soap-and-water handwashing are all correct components of contact precautions for this organism.", "why": ["Gown and gloves are precisely what contact precautions require for C. difficile, so this needs no correction from the instructor.", "Correct. Alcohol does not kill C. difficile spores; surfaces require a sporicidal bleach-based disinfectant, so the instructor must intervene here.", "A dedicated stethoscope kept in the room prevents cross contamination and is standard practice under contact precautions.", "Soap and water physically removes spores that alcohol-based rubs cannot kill, making this the correct hand hygiene choice."]}, {"q": "A nurse is leaving the room of a client on contact and droplet precautions. In which order should the nurse remove personal protective equipment?", "opts": ["Mask, gloves, goggles, gown", "Gown, gloves, goggles, mask", "Goggles, mask, gown, gloves", "Gloves, goggles, gown, mask"], "a": 3, "r": "The most contaminated item, the gloves, is removed first, followed by eye protection and gown, with the mask removed last outside the room to maintain respiratory protection until the nurse has left. Removing the mask early exposes the mucous membranes to droplets still present in the room.", "why": ["Removing the mask first exposes the mucous membranes to droplets still in the room and leaves contaminated gloves on longest.", "Taking the gown off before gloves contaminates the hands and clothing, since gloves are the dirtiest item and must come off first.", "Starting with goggles leaves contaminated gloves on while working near the face and removes the mask before leaving the room.", "Correct. Gloves are most contaminated and come off first, followed by goggles and gown, with the mask removed last outside the room."]}, {"q": "An older adult client with delirium repeatedly pulls at the endotracheal tube despite reorientation, a bed alarm, and a family member at the bedside. A provider order for soft wrist restraints is obtained. Which nursing action is correct?", "opts": ["Assess the extremity for circulation, motion, and sensation and release the restraints at least every 2 hours", "Tie the restraint straps to the side rails so they move with the bed", "Keep the restraints in place continuously until the client is extubated", "Obtain a PRN restraint order to use whenever the night shift is short staffed"], "a": 0, "r": "Restraints require frequent neurovascular assessment and periodic release with repositioning and toileting to prevent injury and preserve skin integrity. Restraints must never be tied to movable side rails, PRN restraint orders are prohibited, and restraints require ongoing evaluation for the earliest possible discontinuation.", "why": ["Correct. Restrained limbs need regular circulation, motion, and sensation checks with release at least every two hours for repositioning and skin care.", "Straps tied to side rails move with the rail and can tighten or injure the client whenever the rail is raised or lowered.", "Continuous restraint without release or reassessment causes skin breakdown and neurovascular injury and ignores the mandate for earliest possible discontinuation.", "PRN restraint orders are prohibited, and staffing shortages are never a legitimate justification for restraining a client."]}, {"q": "A 78-year-old client admitted with syncope takes furosemide and zolpidem and scored high on the fall risk screening tool. Which intervention should the nurse implement first?", "opts": ["Request that a family member remain at the bedside overnight", "Keep the bed in the lowest position with the call light within reach and a bed exit alarm activated", "Apply a vest restraint at night to prevent the client from getting up", "Place the client in a room farthest from the nurses' station to reduce noise"], "a": 1, "r": "Environmental modifications such as a low bed, accessible call light, and an activated bed alarm are the least restrictive, evidence-based first-line fall interventions. Restraints actually increase injury risk and are never a first-line fall prevention measure, and moving the client away from the station reduces surveillance.", "why": ["Relying on a family member to stay overnight is unreliable and shifts responsibility for this client's safety away from nursing staff.", "Correct. A low bed, reachable call light, and activated exit alarm are the least restrictive evidence-based measures the nurse can implement immediately.", "Vest restraints increase the risk of serious injury and strangulation and are never a first-line fall prevention strategy.", "A room farthest from the nurses' station reduces surveillance of a high-risk client taking furosemide and zolpidem after syncope."]}, {"q": "A nurse is setting up a sterile field for a dressing change. Which observation indicates that the sterile field has been contaminated?", "opts": ["The nurse holds sterile gloved hands above waist level", "The nurse opens the outermost flap of the sterile package away from the body", "A bottle of sterile saline is poured with the label facing the palm", "The nurse turns away from the field to answer a question and then returns"], "a": 3, "r": "A sterile field must remain within the nurse's direct line of sight at all times; turning away means it can no longer be considered sterile. Holding hands above the waist, opening the far flap first, and palming the solution label are all correct sterile technique practices.", "why": ["Keeping sterile gloved hands above waist level and in view is correct sterile technique, not evidence of contamination.", "Opening the outermost flap away from the body prevents reaching across the field and is the proper opening sequence.", "Palming the label keeps solution from running onto it and is standard practice when pouring sterile saline.", "Correct. A sterile field must remain in the nurse's direct line of sight; turning away means it can no longer be considered sterile."]}, {"q": "A client receiving chemotherapy has an absolute neutrophil count of 380/mm3. Which instruction should the nurse include in the plan of care?", "opts": ["Avoid fresh, uncooked fruits and vegetables and fresh flowers or plants in the room", "Use a soft toothbrush and avoid flossing to prevent gum bleeding", "Limit fluid intake to 1000 mL per day to reduce fluid overload", "Wear a surgical mask at all times while alone in the private room"], "a": 0, "r": "Severe neutropenia requires protective environment measures that limit exposure to environmental organisms, including avoidance of raw produce, flowers, and standing water. A soft toothbrush addresses thrombocytopenia rather than neutropenia, and fluid restriction is not indicated for this problem.", "why": ["Correct. An absolute neutrophil count of 380 means severe neutropenia, so raw produce, flowers, and plants that harbor organisms must be avoided.", "A soft toothbrush and avoiding floss address bleeding from thrombocytopenia, not the infection risk created by a low neutrophil count.", "Fluid restriction is unrelated to neutropenia and could worsen dehydration and impair renal clearance of chemotherapy agents.", "Masking applies when the neutropenic client leaves the room or others enter, not while the client is alone in a private room."]}, {"q": "A college student is admitted with fever, nuchal rigidity, and a petechial rash, and bacterial meningitis is suspected. Which precaution should the nurse initiate?", "opts": ["Standard precautions only", "Airborne precautions with a negative-pressure room", "Droplet precautions with a surgical mask worn within 3 feet of the client", "Protective environment with positive-pressure airflow"], "a": 2, "r": "Neisseria meningitidis is transmitted by large respiratory droplets, so droplet precautions with a surgical mask are indicated until 24 hours of effective antibiotic therapy have been completed. Airborne precautions and a negative-pressure room are reserved for tuberculosis, measles, and varicella.", "why": ["Standard precautions alone will not prevent droplet spread of Neisseria meningitidis to staff, visitors, and other clients.", "Airborne precautions with negative pressure are reserved for tuberculosis, measles, and varicella, not for meningococcal disease.", "Correct. Fever, nuchal rigidity, and a petechial rash suggest meningococcal meningitis, spread by large droplets requiring a mask within three feet.", "A protective environment with positive airflow shields immunocompromised clients from outside organisms; it does not contain this client's droplets."]}, {"q": "A nurse prepares to administer heparin and notices the vial is labeled 10,000 units/mL while the order reads 5,000 units subcutaneously. Which action best reflects error prevention practice?", "opts": ["Administer 0.5 mL and document the dose given", "Withhold the dose and notify the pharmacy that the order is wrong", "Ask the client whether this is the usual dose received at home", "Verify the calculated dose with a second nurse before administration, per high-alert medication policy"], "a": 3, "r": "Heparin is a high-alert medication that requires independent double-check of the dose and concentration by a second nurse to intercept calculation errors before they reach the client. Proceeding alone or relying on the client's recollection does not meet the standard for high-alert medication safety.", "why": ["The calculation may be right, but giving a high-alert drug without an independent double check skips a required safety barrier.", "The order is not wrong; only the vial concentration differs, and withholding the anticoagulant needlessly delays prescribed therapy.", "The client's recollection of a home dose is not a verification method and cannot validate this order or vial concentration.", "Correct. Heparin is a high-alert medication, so independent second-nurse verification of dose and concentration intercepts calculation errors before administration."]}, {"q": "A chemotherapy agent spills on the floor of a client's room. Which action should the nurse take first?", "opts": ["Wipe the spill with absorbent towels and place them in the regular trash", "Restrict access to the area and obtain the chemotherapy spill kit before cleanup", "Call environmental services to mop the area with detergent", "Open the window and move the client to a chair across the room"], "a": 1, "r": "Hazardous drug spills require containment of the area and use of a designated spill kit with appropriate PPE before any cleanup begins, protecting staff and clients from cytotoxic exposure. Routine cleaning methods and disposal in regular trash violate hazardous materials handling requirements.", "why": ["Wiping a cytotoxic spill with ordinary towels and discarding them in regular trash exposes staff and violates hazardous waste rules.", "Correct. Restricting access and obtaining the designated chemotherapy spill kit with proper PPE must precede any cleanup of a cytotoxic agent.", "Environmental services staff are not trained or equipped for cytotoxic spills, and detergent mopping only spreads the hazardous drug.", "Moving the client is reasonable, but opening a window is not spill control and cleanup still requires the spill kit first."]}], "health-promotion": [{"q": "A parent brings a healthy 2-month-old infant to the clinic. Which immunizations should the nurse anticipate administering at this visit?", "opts": ["Rotavirus, DTaP, Haemophilus influenzae type b, pneumococcal conjugate, and inactivated poliovirus", "Measles-mumps-rubella and varicella", "Tetanus-diphtheria booster and meningococcal conjugate", "Human papillomavirus series and hepatitis A"], "a": 0, "r": "At 2 months the recommended schedule includes rotavirus, DTaP, Hib, pneumococcal conjugate, and IPV, along with the second hepatitis B dose. MMR and varicella are live vaccines not given until 12 to 15 months, and Td, meningococcal, and HPV are adolescent vaccines.", "why": ["Correct. The two-month schedule includes rotavirus, DTaP, Hib, pneumococcal conjugate, and inactivated poliovirus, along with the second hepatitis B dose.", "MMR and varicella are live vaccines withheld until 12 to 15 months, when maternal antibody has waned enough for response.", "Td boosters and meningococcal conjugate vaccine are adolescent immunizations and have no place in a two-month-old's schedule.", "HPV vaccination begins in adolescence and hepatitis A at 12 months, so neither is due at this two-month visit."]}, {"q": "The nurse is assessing a 12-month-old at a well-child visit. Which finding should prompt further developmental evaluation?", "opts": ["Says two or three words besides mama and dada", "Pulls to a stand and cruises along furniture", "Uses a crude pincer grasp to pick up small pieces of cereal", "Has not yet developed head control when pulled to sitting"], "a": 3, "r": "Head control is normally achieved by about 4 months, so its absence at 12 months is a significant red flag requiring referral. Speaking a few words, cruising, and a pincer grasp are all expected 12-month milestones and need no further workup.", "why": ["Saying two or three words besides mama and dada is an expected 12-month language milestone requiring no further evaluation.", "Pulling to a stand and cruising along furniture are normal gross motor achievements for a 12-month-old.", "A crude pincer grasp for picking up cereal is precisely the fine motor skill expected at 12 months.", "Correct. Head control normally appears by about four months, so its absence at 12 months is a major red flag warranting referral."]}, {"q": "A client at 28 weeks' gestation asks about her upcoming prenatal testing. Which screening should the nurse tell her to expect at this visit?", "opts": ["Group B streptococcus vaginal and rectal culture", "One-hour 50-gram glucose challenge test and repeat hemoglobin", "Nuchal translucency ultrasound", "Amniocentesis for fetal lung maturity"], "a": 1, "r": "Gestational diabetes screening with the 50-gram glucose challenge and a repeat hemoglobin are standard between 24 and 28 weeks. Group B streptococcus culture is done at 36 to 37 weeks and nuchal translucency is a first-trimester screen, so neither belongs at 28 weeks.", "why": ["Group B streptococcus culture is collected at 36 to 37 weeks to guide intrapartum prophylaxis, so it is not due now.", "Correct. The one-hour 50-gram glucose challenge and a repeat hemoglobin are routinely performed between 24 and 28 weeks' gestation.", "Nuchal translucency ultrasound is a first-trimester screen done around 11 to 14 weeks and cannot be performed at 28 weeks.", "Amniocentesis for fetal lung maturity is used only when preterm delivery is being considered, never as routine prenatal screening."]}, {"q": "On the third postpartum day after a vaginal birth, the nurse assesses a client's lochia. Which finding should the nurse report to the provider?", "opts": ["Pinkish-brown discharge with a fleshy odor", "Small clots noted on the perineal pad on rising in the morning", "Saturation of one perineal pad within 15 minutes with bright red blood", "A firm fundus located two fingerbreadths below the umbilicus"], "a": 2, "r": "Saturating a pad in 15 minutes with bright red bleeding indicates postpartum hemorrhage and requires immediate provider notification and fundal assessment. Lochia serosa, small clots after lying down, and an involuting firm fundus are all expected findings on postpartum day 3.", "why": ["Pinkish-brown lochia serosa with a fleshy odor is the expected discharge on the third postpartum day.", "Small clots on the pad after lying still overnight reflect normal pooling and do not alone indicate hemorrhage.", "Correct. Saturating a perineal pad within 15 minutes with bright red blood signals postpartum hemorrhage requiring immediate fundal assessment and provider notification.", "A firm fundus two fingerbreadths below the umbilicus demonstrates normal involution on postpartum day three."]}, {"q": "A 52-year-old client with no family history of cancer asks the nurse which routine screenings are recommended. Which response is most accurate?", "opts": ["\"Colorectal cancer screening should start at age 65 for average-risk adults.\"", "\"You should have a prostate-specific antigen test every 6 months starting now.\"", "\"Annual chest x-rays are recommended for all adults over 50.\"", "\"Average-risk adults should begin colorectal cancer screening at age 45, and mammography is recommended for women in your age group.\""], "a": 3, "r": "Current guidelines lower the start of average-risk colorectal cancer screening to age 45, and mammography is recommended for women in the 40s to 50s age range. Routine annual chest x-rays are not a recommended screening test, and semiannual PSA testing is not the standard for average-risk clients.", "why": ["Average-risk colorectal screening now begins at 45, so telling this 52-year-old to wait until 65 dangerously delays detection.", "Semiannual PSA testing is not the standard for average-risk clients; prostate screening is a shared decision made no more often than annually.", "Routine annual chest x-rays are not a recommended screening test and expose clients to radiation without proven benefit.", "Correct. Average-risk colorectal cancer screening starts at age 45, and mammography is recommended for women in this client's age group."]}, {"q": "The nurse is teaching a group of older adults about normal age-related changes. Which statement by a participant indicates a finding that is NOT a normal part of aging and requires follow-up?", "opts": ["\"I have become confused and disoriented over the past two days.\"", "\"It takes me longer to fall asleep than it used to.\"", "\"I need reading glasses for small print now.\"", "\"My skin seems drier and less elastic than when I was younger.\""], "a": 0, "r": "Acute confusion over days suggests delirium from an underlying cause such as infection, dehydration, or medication and always warrants prompt evaluation. Longer sleep latency, presbyopia, and decreased skin turgor and moisture are expected physiologic changes of aging.", "why": ["Correct. Confusion and disorientation developing over two days suggest delirium from infection, dehydration, or medication and require prompt evaluation.", "Taking longer to fall asleep is a well-documented normal change in the aging sleep cycle and needs no workup.", "Needing reading glasses for small print reflects presbyopia, the expected age-related loss of lens accommodation.", "Drier, less elastic skin results from normal age-related declines in sebum production and dermal collagen."]}, {"q": "A school nurse is screening adolescents for idiopathic scoliosis. Which assessment technique is correct?", "opts": ["Measure the standing height and compare it with growth charts", "Have the student stand on one leg while the nurse palpates the hips", "Ask the student to bend forward at the waist with arms hanging and observe for rib hump and shoulder asymmetry", "Have the student walk on the toes and heels while the nurse observes gait"], "a": 2, "r": "The Adams forward bend test reveals the rib prominence and asymmetry of the shoulders, scapulae, and waist that characterize scoliosis. Height measurement and gait testing do not detect lateral spinal curvature and are not the recognized screening technique.", "why": ["Comparing standing height with growth charts screens for growth disorders and cannot reveal lateral curvature of the spine.", "Single-leg stance with hip palpation assesses hip stability and leg length, not the spinal rotation that defines scoliosis.", "Correct. The Adams forward bend test exposes the rib hump and shoulder, scapular, and waist asymmetry characteristic of idiopathic scoliosis.", "Toe and heel walking evaluates neurologic function and gait, which is unrelated to screening for scoliosis."]}, {"q": "A 49-year-old client reports hot flashes, irregular menses, and vaginal dryness. Which self-care measure should the nurse recommend?", "opts": ["Increase caffeine intake to combat fatigue", "Dress in layers, use a water-soluble lubricant, and perform weight-bearing exercise with adequate calcium and vitamin D", "Discontinue all contraception immediately since pregnancy is no longer possible", "Restrict fluids in the evening to reduce night sweats"], "a": 1, "r": "Perimenopausal self-care emphasizes layered clothing for vasomotor symptoms, water-soluble lubricants for atrophic changes, and weight-bearing exercise with calcium and vitamin D for bone health. Caffeine tends to worsen hot flashes, and ovulation may still occur during perimenopause so contraception is still needed.", "why": ["Caffeine is a vasomotor trigger that typically worsens hot flashes and further disrupts sleep during perimenopause.", "Correct. Layered clothing, water-soluble lubricant, and weight-bearing exercise with calcium and vitamin D address vasomotor, atrophic, and bone changes together.", "Ovulation can still occur irregularly during perimenopause, so stopping contraception now risks an unintended pregnancy.", "Restricting evening fluids does not affect vasomotor night sweats and can leave this client dehydrated."]}, {"q": "A new parent asks the nurse about safe sleep for a healthy 3-week-old newborn. Which statement indicates the teaching was effective?", "opts": ["\"I will place my baby on the back to sleep on a firm mattress with no blankets, bumper pads, or stuffed toys.\"", "\"I will put my baby to sleep on the stomach so she doesn't choke if she spits up.\"", "\"I will let my baby sleep in bed with us so I can nurse more easily at night.\"", "\"I will prop my baby on her side with a rolled blanket behind her back.\""], "a": 0, "r": "Supine positioning on a firm, bare sleep surface in the parents' room but not in their bed is the evidence-based standard for reducing sudden infant death syndrome. Prone and side positioning and bed sharing with soft bedding all significantly increase SIDS and suffocation risk.", "why": ["Correct. Supine sleep on a firm, bare surface without blankets, bumper pads, or toys is the evidence-based standard for reducing SIDS.", "Prone positioning markedly raises SIDS risk, and healthy infants protect their own airway when spitting up on the back.", "Bed sharing with adults and soft bedding significantly increases suffocation and SIDS risk; room sharing without bed sharing is advised.", "Side positioning is unstable and the infant can roll prone, and the rolled blanket itself is a suffocation hazard."]}, {"q": "A client with a body mass index of 31 kg/m2 and a sedentary job tells the nurse, \"I want to get healthier but I have no time to exercise.\" Which response by the nurse best supports lifestyle change?", "opts": ["\"You should join a gym and work out for an hour each day.\"", "\"If you don't lose weight now, you will likely develop diabetes.\"", "\"Let's look at your week together and find two or three realistic 10-minute activity blocks to start with.\"", "\"Most people in your situation are unable to change without medication.\""], "a": 2, "r": "Collaborating with the client to set small, achievable goals reflects health promotion principles and increases self-efficacy and adherence. Prescriptive demands and fear-based warnings tend to increase resistance and do not address the barrier the client actually identified.", "why": ["Prescribing an hour of daily gym time ignores the exact barrier the client named and sets an unrealistic starting goal.", "A fear-based warning about diabetes tends to increase defensiveness and still does not solve the client's time problem.", "Correct. Collaboratively finding two or three realistic ten-minute activity blocks addresses the stated barrier and builds the self-efficacy that sustains change.", "Telling the client that most people cannot change without medication is inaccurate and undermines motivation and confidence."]}], "psychosocial": [{"q": "A client newly diagnosed with amyotrophic lateral sclerosis says, \"There is no point in any of this anymore.\" Which response by the nurse is most therapeutic?", "opts": ["\"You should focus on the good years you still have ahead of you.\"", "\"Many people with this diagnosis live longer than expected.\"", "\"Would you like me to call the chaplain to talk with you?\"", "\"Tell me more about what you mean when you say there is no point.\""], "a": 3, "r": "Asking the client to elaborate uses exploration and keeps the focus on the client's feelings while allowing the nurse to assess for hopelessness and suicidal ideation. Offering false reassurance or immediately redirecting to the chaplain closes communication and avoids the client's expressed distress.", "why": ["Telling the client to focus on good years ahead is false reassurance that dismisses the hopelessness he just expressed.", "Quoting survival statistics shifts the conversation to facts and shuts down the client's chance to describe what he feels.", "A chaplain may help later, but referring now hands off the conversation instead of assessing this client's distress.", "Correct. Exploring what he means keeps the focus on his feelings and lets the nurse assess for hopelessness and suicidal ideation."]}, {"q": "A widow whose spouse died 14 months ago tells the nurse she still sets a place at the table for him each night, cannot return to work, and has lost 20 pounds. How should the nurse interpret these findings?", "opts": ["These findings suggest complicated grief and the client should be referred for evaluation", "This is a normal expression of grief that requires no intervention", "The client is demonstrating denial, which is a healthy defense mechanism", "The client should be told to remove the extra place setting to promote acceptance"], "a": 0, "r": "Persistent functional impairment, significant weight loss, and behaviors that maintain the deceased as present more than a year later characterize complicated or prolonged grief disorder and warrant referral. Simply calling it normal or directing the client to change a behavior fails to address the underlying pathology.", "why": ["Correct. Inability to work, twenty-pound weight loss, and keeping the deceased present after 14 months indicate complicated grief needing referral.", "Normal grief does not usually include inability to return to work and significant weight loss more than a year after the death.", "Denial can be adaptive briefly, but sustained functional impairment at 14 months is pathological rather than healthy.", "Directing the client to remove the place setting targets one behavior without addressing the underlying prolonged grief disorder."]}, {"q": "A client admitted 36 hours ago after his last drink has a heart rate of 118, blood pressure 168/96, tremors, diaphoresis, and reports seeing bugs on the wall. Which action should the nurse take first?", "opts": ["Reorient the client and dim the lights in the room", "Encourage the client to attend the unit alcohol support group", "Administer the prescribed PRN lorazepam and initiate seizure precautions", "Restrict visitors to reduce environmental stimulation"], "a": 2, "r": "Autonomic hyperactivity with hallucinations 36 hours after the last drink signals severe alcohol withdrawal that can progress to seizures and delirium tremens; benzodiazepines plus seizure precautions are the priority treatment. Environmental measures are supportive but do not address the physiologic risk of withdrawal seizures.", "why": ["Reorientation and dim lighting are helpful supportive measures but do nothing to prevent the impending withdrawal seizures.", "A support group belongs later in recovery; this client is physiologically unstable and hallucinating and cannot participate meaningfully now.", "Correct. Tachycardia, hypertension, tremor, and hallucinations at 36 hours signal severe withdrawal, so benzodiazepines and seizure precautions come first.", "Restricting visitors lowers stimulation but leaves the autonomic hyperactivity and risk of withdrawal seizures entirely untreated."]}, {"q": "A client on the inpatient psychiatric unit states, \"I have been saving my pills, and tonight I'm going to take them all.\" Which nursing action is the priority?", "opts": ["Notify the client's family of the statement", "Institute one-to-one continuous observation and search for the hoarded medication", "Document the statement and discuss it in the morning treatment team meeting", "Ask the client to sign a no-suicide contract"], "a": 1, "r": "A client with a specific plan and available means requires immediate safety measures, including continuous observation and removal of the lethal means. No-suicide contracts have not been shown to prevent suicide and delaying action until the next team meeting leaves the client at imminent risk.", "why": ["Notifying the family may occur later, but it neither removes the hoarded pills nor keeps the client safe tonight.", "Correct. A specific plan with available means demands immediate one-to-one observation and removal of the hoarded lethal means.", "Waiting until the morning treatment team meeting leaves a client with a stated plan and pills unsupervised overnight.", "No-suicide contracts have no demonstrated protective effect and can give staff false reassurance while the means remain available."]}, {"q": "A nurse in the emergency department cares for a 4-year-old with a spiral fracture of the humerus. The parent states the child fell off a couch, and the nurse notes healing bruises in various stages on the child's back. What should the nurse do first?", "opts": ["Confront the parent about the inconsistency in the history", "Ask the child privately whether the parent caused the injuries", "Wait for the social worker to arrive before taking any action", "Document the objective findings precisely and report the suspected abuse per state mandatory reporting law"], "a": 3, "r": "Nurses are mandatory reporters and must report reasonable suspicion of abuse based on objective findings such as injury patterns inconsistent with the reported mechanism. Confronting the caregiver may escalate danger to the child, and reporting is a legal obligation that cannot be deferred to another discipline.", "why": ["Confronting the parent may provoke escalation and further endanger the child, and investigating the history is not the nurse's role.", "Interrogating a four-year-old about who caused the injuries can contaminate the investigation and belongs to trained forensic interviewers.", "Waiting for the social worker delays a legally mandated report that this nurse is personally required to make.", "Correct. A spiral humerus fracture with bruises of varying ages and an inconsistent history obligates objective documentation and a mandatory abuse report."]}, {"q": "A client experiencing a panic attack is hyperventilating, pacing, and unable to follow multi-step directions. Which nursing intervention is most appropriate?", "opts": ["Stay with the client and speak in short, simple sentences in a calm, low voice", "Leave the client alone in a quiet room until the attack subsides", "Explain the physiology of the panic response to help the client gain insight", "Encourage the client to describe the childhood events that may have caused the anxiety"], "a": 0, "r": "During severe or panic-level anxiety, perceptual field is markedly narrowed, so the nurse remains present and uses brief, concrete directions to promote safety and reduce stimulation. Teaching and insight-oriented exploration are ineffective at this level and are reserved for mild anxiety after the episode resolves.", "why": ["Correct. In panic-level anxiety the perceptual field narrows sharply, so staying present with brief, calm, concrete directions promotes safety and reduces stimulation.", "Leaving a panicking client alone removes support and increases the risk of injury while pacing during the attack.", "Explaining panic physiology requires cognitive processing this client cannot manage while unable to follow multi-step directions.", "Exploring childhood events is insight-oriented work appropriate only after anxiety has decreased to a mild level."]}, {"q": "A hospitalized client declines a prescribed transfusion, saying it conflicts with his religious beliefs. He is alert, oriented, and understands the consequences. What is the nurse's most appropriate action?", "opts": ["Administer the blood because the physician ordered it", "Document the refusal, notify the provider, and explore acceptable alternatives with the client and health care team", "Ask the family to persuade the client to accept the transfusion", "Tell the client that religious beliefs cannot override medical treatment in a hospital"], "a": 1, "r": "A competent adult has the right to refuse any treatment, including on religious grounds, and the nurse's role is to document, notify the provider, and advocate for culturally and spiritually acceptable alternatives. Administering the blood anyway would constitute battery and pressuring the client through family violates autonomy.", "why": ["Transfusing a competent adult who has refused constitutes battery, regardless of the physician's order.", "Correct. A competent adult may refuse any treatment, so the nurse documents, notifies the provider, and advocates for acceptable alternatives.", "Enlisting the family to persuade him applies coercion and violates the autonomous, informed decision he already made.", "Telling him religious beliefs cannot override treatment is factually false and dismisses a legally protected right to refuse."]}, {"q": "A 16-year-old with anorexia nervosa weighs 38 kg, has a heart rate of 44, potassium 2.9 mEq/L, and states, \"I still feel fat.\" Which problem should the nurse address first?", "opts": ["Disturbed body image related to distorted self-perception", "Ineffective coping related to perfectionistic thinking", "Risk for cardiac dysrhythmia related to bradycardia and hypokalemia", "Social isolation related to withdrawal from peers"], "a": 2, "r": "Applying Maslow and the ABCs, the life-threatening physiologic derangement of hypokalemia with bradycardia takes priority because it can precipitate fatal dysrhythmias. Body image distortion and coping are central to long-term recovery but are addressed once the client is medically stable.", "why": ["Body image distortion drives this illness and requires treatment, but it is not what threatens the client's life today.", "Ineffective coping is central to long-term recovery and is addressed after the client is medically stabilized.", "Correct. A potassium of 2.9 with a heart rate of 44 can precipitate fatal dysrhythmias, making cardiac risk the first priority.", "Social isolation matters for recovery but ranks well below a life-threatening electrolyte and cardiac derangement."]}, {"q": "A client arrives at the emergency department after a sexual assault, is trembling, and repeats, \"I should have fought back.\" Which response by the nurse best reflects crisis intervention principles?", "opts": ["\"You did what you needed to do to survive. I will stay with you, and you decide what happens next.\"", "\"Try not to think about it right now; the police will need your statement soon.\"", "\"Why didn't you call for help while it was happening?\"", "\"Most survivors feel better once the evidence collection is finished.\""], "a": 0, "r": "Crisis intervention after sexual assault centers on safety, nonjudgmental support, and restoring the survivor's sense of control over decisions. Asking why questions implies blame, and minimizing or postponing the client's feelings undermines trust and delays psychological stabilization.", "why": ["Correct. Affirming that the client survived, staying present, and letting the client decide next steps restores safety, control, and autonomy.", "Telling the client not to think about it minimizes the feelings and puts the police statement ahead of emotional stabilization.", "Asking why the client did not call for help implies blame and deepens the self-blame already being voiced.", "Predicting the client will feel better after evidence collection is false reassurance that dismisses present distress."]}, {"q": "A client with schizophrenia tells the nurse, \"The voices are telling me the staff are poisoning my food.\" Which response is most therapeutic?", "opts": ["\"I don't hear any voices, but I understand this is frightening for you. Are the voices telling you to harm anyone?\"", "\"No one here would ever poison your food; you are safe with us.\"", "\"What exactly are the voices saying about each staff member?\"", "\"You need to ignore the voices; they aren't real.\""], "a": 0, "r": "The nurse presents reality without arguing, validates the client's fear, and assesses for command hallucinations that could pose a safety risk. Denying the experience, arguing about the delusion, or exploring its content in detail can reinforce the false belief or escalate distress.", "why": ["Correct. This presents reality without arguing, validates the client's fear, and screens for command hallucinations that could threaten safety.", "Flatly denying any risk argues against the client's perception and tends to make the client feel disbelieved and more guarded.", "Asking for detailed content about each staff member explores the delusion and can reinforce the false belief.", "Telling the client to ignore voices that are not real dismisses a genuinely experienced perception and damages trust."]}], "basic-care-comfort": [{"q": "A client recovering from a stroke has been cleared for a dysphagia diet. Which action by the nurse promotes safe oral intake?", "opts": ["Offer thin liquids through a straw to encourage adequate hydration", "Position the client upright at 90 degrees with the chin tucked toward the chest during swallowing", "Encourage the client to talk during the meal to assess mental status", "Place food on the affected side of the mouth to stimulate sensation"], "a": 1, "r": "Upright positioning with a chin-tuck narrows the airway entrance and directs the bolus toward the esophagus, reducing aspiration risk. Thin liquids and straws increase aspiration in dysphagia, and food placed on the affected side tends to pocket and go unnoticed.", "why": ["Thin liquids move quickly and a straw delivers the bolus too fast, both increasing aspiration risk in dysphagia.", "Correct. Sitting fully upright with the chin tucked narrows the airway entrance and directs the bolus toward the esophagus.", "Talking during the meal opens the airway while swallowing and raises the chance of aspiration in this client.", "Food placed on the affected side pockets in the cheek unnoticed and can be aspirated later."]}, {"q": "Before administering an intermittent enteral feeding through a nasogastric tube, the nurse aspirates 320 mL of gastric residual. What is the nurse's best initial action?", "opts": ["Hold the feeding, return the aspirate, and reassess the residual in 1 hour while monitoring for distention", "Discard the aspirate and administer the full feeding as scheduled", "Flush the tube with 60 mL of water and increase the feeding rate", "Remove the tube and notify the provider that it is obstructed"], "a": 0, "r": "A large residual suggests delayed gastric emptying and increased aspiration risk, so the feeding is held, the aspirate returned to preserve electrolytes and gastric contents, and the residual rechecked. Administering the feeding anyway compounds the risk, and a high residual does not mean the tube is obstructed.", "why": ["Correct. A 320 mL residual suggests delayed gastric emptying, so hold the feeding, return the aspirate to preserve electrolytes, and recheck.", "Discarding the aspirate wastes electrolytes and gastric acid, and feeding on top of a large residual compounds aspiration risk.", "Increasing the rate worsens an already delayed gastric emptying problem and further raises the risk of aspiration.", "Aspirating 320 mL proves the tube is patent rather than obstructed, so removing it is unnecessary and based on faulty reasoning."]}, {"q": "A client taking an opioid after orthopedic surgery reports no bowel movement for 3 days and abdominal fullness. Which nursing intervention should be implemented first?", "opts": ["Administer a soapsuds enema", "Request an order for a bulk-forming laxative only", "Prepare the client for digital removal of stool", "Increase fluid intake, encourage ambulation, and give the prescribed stool softener with a stimulant laxative"], "a": 3, "r": "Opioid-induced constipation is managed first with the least invasive combination of hydration, activity, and a softener plus stimulant laxative. Bulk-forming agents alone can worsen opioid-related constipation, and enemas or manual disimpaction are reserved for when conservative measures fail.", "why": ["A soapsuds enema is invasive and irritating and is reserved for when conservative bowel measures have already failed.", "Bulk-forming laxatives used alone can worsen opioid-induced constipation by adding mass to an already slow-moving bowel.", "Digital removal of stool is a last resort for confirmed impaction, not a first intervention after three days.", "Correct. Hydration, ambulation, and a stool softener with a stimulant are the least invasive effective treatment for opioid-induced constipation."]}, {"q": "A client who had an indwelling urinary catheter removed 8 hours ago has not voided, reports suprapubic discomfort, and a bladder scan shows 480 mL. What should the nurse do first?", "opts": ["Reinsert an indwelling catheter", "Encourage the client to drink two glasses of water and rescan in 2 hours", "Assist the client to a normal voiding position, provide privacy and warm water over the perineum, and if unsuccessful notify the provider for straight catheterization", "Apply a heating pad to the abdomen and document the finding"], "a": 2, "r": "Noninvasive measures that trigger the voiding reflex are attempted first, and intermittent straight catheterization is preferred over reinsertion of an indwelling catheter to reduce catheter-associated urinary tract infection risk. Adding more fluid to an already distended bladder delays relief and risks bladder injury.", "why": ["Reinserting an indwelling catheter is more invasive and carries higher infection risk than intermittent straight catheterization if drainage becomes necessary.", "Adding fluid to a bladder already holding 480 mL increases distention, risks bladder injury, and delays relief for two hours.", "Correct. Normal voiding position, privacy, and warm perineal water stimulate the voiding reflex first, with straight catheterization if that fails.", "A heating pad and documentation alone leave 480 mL of retained urine undrained and the suprapubic discomfort unrelieved."]}, {"q": "A nurse is teaching a client with left leg weakness how to use a cane. Which instruction is correct?", "opts": ["Hold the cane in the right hand and advance the cane and the left leg together, then step with the right leg", "Hold the cane in the left hand and advance the cane with the left leg", "Hold the cane in the right hand and advance the right leg first", "Hold the cane with both hands in front of the body for maximum stability"], "a": 0, "r": "The cane is held on the stronger side and advanced with the weaker leg so the cane and the affected limb share the load and widen the base of support. Holding the cane on the weak side or advancing the strong leg first places full weight on the affected limb and increases fall risk.", "why": ["Correct. The cane goes in the stronger right hand and advances with the weak left leg so both share the load.", "Holding the cane in the left hand puts support on the same side as the weakness and narrows the base of support.", "Advancing the strong right leg first forces the weakened left leg to bear full body weight without cane support.", "A cane is a single-handed device; using both hands in front eliminates its function and destabilizes the gait."]}, {"q": "A bedbound client with limited mobility has nonblanchable erythema over the sacrum. Which intervention is the priority?", "opts": ["Massage the reddened area to improve circulation", "Apply a moisture barrier ointment and continue the current turning schedule", "Reposition the client at least every 2 hours off the sacrum and use pressure-redistribution support surfaces", "Elevate the head of the bed to 60 degrees for comfort"], "a": 2, "r": "Nonblanchable erythema is a stage 1 pressure injury, and relieving pressure through frequent repositioning and support surfaces is the essential intervention to prevent progression. Massaging compromised tissue can cause further damage, and elevating the head of the bed above 30 degrees increases shear over the sacrum.", "why": ["Massaging tissue over a bony prominence that is already injured can drive deeper damage and is contraindicated in pressure injury.", "Barrier ointment treats moisture damage, and continuing the current schedule ignores that this schedule already failed to prevent injury.", "Correct. Nonblanchable erythema is a stage 1 pressure injury, so offloading with repositioning and redistribution surfaces prevents further progression.", "Elevating the head above 30 degrees increases shear and pressure across the sacrum, worsening the existing injury."]}, {"q": "A hospitalized client reports difficulty falling asleep and frequent awakenings. Which nursing measure should the nurse implement first?", "opts": ["Request an order for a hypnotic medication at bedtime", "Offer a caffeinated beverage in the evening to normalize the schedule", "Encourage a long afternoon nap to make up for lost sleep", "Cluster nighttime care activities, dim lights, and reduce noise to allow uninterrupted sleep periods"], "a": 3, "r": "Nonpharmacologic sleep hygiene measures such as clustering care and controlling light and noise address the most common hospital causes of sleep disruption and carry no adverse effects. Hypnotics increase confusion and fall risk in hospitalized clients and should not be the first intervention, while daytime naps and caffeine further fragment nighttime sleep.", "why": ["Hypnotics increase confusion and fall risk in hospitalized clients and should not be the first sleep intervention attempted.", "Evening caffeine is a stimulant that lengthens sleep latency and further fragments this client's already disrupted sleep.", "A long afternoon nap reduces nighttime sleep drive and perpetuates the pattern of frequent nighttime awakenings.", "Correct. Clustering care, dimming lights, and reducing noise remove the most common hospital causes of disrupted sleep with no adverse effects."]}, {"q": "The nurse is assisting an unlicensed assistive personnel to transfer a client with right-sided hemiparesis from the bed to a wheelchair. Which action requires the nurse to intervene?", "opts": ["Locking the wheelchair wheels before beginning the transfer", "Positioning the wheelchair on the client's right side and pulling the client up by the axillae", "Applying a gait belt around the client's waist", "Instructing the client to place the stronger hand on the wheelchair armrest"], "a": 1, "r": "The wheelchair should be placed on the client's stronger side, and lifting under the axillae risks brachial plexus injury and shoulder subluxation. Locking the wheels, using a gait belt, and having the client push with the unaffected arm are all correct, safe transfer techniques.", "why": ["Locking the wheelchair wheels before the transfer prevents the chair from rolling and is correct technique needing no intervention.", "Correct. The wheelchair belongs on the stronger left side, and pulling under the axillae risks brachial plexus injury and shoulder subluxation.", "A gait belt provides a secure handhold at the client's center of gravity and is recommended for assisted transfers.", "Having the client push with the stronger left hand on the armrest is safe and encourages active participation."]}, {"q": "A client with osteoarthritis of the knees asks about nonpharmacologic ways to reduce morning stiffness and pain. Which recommendation is most appr
